<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>동규 누나를 피해 도망쳐라!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&display=swap');
    
    body {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Glassmorphism Styles */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .glass-pill {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Ambient Glow Effects */
    .glow-bg {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.3;
      pointer-events: none;
    }

    /* Game Canvas Styling */
    #gameCanvas {
      background: radial-gradient(circle, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      border-radius: 1.5rem;
      touch-action: none;
    }

    /* Neon Text Shadows */
    .neon-text-rose {
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.7), 0 0 30px rgba(244, 63, 94, 0.4);
    }

    .neon-text-amber {
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.7), 0 0 30px rgba(245, 158, 11, 0.4);
    }

    .neon-text-cyan {
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.7), 0 0 30px rgba(6, 182, 212, 0.4);
    }

    /* Direction Touch D-Pad */
    .d-btn {
      touch-action: manipulation;
    }
    .d-btn:active {
      transform: scale(0.92);
      background-color: rgba(99, 102, 241, 0.4);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 overflow-x-hidden relative selection:bg-rose-500 selection:text-white">

  <!-- Ambient Glow Backgrounds -->
  <div class="glow-bg w-80 h-80 bg-rose-600 -top-20 -left-20"></div>
  <div class="glow-bg w-80 h-80 bg-indigo-600 -bottom-20 -right-20"></div>

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-2 px-1 z-10">
    <div class="flex items-center space-x-2.5">
      <div class="bg-gradient-to-tr from-rose-600 via-pink-500 to-purple-600 p-2.5 rounded-2xl text-white shadow-lg shadow-rose-500/30">
        <i class="fa-solid fa-gamepad text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight font-jua text-rose-400">
          동규 누나 피하기 & 무기전
        </h1>
        <p class="text-[10px] text-slate-400 font-semibold tracking-wider">무기와 아이템을 활용해 최대한 오래 생존하라!</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button id="soundToggleBtn" class="w-10 h-10 glass-pill hover:bg-slate-800 active:scale-95 transition rounded-2xl text-slate-300 flex items-center justify-center">
        <i id="soundIcon" class="fa-solid fa-volume-high text-sm"></i>
      </button>
      <button id="statsModalBtn" class="w-10 h-10 glass-pill hover:bg-slate-800 active:scale-95 transition rounded-2xl text-slate-300 flex items-center justify-center">
        <i class="fa-solid fa-trophy text-sm text-amber-400"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center relative my-auto z-10">

    <!-- Top Status Bar (Time & Rage Level) -->
    <div class="w-full flex justify-between items-center glass-card px-4 py-2.5 rounded-2xl border border-white/10 mb-2 shadow-xl">
      <div class="flex flex-col">
        <span class="text-[10px] text-slate-400 font-extrabold uppercase tracking-wider">현재 생존 시간</span>
        <div id="survivalTimer" class="text-2xl font-black font-mono-num text-cyan-400 neon-text-cyan">
          0.00s
        </div>
      </div>

      <!-- Sister Rage Status -->
      <div class="flex flex-col items-end">
        <span id="rageLabel" class="text-[10px] text-rose-400 font-extrabold uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-fire text-rose-500"></i> 누나 광기 레벨
        </span>
        <div class="w-28 bg-slate-800 h-2.5 rounded-full overflow-hidden mt-1 border border-white/10">
          <div id="rageBar" class="bg-gradient-to-r from-amber-500 to-rose-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>

    <!-- Weapon Quick Inventory Bar -->
    <div class="w-full flex justify-between items-center gap-2 mb-2">
      <button id="useBombBtn" class="flex-1 glass-pill hover:bg-slate-800 p-2 rounded-xl border border-amber-500/30 flex items-center justify-between active:scale-95 transition">
        <span class="text-xs font-bold text-amber-300 flex items-center gap-1">🍠 폭탄 <span class="text-[9px] text-slate-400">(J)</span></span>
        <span id="bombCount" class="bg-amber-500/20 text-amber-300 font-mono-num font-black px-2 py-0.5 rounded-md text-xs">x1</span>
      </button>
      <button id="useBananaBtn" class="flex-1 glass-pill hover:bg-slate-800 p-2 rounded-xl border border-yellow-500/30 flex items-center justify-between active:scale-95 transition">
        <span class="text-xs font-bold text-yellow-300 flex items-center gap-1">🍌 바나나 <span class="text-[9px] text-slate-400">(K)</span></span>
        <span id="bananaCount" class="bg-yellow-500/20 text-yellow-300 font-mono-num font-black px-2 py-0.5 rounded-md text-xs">x2</span>
      </button>
      <button id="useShieldBtn" class="flex-1 glass-pill hover:bg-slate-800 p-2 rounded-xl border border-cyan-500/30 flex items-center justify-between active:scale-95 transition">
        <span class="text-xs font-bold text-cyan-300 flex items-center gap-1">🛡️ 방패 <span class="text-[9px] text-slate-400">(L)</span></span>
        <span id="shieldCount" class="bg-cyan-500/20 text-cyan-300 font-mono-num font-black px-2 py-0.5 rounded-md text-xs">x1</span>
      </button>
    </div>

    <!-- Game Canvas Wrapper -->
    <div class="relative w-full aspect-square max-w-md my-1 flex items-center justify-center">
      <canvas id="gameCanvas" class="w-full h-full border border-white/10 shadow-2xl"></canvas>

      <!-- Overlay Messages -->
      <div id="gameOverlay" class="absolute inset-0 rounded-3xl bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 transition-all duration-300">
        <div id="overlayBadge" class="p-3 bg-rose-500/20 text-rose-400 rounded-full mb-3 border border-rose-500/30">
          <i id="overlayIcon" class="fa-solid fa-wand-magic-sparkles text-3xl"></i>
        </div>

        <h2 id="overlayTitle" class="text-2xl font-black font-jua mb-1 text-white">
          동규 누나 무기전 (무제한)
        </h2>
        <p id="overlayDesc" class="text-xs text-slate-300 mb-5 max-w-xs font-medium leading-relaxed">
          고구마 폭탄(기절), 바나나 껍질(미끄러짐), 방패(무적)를 활용해 한계까지 도망치세요!
        </p>

        <div id="overlayBtnGroup" class="w-full max-w-xs space-y-2.5">
          <button id="startPlayBtn" class="w-full py-3.5 rounded-2xl font-black text-base shadow-xl tracking-wider transition-all duration-200 transform active:scale-95 bg-gradient-to-r from-rose-600 via-pink-600 to-purple-600 hover:from-rose-500 hover:to-purple-500 text-white shadow-rose-500/25 border border-white/20 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-play text-sm"></i>
            <span id="startBtnText">무기 장착하고 출발!</span>
          </button>
          
          <button id="resumePlayBtn" class="hidden w-full py-3.5 rounded-2xl font-black text-base shadow-xl tracking-wider transition-all duration-200 transform active:scale-95 bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-emerald-500/25 border border-white/20 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-play text-sm"></i>
            <span>이어서 도망치기</span>
          </button>
        </div>
      </div>
    </div>

    <!-- On-screen Mobile D-Pad Control -->
    <div class="w-full max-w-md flex justify-between items-center mt-2 px-2">
      <!-- In-Game Pause & Reset Buttons -->
      <div class="flex flex-col space-y-2">
        <button id="pauseBtn" class="px-4 py-2.5 glass-pill hover:bg-slate-800 active:scale-95 transition rounded-2xl text-amber-400 font-bold text-xs flex items-center space-x-1.5 border border-amber-500/30">
          <i id="pauseIcon" class="fa-solid fa-pause"></i>
          <span id="pauseText">일시정지</span>
        </button>
        <button id="restartBtn" class="px-4 py-2.5 glass-pill hover:bg-slate-800 active:scale-95 transition rounded-2xl text-slate-300 font-bold text-xs flex items-center space-x-1.5 border border-white/10">
          <i class="fa-solid fa-rotate-left"></i>
          <span>처음부터</span>
        </button>
      </div>

      <!-- Touch Directional Pad -->
      <div class="relative w-36 h-36 grid grid-cols-3 grid-rows-3 gap-1">
        <div></div>
        <button id="btnUp" class="d-btn bg-slate-800/80 rounded-xl border border-white/10 flex items-center justify-center text-slate-200 text-lg shadow-lg">
          <i class="fa-solid fa-caret-up"></i>
        </button>
        <div></div>

        <button id="btnLeft" class="d-btn bg-slate-800/80 rounded-xl border border-white/10 flex items-center justify-center text-slate-200 text-lg shadow-lg">
          <i class="fa-solid fa-caret-left"></i>
        </button>
        <div class="flex items-center justify-center text-[10px] text-slate-500 font-bold">MOVE</div>
        <button id="btnRight" class="d-btn bg-slate-800/80 rounded-xl border border-white/10 flex items-center justify-center text-slate-200 text-lg shadow-lg">
          <i class="fa-solid fa-caret-right"></i>
        </button>

        <div></div>
        <button id="btnDown" class="d-btn bg-slate-800/80 rounded-xl border border-white/10 flex items-center justify-center text-slate-200 text-lg shadow-lg">
          <i class="fa-solid fa-caret-down"></i>
        </button>
        <div></div>
      </div>
    </div>

  </main>

  <!-- Footer Record -->
  <footer class="w-full max-w-md glass-card rounded-2xl p-3 mt-2 z-10 border border-white/10 flex justify-between items-center text-xs">
    <div class="flex items-center space-x-2 text-slate-400">
      <i class="fa-solid fa-shield-halved text-amber-400 text-sm"></i>
      <span>최장 생존 타임:</span>
    </div>
    <div class="font-mono-num font-bold text-amber-300 text-sm">
      <span id="bestSurvivalDisplay">0.00초</span>
    </div>
  </footer>

  <!-- Stats Modal -->
  <div id="statsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card border border-white/10 w-full max-w-md rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="statsModalCard">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-400"></i> 탈출 성공 기록
        </h3>
        <button id="closeModalBtn" class="w-8 h-8 rounded-full glass-pill text-slate-400 hover:text-white flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Stats Display -->
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="bg-slate-800/40 p-3.5 rounded-2xl border border-white/5 text-center">
          <div class="text-[10px] text-slate-400 font-semibold mb-1">총 도전 횟수</div>
          <div id="statTotalGames" class="text-lg font-extrabold text-slate-100 font-mono-num">0</div>
        </div>
        <div class="bg-slate-800/40 p-3.5 rounded-2xl border border-white/5 text-center">
          <div class="text-[10px] text-slate-400 font-semibold mb-1">최고 생존 기록</div>
          <div id="statSuccesses" class="text-lg font-extrabold text-emerald-400 font-mono-num">0.00초</div>
        </div>
      </div>

      <!-- Recent Game Logs -->
      <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5">최근 탈출 기록</h4>
      <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
        <p class="text-xs text-slate-500 text-center py-6">기록이 아직 없습니다.</p>
      </div>

      <div class="mt-5 flex justify-end">
        <button id="clearDataBtn" class="text-xs text-rose-400 hover:text-rose-300 transition py-1 px-3 font-semibold">
          <i class="fa-solid fa-trash-can mr-1"></i> 기록 초기화
        </button>
      </div>
    </div>
  </div>

  <!-- Sound Effects Module -->
  <script>
    let isMuted = false;

    function playAudioTone(freq, duration, type = 'sine', vol = 0.15) {
      if (isMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playStartSfx() {
      playAudioTone(440, 0.1, 'triangle');
      setTimeout(() => playAudioTone(880, 0.2, 'sine'), 100);
    }

    function playHitSfx() {
      playAudioTone(150, 0.3, 'sawtooth', 0.3);
    }

    function playWinSfx() {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playAudioTone(freq, 0.2, 'sine', 0.2), i * 90);
      });
    }

    function playWeaponSfx() {
      playAudioTone(600, 0.15, 'square', 0.2);
    }

    function playItemSfx() {
      playAudioTone(1050, 0.1, 'sine', 0.2);
    }
  </script>

  <!-- Game Logic Engine -->
  <script>
    // Game Engine State Variables
    let gameState = 'IDLE';
    let elapsedTime = 0.00;
    let lastTimestamp = 0;
    let animFrameId = null;

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let canvasWidth = 360;
    let canvasHeight = 360;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      canvasWidth = canvas.width;
      canvasHeight = canvas.height;
    }

    window.addEventListener('resize', resizeCanvas);

    // Player Properties
    const player = {
      x: 180,
      y: 280,
      radius: 14,
      speed: 220,
      shieldActive: false,
      shieldTimer: 0
    };

    // Inventory
    let inventory = {
      bombs: 1,
      bananas: 2,
      shields: 1
    };

    // Sister Properties
    const sister = {
      x: 180,
      y: 60,
      radius: 20,
      speed: 100,
      color: '#f43f5e',
      stunnedTimer: 0,
      statusText: ''
    };

    // Entities Arrays
    let missiles = [];
    let bananas = [];
    let explosions = [];
    let itemBoxes = [];
    let missileSpawnTimer = 0;
    let itemSpawnTimer = 0;

    const nagWords = ["공부해!", "밥먹어!", "방청소!", "핸드폰 꺼!", "어디가?!", "동규야!"];
    const keys = { Up: false, Down: false, Left: false, Right: false };
    let gameLogs = JSON.parse(localStorage.getItem('donggyu_escape_logs') || '[]');

    // DOM Elements
    const gameOverlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const overlayIcon = document.getElementById('overlayIcon');
    const overlayBadge = document.getElementById('overlayBadge');
    const startPlayBtn = document.getElementById('startPlayBtn');
    const resumePlayBtn = document.getElementById('resumePlayBtn');
    const startBtnText = document.getElementById('startBtnText');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseText = document.getElementById('pauseText');
    const pauseIcon = document.getElementById('pauseIcon');
    const restartBtn = document.getElementById('restartBtn');

    const survivalTimer = document.getElementById('survivalTimer');
    const rageLabel = document.getElementById('rageLabel');
    const rageBar = document.getElementById('rageBar');
    const bestSurvivalDisplay = document.getElementById('bestSurvivalDisplay');

    const bombCount = document.getElementById('bombCount');
    const bananaCount = document.getElementById('bananaCount');
    const shieldCount = document.getElementById('shieldCount');

    const useBombBtn = document.getElementById('useBombBtn');
    const useBananaBtn = document.getElementById('useBananaBtn');
    const useShieldBtn = document.getElementById('useShieldBtn');

    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const statsModalBtn = document.getElementById('statsModalBtn');
    const statsModal = document.getElementById('statsModal');
    const statsModalCard = document.getElementById('statsModalCard');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const clearDataBtn = document.getElementById('clearDataBtn');
    const historyList = document.getElementById('historyList');
    const statTotalGames = document.getElementById('statTotalGames');
    const statSuccesses = document.getElementById('statSuccesses');

    window.addEventListener('load', () => {
      resizeCanvas();
      updateBestRecordUI();
      updateStatsUI();
      resetEntities();
      updateInventoryUI();
      drawGame();
    });

    // Keyboard Controls
    document.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.Up = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.Down = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.Left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.Right = true;

      // Weapon Keys
      if (e.code === 'KeyJ') triggerBomb();
      if (e.code === 'KeyK') triggerBanana();
      if (e.code === 'KeyL') triggerShield();

      if (e.code === 'Space' && !e.repeat) {
        if (gameState === 'RUNNING') togglePause();
        else if (gameState === 'PAUSED') togglePause();
        else if (gameState === 'IDLE' || gameState === 'GAMEOVER' || gameState === 'VICTORY') startNewGame();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.Up = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.Down = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.Left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.Right = false;
    });

    // Mobile Weapon Buttons
    useBombBtn.addEventListener('click', triggerBomb);
    useBananaBtn.addEventListener('click', triggerBanana);
    useShieldBtn.addEventListener('click', triggerShield);

    function triggerBomb() {
      if (gameState !== 'RUNNING' || inventory.bombs <= 0) return;
      inventory.bombs--;
      updateInventoryUI();
      playWeaponSfx();

      explosions.push({
        x: player.x,
        y: player.y,
        radius: 10,
        maxRadius: 75,
        life: 0.4
      });

      // Check distance to sister
      const dist = Math.hypot(sister.x - player.x, sister.y - player.y);
      if (dist < 100) {
        sister.stunnedTimer = 2.0;
        sister.statusText = "🍠 기절함!";
      }
    }

    function triggerBanana() {
      if (gameState !== 'RUNNING' || inventory.bananas <= 0) return;
      inventory.bananas--;
      updateInventoryUI();
      playWeaponSfx();

      bananas.push({
        x: player.x,
        y: player.y,
        radius: 12
      });
    }

    function triggerShield() {
      if (gameState !== 'RUNNING' || inventory.shields <= 0) return;
      inventory.shields--;
      updateInventoryUI();
      playWeaponSfx();

      player.shieldActive = true;
      player.shieldTimer = 3.0;
    }

    function updateInventoryUI() {
      bombCount.innerText = `x${inventory.bombs}`;
      bananaCount.innerText = `x${inventory.bananas}`;
      shieldCount.innerText = `x${inventory.shields}`;
    }

    // Touch D-Pad Binding
    function bindTouchButton(btnId, direction) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      const setDir = (val) => { keys[direction] = val; };
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); setDir(true); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); setDir(false); });
      btn.addEventListener('mousedown', () => { setDir(true); });
      btn.addEventListener('mouseup', () => { setDir(false); });
      btn.addEventListener('mouseleave', () => { setDir(false); });
    }

    bindTouchButton('btnUp', 'Up');
    bindTouchButton('btnDown', 'Down');
    bindTouchButton('btnLeft', 'Left');
    bindTouchButton('btnRight', 'Right');

    // Drag / Touch Canvas
    let touchX = null;
    let touchY = null;

    canvas.addEventListener('touchstart', (e) => {
      if (gameState !== 'RUNNING') return;
      const rect = canvas.getBoundingClientRect();
      touchX = e.touches[0].clientX - rect.left;
      touchY = e.touches[0].clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      if (gameState !== 'RUNNING' || touchX === null) return;
      const rect = canvas.getBoundingClientRect();
      const currentX = e.touches[0].clientX - rect.left;
      const currentY = e.touches[0].clientY - rect.top;

      const dx = currentX - touchX;
      const dy = currentY - touchY;

      player.x = Math.max(player.radius, Math.min(canvasWidth - player.radius, player.x + dx));
      player.y = Math.max(player.radius, Math.min(canvasHeight - player.radius, player.y + dy));

      touchX = currentX;
      touchY = currentY;
    });

    canvas.addEventListener('touchend', () => { touchX = null; touchY = null; });

    startPlayBtn.addEventListener('click', startNewGame);
    resumePlayBtn.addEventListener('click', resumeGame);
    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetToIdle);

    function resetEntities() {
      player.x = canvasWidth / 2;
      player.y = canvasHeight - 50;
      player.shieldActive = false;
      player.shieldTimer = 0;

      sister.x = canvasWidth / 2;
      sister.y = 50;
      sister.speed = 100;
      sister.stunnedTimer = 0;
      sister.statusText = '';

      inventory = { bombs: 1, bananas: 2, shields: 1 };
      updateInventoryUI();

      missiles = [];
      bananas = [];
      explosions = [];
      itemBoxes = [];
      missileSpawnTimer = 0;
      itemSpawnTimer = 0;
    }

    function startNewGame() {
      gameState = 'RUNNING';
      elapsedTime = 0.00;
      resetEntities();
      playStartSfx();

      gameOverlay.classList.add('opacity-0', 'pointer-events-none');
      resumePlayBtn.classList.add('hidden');
      startPlayBtn.classList.remove('hidden');

      lastTimestamp = performance.now();
      cancelAnimationFrame(animFrameId);
      animFrameId = requestAnimationFrame(gameLoop);
    }

    function togglePause() {
      if (gameState === 'RUNNING') {
        gameState = 'PAUSED';
        cancelAnimationFrame(animFrameId);

        overlayTitle.innerText = "일시 정지됨";
        overlayDesc.innerText = "누나도 숨을 고르는 중입니다. 준비되면 계속 도망치세요!";
        overlayIcon.className = "fa-solid fa-pause text-3xl";
        overlayBadge.className = "p-3 bg-amber-500/20 text-amber-400 rounded-full mb-3 border border-amber-500/30";

        startPlayBtn.classList.add('hidden');
        resumePlayBtn.classList.remove('hidden');
        gameOverlay.classList.remove('opacity-0', 'pointer-events-none');

        pauseText.innerText = "이어서 하기";
        pauseIcon.className = "fa-solid fa-play";
      } else if (gameState === 'PAUSED') {
        resumeGame();
      }
    }

    function resumeGame() {
      gameState = 'RUNNING';
      gameOverlay.classList.add('opacity-0', 'pointer-events-none');

      pauseText.innerText = "일시정지";
      pauseIcon.className = "fa-solid fa-pause";

      lastTimestamp = performance.now();
      animFrameId = requestAnimationFrame(gameLoop);
    }

    function resetToIdle() {
      gameState = 'IDLE';
      cancelAnimationFrame(animFrameId);
      elapsedTime = 0.00;

      overlayTitle.innerText = "동규 누나 무기전 (무제한)";
      overlayDesc.innerText = "고구마 폭탄(기절), 바나나 껍질(미끄러짐), 방패(무적)를 활용해 한계까지 도망치세요!";
      overlayIcon.className = "fa-solid fa-wand-magic-sparkles text-3xl";
      overlayBadge.className = "p-3 bg-rose-500/20 text-rose-400 rounded-full mb-3 border border-rose-500/30";
      startBtnText.innerText = "무기 장착하고 출발!";

      startPlayBtn.classList.remove('hidden');
      resumePlayBtn.classList.add('hidden');
      gameOverlay.classList.remove('opacity-0', 'pointer-events-none');

      pauseText.innerText = "일시정지";
      pauseIcon.className = "fa-solid fa-pause";

      survivalTimer.innerText = "0.00s";
      rageBar.style.width = "0%";
      rageLabel.innerHTML = `<i class="fa-solid fa-fire text-rose-500"></i> 누나 상태: 대기 중`;

      resetEntities();
      drawGame();
    }

    function gameLoop(timestamp) {
      if (gameState !== 'RUNNING') return;

      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      update(dt);
      drawGame();

      if (gameState === 'RUNNING') {
        animFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function update(dt) {
      if (dt > 0.1) return;

      // Endless Survival Time Accumulation
      elapsedTime += dt;
      survivalTimer.innerText = `${elapsedTime.toFixed(2)}s`;

      // Rage percentage continuously scales up based on time (max intensity at 30s)
      const ragePercent = Math.min(100, (elapsedTime / 30.0) * 100);
      rageBar.style.width = `${ragePercent}%`;

      // Shield Update
      if (player.shieldActive) {
        player.shieldTimer -= dt;
        if (player.shieldTimer <= 0) {
          player.shieldActive = false;
        }
      }

      // Sister Stun Check
      if (sister.stunnedTimer > 0) {
        sister.stunnedTimer -= dt;
        rageLabel.innerHTML = `<i class="fa-solid fa-snowflake text-cyan-400"></i> 누나 상태: ${sister.statusText}`;
      } else {
        rageLabel.innerHTML = `<i class="fa-solid fa-fire text-rose-500"></i> 누나 상태: 폭주 중!`;
      }

      // Player Movement
      let moveX = 0;
      let moveY = 0;
      if (keys.Left) moveX -= 1;
      if (keys.Right) moveX += 1;
      if (keys.Up) moveY -= 1;
      if (keys.Down) moveY += 1;

      if (moveX !== 0 && moveY !== 0) {
        moveX *= 0.7071;
        moveY *= 0.7071;
      }

      player.x += moveX * player.speed * dt;
      player.y += moveY * player.speed * dt;
      player.x = Math.max(player.radius, Math.min(canvasWidth - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvasHeight - player.radius, player.y));

      // Sister Chase AI (Gets faster over time endlessly)
      if (sister.stunnedTimer <= 0) {
        sister.speed = 110 + (elapsedTime * 8);
        const dx = player.x - sister.x;
        const dy = player.y - sister.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0) {
          sister.x += (dx / dist) * sister.speed * dt;
          sister.y += (dy / dist) * sister.speed * dt;
        }

        // Check Banana Slip Collision
        for (let i = bananas.length - 1; i >= 0; i--) {
          const b = bananas[i];
          const bDist = Math.hypot(sister.x - b.x, sister.y - b.y);
          if (bDist < (sister.radius + b.radius)) {
            sister.stunnedTimer = 3.0;
            sister.statusText = "🍌 미끄러짐!";
            bananas.splice(i, 1);
            break;
          }
        }

        // Sister Collision with Player
        if (dist < (player.radius + sister.radius - 3)) {
          if (!player.shieldActive) {
            triggerGameOver("동규 누나에게 잡혔습니다!");
            return;
          }
        }
      }

      // Spawn Field Items Randomly
      itemSpawnTimer += dt;
      if (itemSpawnTimer >= 2.5) {
        itemSpawnTimer = 0;
        if (itemBoxes.length < 3) {
          itemBoxes.push({
            x: 30 + Math.random() * (canvasWidth - 60),
            y: 30 + Math.random() * (canvasHeight - 60),
            type: ['bomb', 'banana', 'shield'][Math.floor(Math.random() * 3)],
            radius: 12
          });
        }
      }

      // Collect Items
      for (let i = itemBoxes.length - 1; i >= 0; i--) {
        const item = itemBoxes[i];
        const iDist = Math.hypot(player.x - item.x, player.y - item.y);
        if (iDist < (player.radius + item.radius)) {
          playItemSfx();
          if (item.type === 'bomb') inventory.bombs++;
          if (item.type === 'banana') inventory.bananas++;
          if (item.type === 'shield') inventory.shields++;
          updateInventoryUI();
          itemBoxes.splice(i, 1);
        }
      }

      // Explosions Update
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.radius += (exp.maxRadius / exp.life) * dt;
        if (exp.radius >= exp.maxRadius) {
          explosions.splice(i, 1);
        }
      }

      // Missiles Spawn & Update (Spawn rate accelerates continuously)
      if (sister.stunnedTimer <= 0) {
        missileSpawnTimer += dt;
        const spawnInterval = Math.max(0.2, 1.0 - (elapsedTime * 0.05));
        if (missileSpawnTimer >= spawnInterval) {
          missileSpawnTimer = 0;
          const text = nagWords[Math.floor(Math.random() * nagWords.length)];
          const angle = Math.atan2(player.y - sister.y, player.x - sister.x) + ((Math.random() - 0.5) * 0.4);
          missiles.push({
            x: sister.x,
            y: sister.y,
            vx: Math.cos(angle) * (160 + elapsedTime * 5),
            vy: Math.sin(angle) * (160 + elapsedTime * 5),
            radius: 10,
            text: text
          });
        }
      }

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        m.x += m.vx * dt;
        m.y += m.vy * dt;

        const mDist = Math.hypot(player.x - m.x, player.y - m.y);
        if (mDist < (player.radius + m.radius)) {
          if (player.shieldActive) {
            missiles.splice(i, 1); // Shield blocks missile
          } else {
            triggerGameOver(`"${m.text}" 잔소리에 맞았습니다!`);
            return;
          }
        }

        if (m.x < -40 || m.x > canvasWidth + 40 || m.y < -40 || m.y > canvasHeight + 40) {
          missiles.splice(i, 1);
        }
      }
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // Canvas Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvasWidth; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke();
      }
      for (let y = 0; y < canvasHeight; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke();
      }

      // Draw Explosions
      explosions.forEach(e => {
        ctx.save();
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
        ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Draw Bananas on Ground
      bananas.forEach(b => {
        ctx.save();
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍌', b.x, b.y);
        ctx.restore();
      });

      // Draw Field Item Boxes
      itemBoxes.forEach(item => {
        ctx.save();
        ctx.shadowColor = 'rgba(234, 179, 8, 0.8)';
        ctx.shadowBlur = 12;
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let icon = '🍠';
        if (item.type === 'banana') icon = '🍌';
        if (item.type === 'shield') icon = '🛡️';
        ctx.fillText(icon, item.x, item.y);
        ctx.restore();
      });

      // Draw Nag Missiles
      missiles.forEach(m => {
        ctx.save();
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = 'rgba(244, 63, 94, 0.8)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px Pretendard';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(m.text, m.x, m.y - 14);
        ctx.restore();
      });

      // Draw Sister
      ctx.save();
      ctx.shadowColor = sister.stunnedTimer > 0 ? 'rgba(6, 182, 212, 0.9)' : 'rgba(244, 63, 94, 0.9)';
      ctx.shadowBlur = 20;

      ctx.fillStyle = sister.stunnedTimer > 0 ? '#06b6d4' : sister.color;
      ctx.beginPath();
      ctx.arc(sister.x, sister.y, sister.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(sister.stunnedTimer > 0 ? '💫' : '👩🏻‍🦰', sister.x, sister.y);

      ctx.fillStyle = '#fecdd3';
      ctx.font = 'extrabold 10px Jua';
      ctx.fillText(sister.stunnedTimer > 0 ? sister.statusText : '동규 누나', sister.x, sister.y - sister.radius - 8);
      ctx.restore();

      // Draw Player (Donggyu) & Shield
      ctx.save();
      if (player.shieldActive) {
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba(6, 182, 212, 0.9)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.shadowColor = 'rgba(56, 189, 248, 0.9)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👦🏻', player.x, player.y);

      ctx.fillStyle = '#bae6fd';
      ctx.font = 'extrabold 10px Jua';
      ctx.fillText('동규(나)', player.x, player.y + player.radius + 10);
      ctx.restore();
    }

    function triggerGameOver(reason) {
      gameState = 'GAMEOVER';
      cancelAnimationFrame(animFrameId);
      playHitSfx();

      const finalTime = elapsedTime.toFixed(2);
      const isNewRecord = checkIsBestRecord(elapsedTime);

      if (isNewRecord && typeof confetti === 'function') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }

      overlayTitle.innerText = isNewRecord ? "🏆 최고 생존 기록 갱신!" : "게임 오버!";
      overlayDesc.innerText = `${reason}\n생존 시간: ${finalTime}초`;
      overlayIcon.className = isNewRecord ? "fa-solid fa-trophy text-3xl" : "fa-solid fa-skull-crossbones text-3xl";
      overlayBadge.className = isNewRecord ? "p-3 bg-amber-500/20 text-amber-400 rounded-full mb-3 border border-amber-500/30" : "p-3 bg-rose-500/20 text-rose-400 rounded-full mb-3 border border-rose-500/30";
      startBtnText.innerText = "다시 도전하기";

      startPlayBtn.classList.remove('hidden');
      resumePlayBtn.classList.add('hidden');
      gameOverlay.classList.remove('opacity-0', 'pointer-events-none');

      saveGameRecord({
        time: finalTime,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
    }

    function checkIsBestRecord(time) {
      if (gameLogs.length === 0) return true;
      const currentBest = Math.max(...gameLogs.map(l => parseFloat(l.time)));
      return time > currentBest;
    }

    function saveGameRecord(record) {
      gameLogs.unshift(record);
      if (gameLogs.length > 20) gameLogs.pop();
      localStorage.setItem('donggyu_escape_logs', JSON.stringify(gameLogs));

      updateBestRecordUI();
      updateStatsUI();
    }

    function updateBestRecordUI() {
      if (gameLogs.length === 0) {
        bestSurvivalDisplay.innerText = "0.00초";
        return;
      }
      const best = Math.max(...gameLogs.map(l => parseFloat(l.time)));
      bestSurvivalDisplay.innerText = `${best.toFixed(2)}초`;
    }

    function updateStatsUI() {
      if (gameLogs.length === 0) {
        statTotalGames.innerText = "0";
        statSuccesses.innerText = "0.00초";
        historyList.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">기록이 아직 없습니다.</p>`;
        return;
      }

      statTotalGames.innerText = gameLogs.length;
      const best = Math.max(...gameLogs.map(l => parseFloat(l.time)));
      statSuccesses.innerText = `${best.toFixed(2)}초`;

      historyList.innerHTML = gameLogs.slice(0, 10).map(item => `
        <div class="flex items-center justify-between bg-slate-800/40 p-2.5 rounded-2xl border border-white/5 text-xs">
          <div class="flex items-center space-x-2">
            <span class="px-2 py-0.5 rounded-md font-bold text-[10px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
              생존
            </span>
            <span class="font-mono-num font-bold text-slate-200">${item.time}초</span>
          </div>
          <span class="text-slate-500 text-[10px]">${item.date}</span>
        </div>
      `).join('');
    }

    statsModalBtn.addEventListener('click', () => {
      statsModal.classList.remove('opacity-0', 'pointer-events-none');
      statsModalCard.classList.remove('scale-95');
      statsModalCard.classList.add('scale-100');
    });

    closeModalBtn.addEventListener('click', closeModal);
    statsModal.addEventListener('click', (e) => { if (e.target === statsModal) closeModal(); });

    function closeModal() {
      statsModal.classList.add('opacity-0', 'pointer-events-none');
      statsModalCard.classList.remove('scale-100');
      statsModalCard.classList.add('scale-95');
    }

    clearDataBtn.addEventListener('click', () => {
      if (confirm('모든 기록을 삭제하시겠습니까?')) {
        gameLogs = [];
        localStorage.removeItem('donggyu_escape_logs');
        updateBestRecordUI();
        updateStatsUI();
      }
    });

    soundToggleBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      soundIcon.className = isMuted ? "fa-solid fa-volume-xmark text-rose-400" : "fa-solid fa-volume-high text-slate-300";
    });
  </script>
</body>
