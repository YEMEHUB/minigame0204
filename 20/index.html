        body {

            user-select: none;
            overflow: hidden;
            background-color: #0b1329;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.15s ease;
        }

            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        .damage-overlay {
            animation: damageFlash 0.3s ease-out forwards;
        }

    <!-- Audio & Game Engine Logic -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playGunshot() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const bufferSize = this.ctx.sampleRate * 0.15;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(3200, now);
                filter.frequency.exponentialRampToValueAtTime(120, now + 0.15);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }
            playHit(isHeadshot = false) {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                if (isHeadshot) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                }
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + (isHeadshot ? 0.15 : 0.1));
            }
            playEnemyAttack() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
            playReload() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.setValueAtTime(500, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const audio = new SoundFX();

        let scene, camera, renderer;
        let isPlaying = false;

        let health = 100;
        let ammo = 30;
        const maxAmmo = 30;
        let isReloading = false;
        let score = 0;
        let wave = 1;

        let weaponGroup;
        let muzzleFlash;
        let muzzlePosWorld = new THREE.Vector3();
        let recoilProgress = 0;

        const keys = {};
        const moveSpeed = 0.14;
        const playerPos = new THREE.Vector3(0, 1.6, 0);
        let pitch = 0, yaw = 0;

        let isAiming = false;
        const hipPosition = new THREE.Vector3(0.18, -0.14, -0.45);
        const adsPosition = new THREE.Vector3(0, -0.065, -0.32); // Centers Red Dot sight directly to camera lens
        const defaultFov = 75;
        const adsFov = 45;

        let enemies = [];
        let bulletTracers = [];

        const menuModal = document.getElementById('menuModal');
        const startBtn = document.getElementById('startBtn');
        const hud = document.getElementById('hud');
        const crosshair = document.getElementById('crosshair');
        const healthBar = document.getElementById('healthBar');
        const healthText = document.getElementById('healthText');
        const ammoDisplay = document.getElementById('ammoDisplay');
        const reloadPrompt = document.getElementById('reloadPrompt');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const damageOverlay = document.getElementById('damageOverlay');

        function init3D() {
            const container = document.getElementById('canvasContainer');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x38536e);
            scene.fog = new THREE.FogExp2(0x38536e, 0.015);

            camera = new THREE.PerspectiveCamera(defaultFov, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(playerPos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Nature Outdoor Lighting
            const ambientLight = new THREE.AmbientLight(0xddeeff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            sunLight.position.set(40, 80, 40);
            sunLight.castShadow = true;
            scene.add(sunLight);

            buildHK416Weapon();
            buildMountainEnvironment();

            window.addEventListener('resize', onWindowResize);
            setupControls();

            animate();
        }

        // Clean HK416 Model with Red-Dot Sight
        function buildHK416Weapon() {
            weaponGroup = new THREE.Group();

            const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.85, roughness: 0.2 });
            const tanMat = new THREE.MeshStandardMaterial({ color: 0x92704f, metalness: 0.3, roughness: 0.6 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
            const redDotMat = new THREE.MeshBasicMaterial({ color: 0xef4444 }); // Glowing Red Dot

            // Main Body Receiver
            const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 0.35), darkMetalMat);
            weaponGroup.add(receiver);

            // Handguard
            const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.07, 0.42), tanMat);
            handguard.position.set(0, 0.01, -0.33);
            weaponGroup.add(handguard);

            // Barrel
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 12), darkMetalMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.02, -0.63);
            weaponGroup.add(barrel);

            // Magazine
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.08), tanMat);
            mag.rotation.x = Math.PI / 10;
            mag.position.set(0, -0.12, -0.05);
            weaponGroup.add(mag);

            // Tactical Grip
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.13, 0.05), darkMetalMat);
            grip.rotation.x = -Math.PI / 5;
            grip.position.set(0, -0.08, 0.11);
            weaponGroup.add(grip);

            // Optic Sight Base & Frame
            const sightBase = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.05, 0.09), darkMetalMat);
            sightBase.position.set(0, 0.065, -0.07);
            weaponGroup.add(sightBase);

            const sightGlass = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.038, 0.005), glassMat);
            sightGlass.position.set(0, 0.07, -0.1);
            weaponGroup.add(sightGlass);

            // Red Dot Marker in Sight
            const redDot = new THREE.Mesh(new THREE.SphereGeometry(0.0025, 8, 8), redDotMat);
            redDot.position.set(0, 0.07, -0.102);
            weaponGroup.add(redDot);

            // Muzzle Flash Effect
            const flashGeo = new THREE.SphereGeometry(0.07, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0.02, -0.77);
            weaponGroup.add(muzzleFlash);

            weaponGroup.position.copy(hipPosition);
            camera.add(weaponGroup);
            scene.add(camera);
        }

        // Enemy Mesh Assembly with Health Bar Canvas Texture
        function createHumanoidMesh() {
            const group = new THREE.Group();

            const clothMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.5 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfca5a5, roughness: 0.6 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111827 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), clothMat);
            torso.position.y = 1.15;
            torso.castShadow = true;
            torso.userData = { hitZone: 'body' };
            group.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skinMat);
            head.position.y = 1.85;
            head.castShadow = true;
            head.userData = { hitZone: 'head' };
            group.add(head);

            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.1), darkMat);
            visor.position.set(0, 1.88, 0.18);
            visor.userData = { hitZone: 'head' };
            group.add(visor);

            const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
            
            const leftArm = new THREE.Mesh(armGeo, clothMat);
            leftArm.position.set(-0.5, 1.15, 0);
            leftArm.castShadow = true;
            leftArm.userData = { hitZone: 'body' };
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, clothMat);
            rightArm.position.set(0.5, 1.15, 0);
            rightArm.castShadow = true;
            rightArm.userData = { hitZone: 'body' };
            group.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);

            const leftLeg = new THREE.Mesh(legGeo, darkMat);
            leftLeg.position.set(-0.2, 0.4, 0);
            leftLeg.castShadow = true;
            leftLeg.userData = { hitZone: 'leg' };
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, darkMat);
            rightLeg.position.set(0.2, 0.4, 0);
            rightLeg.castShadow = true;
            rightLeg.userData = { hitZone: 'leg' };
            group.add(rightLeg);

            // Overhead 3D Health Bar
            const hpCanvas = document.createElement('canvas');
            hpCanvas.width = 128;
            hpCanvas.height = 16;
            const hpCtx = hpCanvas.getContext('2d');

            const hpTexture = new THREE.CanvasTexture(hpCanvas);
            const hpMat = new THREE.SpriteMaterial({ map: hpTexture, depthTest: false });
            const hpSprite = new THREE.Sprite(hpMat);
            hpSprite.position.set(0, 2.3, 0);
            hpSprite.scale.set(1.2, 0.15, 1);
            group.add(hpSprite);

            group.userData = {
                leftArm: leftArm,
                rightArm: rightArm,
                leftLeg: leftLeg,
                rightLeg: rightLeg,
                hpSprite: hpSprite,
                hpCanvas: hpCanvas,
                hpCtx: hpCtx,
                hpTexture: hpTexture,
                animTime: Math.random() * 10,
                lastAttackTime: 0
            };

            return group;
        }

        function updateEnemyHealthBar(enemy) {
            const ctx = enemy.mesh.userData.hpCtx;
            const pct = Math.max(0, enemy.health / 100);

            ctx.clearRect(0, 0, 128, 16);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, 128, 16);

            if (pct > 0.5) ctx.fillStyle = '#22c55e';
            else if (pct > 0.25) ctx.fillStyle = '#eab308';
            else ctx.fillStyle = '#ef4444';

            ctx.fillRect(2, 2, Math.floor(124 * pct), 12);
            enemy.mesh.userData.hpTexture.needsUpdate = true;
        }

        // Mountain Terrain & Mountains Background
        function buildMountainEnvironment() {
            // Mountain Floor
            const groundGeo = new THREE.PlaneGeometry(150, 150, 32, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3d4b38, roughness: 0.95 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Distant Mountains Surroundings
            const mtnMat = new THREE.MeshStandardMaterial({ color: 0x223026, roughness: 0.9 });
            const mtnCount = 20;

            for (let i = 0; i < mtnCount; i++) {
                const height = 25 + Math.random() * 35;
                const radius = 15 + Math.random() * 20;
                const angle = (i / mtnCount) * Math.PI * 2;
                const dist = 65 + Math.random() * 15;

                const coneGeo = new THREE.ConeGeometry(radius, height, 7);
                const mountain = new THREE.Mesh(coneGeo, mtnMat);
                mountain.position.set(Math.sin(angle) * dist, height / 2, Math.cos(angle) * dist);
                scene.add(mountain);
            }

            // Rocks and Obstacles
            const rockGeo = new THREE.DodecahedronGeometry(2, 1);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x555d50, roughness: 0.8 });

            for (let i = 0; i < 16; i++) {
                const rock = new THREE.Mesh(rockGeo, rockMat);
                const rx = (Math.random() - 0.5) * 70;
                const rz = (Math.random() - 0.5) * 70;
                if (Math.abs(rx) < 5 && Math.abs(rz) < 5) continue;
                rock.position.set(rx, 1, rz);
                rock.rotation.set(Math.random(), Math.random(), Math.random());
                rock.scale.set(1 + Math.random(), 1 + Math.random() * 2, 1 + Math.random());
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyR') reloadAmmo();
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    const sensitivity = isAiming ? 0.0012 : 0.0022;
                    yaw -= e.movementX * sensitivity;
                    pitch -= e.movementY * sensitivity;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                }
            });

            // Mouse Click & Aim (Right-Click for ADS)
            document.addEventListener('mousedown', (e) => {
                if (!isPlaying) return;
                if (document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                    return;
                }
                if (e.button === 0) {
                    shoot();
                } else if (e.button === 2) {
                    isAiming = true;
                    crosshair.style.opacity = '0';
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 2) {
                    isAiming = false;
                    crosshair.style.opacity = '1';
                }
            });

            // Prevent context menu on Right Click
            document.addEventListener('contextmenu', e => e.preventDefault());

            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startGame();
            });
        }

        function startGame() {
            audio.init();
            health = 100;
            score = 0;
            wave = 1;
            ammo = maxAmmo;
            isAiming = false;
            crosshair.style.opacity = '1';
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            bulletTracers.forEach(b => scene.remove(b.mesh));
            bulletTracers = [];

            updateHUD();
            menuModal.classList.add('hidden');
            hud.classList.remove('hidden');
            isPlaying = true;

            try {
                document.body.requestPointerLock();
            } catch(e) {}
            spawnWave();
        }

        function spawnWave() {
            const count = 3 + wave * 2;
            for (let i = 0; i < count; i++) {
                spawnEnemy();
            }
        }

        function spawnEnemy() {
            const mesh = createHumanoidMesh();

            const angle = Math.random() * Math.PI * 2;
            const dist = 20 + Math.random() * 20;
            mesh.position.set(Math.sin(angle) * dist, 0, Math.cos(angle) * dist);

            scene.add(mesh);
            const enemyObj = {
                mesh: mesh,
                speed: 0.035 + Math.random() * 0.02 + (wave * 0.005),
                health: 100
            };
            enemies.push(enemyObj);
            updateEnemyHealthBar(enemyObj);
        }

        function showHitFeedback(text, colorClass) {
            const el = document.createElement('div');
            el.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-12 font-black text-2xl ${colorClass} pointer-events-none transition-all duration-300 z-30 animate-bounce`;
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 450);
        }

        // Create Bullet Tracer Line Visual
        function createBulletTracer(startPos, endPos) {
            const points = [startPos, endPos];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0xfef08a,
                linewidth: 3,
                transparent: true,
                opacity: 0.9
            });

            const tracerLine = new THREE.Line(geometry, material);
            scene.add(tracerLine);

            bulletTracers.push({
                mesh: tracerLine,
                createdAt: performance.now()
            });
        }

        function shoot() {
            if (isReloading) return;
            if (ammo <= 0) {
                reloadAmmo();
                return;
            }

            ammo--;
            updateHUD();
            audio.playGunshot();

            recoilProgress = 1.0;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 40);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const enemyMeshes = [];
            enemies.forEach(e => {
                e.mesh.traverse(child => {
                    if (child.isMesh && child.userData.hitZone) {
                        child.userData.enemyRef = e;
                        enemyMeshes.push(child);
                    }
                });
            });

            const intersects = raycaster.intersectObjects(enemyMeshes);
            
            // Get bullet tracer start position in World coordinates
            muzzleFlash.getWorldPosition(muzzlePosWorld);
            let targetPoint = new THREE.Vector3();

            if (intersects.length > 0) {
                targetPoint.copy(intersects[0].point);

                const hitMesh = intersects[0].object;
                const enemyObj = hitMesh.userData.enemyRef;
                const hitZone = hitMesh.userData.hitZone;

                if (enemyObj) {
                    let damage = 0;
                    let isHeadshot = false;

                    if (hitZone === 'head') {
                        damage = 100;
                        isHeadshot = true;
                        showHitFeedback("HEADSHOT! (100)", "text-rose-500 text-3xl");
                    } else if (hitZone === 'body') {
                        damage = 34;
                        showHitFeedback("-34 (몸통)", "text-amber-400");
                    } else if (hitZone === 'leg') {
                        damage = 20;
                        showHitFeedback("-20 (다리)", "text-slate-300");
                    }

                    audio.playHit(isHeadshot);
                    enemyObj.health -= damage;
                    updateEnemyHealthBar(enemyObj);

                    hitMesh.material.color.setHex(0xffffff);
                    setTimeout(() => {
                        if (hitZone === 'head') hitMesh.material.color.setHex(0xfca5a5);
                        else if (hitZone === 'body') hitMesh.material.color.setHex(0x991b1b);
                        else hitMesh.material.color.setHex(0x111827);
                    }, 100);

                    if (enemyObj.health <= 0) {
                        const idx = enemies.indexOf(enemyObj);
                        if (idx !== -1) {
                            scene.remove(enemyObj.mesh);
                            enemies.splice(idx, 1);

                            score += isHeadshot ? 250 : 100;
                            updateHUD();

                            if (enemies.length === 0) {
                                wave++;
                                waveDisplay.textContent = wave;
                                setTimeout(spawnWave, 1200);
                            }
                        }
                    }
                }
            } else {
                // Raycast out to distant world space
                raycaster.ray.at(60, targetPoint);
            }

            // Create visible flying bullet tracer
            createBulletTracer(muzzlePosWorld.clone(), targetPoint);
        }

        function reloadAmmo() {
            if (isReloading || ammo === maxAmmo) return;
            isReloading = true;
            audio.playReload();
            reloadPrompt.textContent = "HK416 재장전 중...";
            reloadPrompt.classList.remove('hidden');

            setTimeout(() => {
                ammo = maxAmmo;
                isReloading = false;
                reloadPrompt.classList.add('hidden');
                updateHUD();
            }, 1200);
        }

        function updateHUD() {
            healthText.textContent = `${Math.max(0, health)} / 100`;
            healthBar.style.width = `${Math.max(0, health)}%`;
            ammoDisplay.textContent = ammo;
            scoreDisplay.textContent = score;

            if (ammo === 0) {
                reloadPrompt.textContent = "[R] 눌러 재장전";
                reloadPrompt.classList.remove('hidden');
            }
        }

        function takeDamage(amount) {
            health -= amount;
            updateHUD();

            damageOverlay.classList.remove('hidden');
            damageOverlay.classList.add('damage-overlay');
            setTimeout(() => {
                damageOverlay.classList.add('hidden');
                damageOverlay.classList.remove('damage-overlay');
            }, 300);

            if (health <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            isPlaying = false;
            try {
                document.exitPointerLock();
            } catch(e) {}
            hud.classList.add('hidden');
            menuModal.classList.remove('hidden');

            document.getElementById('menuTitle').textContent = "MISSION FAILED";
            document.getElementById('menuDesc').textContent = `최종 점수: ${score} 점 (WAVE ${wave})`;
            startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> 다시 도전하기`;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                // Smooth Aim Down Sight (ADS) Transition
                const targetPos = isAiming ? adsPosition : hipPosition;
                const targetFov = isAiming ? adsFov : defaultFov;

                weaponGroup.position.lerp(targetPos, 0.25);
                camera.fov += (targetFov - camera.fov) * 0.25;
                camera.updateProjectionMatrix();

                // Weapon Recoil Animation
                if (recoilProgress > 0) {
                    weaponGroup.position.z += recoilProgress * 0.05;
                    weaponGroup.rotation.x = recoilProgress * 0.08;
                    recoilProgress -= 0.2;
                } else {
                    weaponGroup.rotation.set(0, 0, 0);
                }

                // Player Movement Logic
                const moveVec = new THREE.Vector3();
                if (keys['KeyW'] || keys['ArrowUp']) moveVec.z -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) moveVec.z += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) moveVec.x -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) moveVec.x += 1;

                moveVec.normalize();
                moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.addScaledVector(moveVec, moveSpeed);

                camera.position.x = Math.max(-45, Math.min(45, camera.position.x));
                camera.position.z = Math.max(-45, Math.min(45, camera.position.z));

                // Update Bullet Tracers (fade out quickly)
                const now = performance.now();
                for (let i = bulletTracers.length - 1; i >= 0; i--) {
                    const b = bulletTracers[i];
                    if (now - b.createdAt > 60) {
                        scene.remove(b.mesh);
                        bulletTracers.splice(i, 1);
                    }
                }

                // Enemy AI Movement & Attack Mechanics
                enemies.forEach(e => {
                    const dir = new THREE.Vector3().subVectors(camera.position, e.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();
                    dir.normalize();

                    // Walk towards player
                    if (dist > 1.8) {
                        e.mesh.position.addScaledVector(dir, e.speed);
                    }

                    e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);

                    // Limb swing animation
                    const ud = e.mesh.userData;
                    ud.animTime += e.speed * 8;
                    const swing = Math.sin(ud.animTime) * 0.6;

                    ud.leftArm.rotation.x = swing;
                    ud.rightArm.rotation.x = -swing;
                    ud.leftLeg.rotation.x = -swing;
                    ud.rightLeg.rotation.x = swing;

                    // Keep health bar facing camera
                    ud.hpSprite.quaternion.copy(camera.quaternion);

                    // Enemy Attack Player when close
                    if (dist <= 2.0) {
                        if (now - ud.lastAttackTime > 1000) {
                            ud.lastAttackTime = now;
                            audio.playEnemyAttack();
                            takeDamage(15);
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init3D;
    </script>
</body>
</html>
