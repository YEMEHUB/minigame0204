<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4 overflow-x-hidden">

    <header class="w-full max-w-4xl flex justify-between items-center py-2 px-4 bg-white/80 rounded-2xl border border-slate-200 shadow-sm backdrop-blur-md mb-2">

            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-red-600 flex items-center justify-center font-bold text-xl text-white shadow-md">

            </div>

    <!-- Game Main Arena Area (1:1 Aspect Ratio Box) -->
    <main class="w-full max-w-lg flex flex-col items-center gap-3">
        <!-- Canvas Game Arena Container (1:1 Aspect Ratio) -->
        <div class="relative w-full aspect-square bg-white rounded-2xl border-4 border-slate-300 shadow-xl overflow-hidden flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Overlay Start/Game Over Modal -->
            <div id="game-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center gap-4 p-6 text-center z-10 transition-opacity">
                <h2 id="overlay-title" class="font-orbitron text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-red-600">

                    1P와 2P의 볼을 선택하고 경기를 시작하세요.
                </p>

                <!-- Ball Selection Box (1P Left / 2P Right) -->
                <div class="grid grid-cols-2 gap-3 w-full max-w-xs my-1">
                    <!-- 1P Selection -->
                    <div class="flex flex-col gap-1 p-2 bg-blue-50/80 border border-blue-200 rounded-xl text-left">

                            <option value="standard">⚽ 기본 볼 (150 HP)</option>

                        </select>

                    <!-- 2P Selection -->
                    <div class="flex flex-col gap-1 p-2 bg-red-50/80 border border-red-200 rounded-xl text-left">
                        <span class="text-xs font-black text-red-600 flex items-center gap-1">

                        </span>

                            <option value="standard">⚽ 기본 볼 (150 HP)</option>

                        </select>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 justify-center mt-1">
                    <button id="btn-start" class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg hover:shadow-indigo-500/30 transition transform hover:-translate-y-0.5 active:translate-y-0 text-sm sm:text-base flex items-center gap-2">

        <!-- Info Note -->
        <div class="w-full text-center text-xs text-slate-600 bg-white/80 border border-slate-200 p-2.5 rounded-xl shadow-sm">
            💡 기본 체력 150 HP | 충돌 시 일정 데미지(20 HP) 입음
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-4 text-center text-xs text-slate-400">
        Bounce Bash Physics Arena &copy; 2026 | Canvas Physics Engine
    </footer>

    <!-- Audio Effects Synthesizer -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playBounce(impact = 1) {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    const freq = Math.min(200 + impact * 80, 800);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);

                    const vol = Math.min(0.05 + impact * 0.08, 0.4);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }

            // 부드럽고 단순한 기본 볼 충돌음
            playImpact() {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.06);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.06);
                } catch(e) {}
            }

            // 긴 호흡으로 부드럽게 '스으으윽-' 썰리는 베기 (Slash) 사운드 효과
            playSlash() {
                if (!this.enabled) return;
                this.init();
                try {
                    const duration = 0.35; // 스타카토 방지를 위해 지속 시간을 0.35초로 3배 이상 확장
                    const now = this.ctx.currentTime;

                    // 1. 노이즈 레이어 (칼날 스치고 썰리는 마찰음)
                    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);

                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    // 주파수를 매끄럽게 내리며 '스으으윽' 소리를 내는 Bandpass 필터
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.setValueAtTime(2.2, now);

                    // 3800Hz에서 400Hz까지 완만하게 떨어지는 주파수 커브
                    filter.frequency.setValueAtTime(3800, now);
                    filter.frequency.exponentialRampToValueAtTime(400, now + duration);

                    // 볼륨 엔벨로프 (시작은 부드럽게 상승, 중간 이후 서서히 감소)
                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.01, now);
                    noiseGain.gain.linearRampToValueAtTime(0.4, now + 0.06); // 부드러운 공격음 시작
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    noise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    // 2. 묵직한 오실레이터 레이어 (썰리면서 파고드는 묵직함 보강)
                    const osc = this.ctx.createOscillator();
                    const oscGain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(70, now + duration);

                    oscGain.gain.setValueAtTime(0.01, now);
                    oscGain.gain.linearRampToValueAtTime(0.12, now + 0.05);
                    oscGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc.connect(oscGain);
                    oscGain.connect(this.ctx.destination);

                    // 재생 시작
                    noise.start(now);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch(e) {}
            }
        }

        const audio = new SoundFX();
    </script>

    <!-- Main Game Logic -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const gameOverlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const btnStart = document.getElementById('btn-start');
        const selectP1Ball = document.getElementById('select-p1-ball');
        const selectP2Ball = document.getElementById('select-p2-ball');

        const btnSound = document.getElementById('btn-sound');
        const soundIcon = document.getElementById('sound-icon');
        const btnStop = document.getElementById('btn-stop');

        let isRunning = false;
        let isPreparing = false;
        let launchTimer = 0;
        let launchInterval = null;
        let animationFrameId = null;

        let width = 500;
        let height = 500;

        const CONSTANT_SPEED = 6.5; // 속도를 적절하게 조절 (기존 9.0 -> 6.5)
        const FIXED_DAMAGE = 20;   // 일정한 충돌 데미지 (20 HP)

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            width = canvas.width;
            height = canvas.height;
        }

        window.addEventListener('resize', resizeCanvas);

        // Visual Particles & Floating Text Effects
        let particles = [];
        let damageTexts = [];

        class Particle {
            constructor(x, y, color, size = 4, speedMultiplier = 1) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * size + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 5 + 1) * speedMultiplier;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.vy = -1.5;
                this.life = 1.0;
                this.decay = 0.02;
            }

            update() {
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = '900 18px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // Bouncing Ball Class
        class Ball {
            constructor(id, color, lightColor, name) {
                this.id = id;
                this.x = 0;
                this.y = 0;
                this.radius = 42;
                this.mass = 1.0;
                this.color = color;
                this.lightColor = lightColor;
                this.name = name;
                this.type = 'standard';

                this.vx = 0;
                this.vy = 0;
                this.targetVx = 0;
                this.targetVy = 0;

                this.maxHp = 150; // 기본 체력
                this.hp = 150;

                this.hitCooldown = 0; // 지속딜 방지용 충돌 쿨다운
                this.bladeAngle = 0;  // 칼날 회전 각도
            }

            setType(type) {
                this.type = type;
                if (type === 'blade') {
                    this.maxHp = 120; // 회전 칼날 볼 기본 체력 120 HP
                } else {
                    this.maxHp = 150; // 기본 볼 체력 150 HP
                }
                this.hp = this.maxHp;
            }

            randomSpawn(otherBall = null) {
                this.hp = this.maxHp;
                this.hitCooldown = 0;
                this.bladeAngle = Math.random() * Math.PI * 2;
                
                let valid = false;
                while (!valid) {
                    this.x = this.radius + 15 + Math.random() * (width - (this.radius * 2 + 30));
                    this.y = this.radius + 15 + Math.random() * (height - (this.radius * 2 + 30));
                    if (!otherBall) {
                        valid = true;
                    } else {
                        const dist = Math.hypot(this.x - otherBall.x, this.y - otherBall.y);
                        if (dist > (this.radius + otherBall.radius + 80)) {
                            valid = true;
                        }
                    }
                }

                // 360도 전 방향 완전 무작위 각도 설정 (0 ~ 2*PI)
                const randomAngle = Math.random() * Math.PI * 2;
                this.targetVx = Math.cos(randomAngle) * CONSTANT_SPEED;
                this.targetVy = Math.sin(randomAngle) * CONSTANT_SPEED;

                this.vx = 0;
                this.vy = 0;
            }

            launch() {
                this.vx = this.targetVx;
                this.vy = this.targetVy;
                this.maintainSpeed();
            }

            // 속도가 줄어들거나 멈추지 않게 CONSTANT_SPEED로 일정하게 강제 유지
            maintainSpeed() {
                const currentSpeed = Math.hypot(this.vx, this.vy);
                if (currentSpeed < 0.001) {
                    const randomAngle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(randomAngle) * CONSTANT_SPEED;
                    this.vy = Math.sin(randomAngle) * CONSTANT_SPEED;
                } else {
                    this.vx = (this.vx / currentSpeed) * CONSTANT_SPEED;
                    this.vy = (this.vy / currentSpeed) * CONSTANT_SPEED;
                }
            }

            updatePosition() {
                if (!isRunning || isPreparing) return;

                if (this.hitCooldown > 0) {
                    this.hitCooldown--;
                }

                // 이동 적용
                this.x += this.vx;
                this.y += this.vy;

                // 칼날 회전 각도 업데이트 (시계 방향 회전)
                this.bladeAngle += 0.08;

                // 항상 속도 정규화 (멈춤 방지)
                this.maintainSpeed();

                // 벽 충돌 체크
                let wallHit = false;

                // Left & Right Wall
                if (this.x - this.radius <= 0) {
                    this.x = this.radius;
                    this.vx *= -1;
                    wallHit = true;
                } else if (this.x + this.radius >= width) {
                    this.x = width - this.radius;
                    this.vx *= -1;
                    wallHit = true;
                }

                // Top & Bottom Wall
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.vy *= -1;
                    wallHit = true;
                } else if (this.y + this.radius >= height) {
                    this.y = height - this.radius;
                    this.vy *= -1;
                    wallHit = true;
                }

                // 완벽한 수평/수직으로 무한 부딪히는 각도 보정
                if (wallHit) {
                    if (Math.abs(this.vx) < 0.3) this.vx += (Math.random() - 0.5) * 0.5;
                    if (Math.abs(this.vy) < 0.3) this.vy += (Math.random() - 0.5) * 0.5;
                    this.maintainSpeed();
                    audio.playBounce(1);

                    // 벽 충돌 파티클
                    for (let i = 0; i < 5; i++) {
                        particles.push(new Particle(this.x, this.y, this.lightColor, 3, 0.5));
                    }
                }
            }

            // 현재 HP에 따른 회전 칼날 개수 계산 (120HP 기반)
            getBladeCount() {
                if (this.type !== 'blade') return 0;
                if (this.hp <= 15) return 4;
                if (this.hp <= 30) return 3;
                if (this.hp <= 60) return 2;
                return 1;
            }

            draw(ctx) {
                ctx.save();

                // 조준선 안내 (준비 단계)
                if (isPreparing) {
                    const aimLength = 80;
                    const aimX = this.x + (this.targetVx / CONSTANT_SPEED) * aimLength;
                    const aimY = this.y + (this.targetVy / CONSTANT_SPEED) * aimLength;

                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(aimX, aimY);
                    ctx.strokeStyle = this.lightColor;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.arc(aimX, aimY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = this.lightColor;
                    ctx.fill();
                }

                // 회전 칼날 그리기 (blade 타잎인 경우)
                const bladeCount = this.getBladeCount();
                if (bladeCount > 0) {
                    const orbitRadius = this.radius + 22; // 회전 궤도 확장 (14 -> 22)
                    for (let i = 0; i < bladeCount; i++) {
                        const currentAngle = this.bladeAngle + (i * (Math.PI * 2 / bladeCount));
                        const bladeX = this.x + Math.cos(currentAngle) * orbitRadius;
                        const bladeY = this.y + Math.sin(currentAngle) * orbitRadius;

                        ctx.save();
                        ctx.translate(bladeX, bladeY);
                        ctx.rotate(currentAngle + Math.PI / 2);

                        // --- 식칼 (Chef's Knife) 형태 그리기 ---
                        
                        // 1. 손잡이 (Handle)
                        ctx.fillStyle = '#451a03'; // 진한 우드 브라운
                        ctx.beginPath();
                        ctx.roundRect(-4, 12, 8, 18, 2);
                        ctx.fill();
                        ctx.lineWidth = 1;
                        ctx.strokeStyle = '#1e293b';
                        ctx.stroke();

                        // 손잡이 고정 리벳 (Rivet)
                        ctx.fillStyle = '#cbd5e1';
                        ctx.beginPath();
                        ctx.arc(0, 17, 1.5, 0, Math.PI * 2);
                        ctx.arc(0, 24, 1.5, 0, Math.PI * 2);
                        ctx.fill();

                        // 2. 식칼 날 (Knife Blade Body)
                        ctx.beginPath();
                        ctx.moveTo(-5, 12);   // 칼자루 연결부 왼쪽
                        ctx.lineTo(-5, -18);  // 칼등 (직선으로 길게)
                        ctx.lineTo(8, -28);   // 식칼 끝 뾰족하고 매끄러운 곡선
                        ctx.quadraticCurveTo(8, -5, 5, 12); // 식칼 배 (Blade Belly)
                        ctx.closePath();

                        // 칼날 메탈 그라데이션
                        const bladeGrad = ctx.createLinearGradient(-5, 0, 8, 0);
                        bladeGrad.addColorStop(0, '#94a3b8'); // 칼등 부분 (어두운 은색)
                        bladeGrad.addColorStop(0.7, '#f8fafc'); // 칼날 중간 (밝은 광택)
                        bladeGrad.addColorStop(1, '#e2e8f0'); // 칼날 끝

                        ctx.fillStyle = bladeGrad;
                        ctx.shadowColor = this.lightColor;
                        ctx.shadowBlur = 8;
                        ctx.fill();

                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = '#334155';
                        ctx.stroke();

                        // 3. 식칼 날의 날카로운 선 (Edge Highlight)
                        ctx.beginPath();
                        ctx.moveTo(8, -28);
                        ctx.quadraticCurveTo(8, -5, 5, 12);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.restore();
                    }
                }

                // 공 본체 그리기
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    this.radius * 0.1,
                    this.x,
                    this.y,
                    this.radius
                );
                gradient.addColorStop(0, this.lightColor);
                gradient.addColorStop(1, this.color);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fill();

                // 원 내부 테두리
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.stroke();

                // 원 내부 중앙 체력 숫자 표기
                ctx.shadowBlur = 0;
                ctx.font = '900 24px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 가독성을 위한 글자 그림자/테두리
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(Math.max(0, Math.ceil(this.hp)), this.x, this.y);

                ctx.restore();
            }
        }

        // Create Player 1 & Player 2 Balls
        const p1 = new Ball('p1', '#2563EB', '#60A5FA', 'BLUE');
        const p2 = new Ball('p2', '#DC2626', '#F87171', 'RED');

        // Check & resolve ball to ball collision
        function handleBallCollision() {
            if (!isRunning || isPreparing) return;

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const distance = Math.hypot(dx, dy);
            const minDistance = p1.radius + p2.radius;

            // 1. 공 본체 간 물리적 충돌 및 반사 처리 (본체 부딪힘)
            if (distance < minDistance) {
                // 물리적 겹침 분리
                const overlap = minDistance - distance + 2;
                const nx = distance === 0 ? 1 : dx / distance;
                const ny = distance === 0 ? 0 : dy / distance;

                p1.x -= nx * overlap * 0.5;
                p1.y -= ny * overlap * 0.5;
                p2.x += nx * overlap * 0.5;
                p2.y += ny * overlap * 0.5;

                // 물리 반사 속도 계산
                const kx = p1.vx - p2.vx;
                const ky = p1.vy - p2.vy;
                const p = 2 * (nx * kx + ny * ky) / (p1.mass + p2.mass);

                p1.vx -= p * p2.mass * nx;
                p1.vy -= p * p2.mass * ny;
                p2.vx += p * p1.mass * nx;
                p2.vy += p * p1.mass * ny;

                p1.maintainSpeed();
                p2.maintainSpeed();

                // 일반 볼(standard) 끼리의 충돌 시 본체 데미지 적용
                if (p1.hitCooldown === 0 && p2.hitCooldown === 0) {
                    let p1TakesDamage = (p2.type === 'standard');
                    let p2TakesDamage = (p1.type === 'standard');

                    if (p1TakesDamage) p1.hp -= FIXED_DAMAGE;
                    if (p2TakesDamage) p2.hp -= FIXED_DAMAGE;

                    if (p1TakesDamage || p2TakesDamage) {
                        p1.hitCooldown = 15;
                        p2.hitCooldown = 15;

                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        damageTexts.push(new FloatingText(midX, midY - 15, `-${FIXED_DAMAGE}`, '#EF4444'));

                        for (let i = 0; i < 15; i++) {
                            particles.push(new Particle(midX, midY, p1.lightColor, 4, 1.2));
                            particles.push(new Particle(midX, midY, p2.lightColor, 4, 1.2));
                        }
                        audio.playImpact(); // 기본 볼 충돌 사운드

                        if (p1.hp <= 0 || p2.hp <= 0) endGame();
                    } else {
                        // 기본 충돌 데미지가 들어가지 않더라도 본체 충돌 시 사운드 재생
                        audio.playImpact();
                    }
                }
            }

            // 2. 식칼(칼날) 직접 타격 판정
            checkBladeHit(p1, p2);
            checkBladeHit(p2, p1);
        }

        // attacker의 칼날이 defender 공 본체에 닿았는지 판정
        function checkBladeHit(attacker, defender) {
            if (attacker.type !== 'blade') return;
            const bladeCount = attacker.getBladeCount();
            if (bladeCount === 0) return;

            const orbitRadius = attacker.radius + 25;

            for (let i = 0; i < bladeCount; i++) {
                const currentAngle = attacker.bladeAngle + (i * (Math.PI * 2 / bladeCount));
                // 식칼의 중심/끝 위치 계산
                const bladeX = attacker.x + Math.cos(currentAngle) * orbitRadius;
                const bladeY = attacker.y + Math.sin(currentAngle) * orbitRadius;

                const distToDefender = Math.hypot(bladeX - defender.x, bladeY - defender.y);

                // 식칼이 방어하는 공의 반지름(칼날 판정 범위 포함)에 닿은 경우
                if (distToDefender < defender.radius + 15) {
                    if (defender.hitCooldown === 0) {
                        defender.hp -= FIXED_DAMAGE;
                        defender.hitCooldown = 18; // 칼날 피격 쿨다운

                        damageTexts.push(new FloatingText(defender.x, defender.y - 20, `-${FIXED_DAMAGE}`, '#EF4444'));

                        for (let p = 0; p < 12; p++) {
                            particles.push(new Particle(bladeX, bladeY, '#F87171', 5, 1.5));
                        }
                        audio.playSlash(); // 칼날 타격 시 Slash 사운드

                        if (defender.hp <= 0) endGame();
                    }
                }
            }
        }

        function startGame() {
            resizeCanvas();
            audio.init(); // 오디오 맥락 확실히 활성화

            // 이전 타이머 초기화
            if (launchInterval) clearInterval(launchInterval);

            // 1P & 2P 볼 선택 반영
            p1.setType(selectP1Ball.value);
            p2.setType(selectP2Ball.value);

            p1.randomSpawn();
            p2.randomSpawn(p1);

            particles = [];
            damageTexts = [];

            isRunning = true;
            isPreparing = true;
            launchTimer = 3;

            gameOverlay.classList.add('opacity-0', 'pointer-events-none');
            btnStop.classList.remove('hidden'); // 중단 버튼 표시

            // Countdown timer before launch
            launchInterval = setInterval(() => {
                launchTimer--;
                if (launchTimer <= 0) {
                    clearInterval(launchInterval);
                    launchInterval = null;
                    isPreparing = false;
                    p1.launch();
                    p2.launch();
                }
            }, 800);
        }

        function stopGame() {
            isRunning = false;
            isPreparing = false;
            if (launchInterval) {
                clearInterval(launchInterval);
                launchInterval = null;
            }

            btnStop.classList.add('hidden'); // 중단 버튼 숨기기

            overlayTitle.innerText = "BOUNCE BASH";
            overlaySubtitle.innerHTML = "게임을 중단했습니다.<br>볼을 선택하고 다시 시작하세요.";
            btnStart.innerHTML = `<i class="fa-solid fa-play"></i> 경기 시작`;

            gameOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function endGame() {
            isRunning = false;
            if (launchInterval) {
                clearInterval(launchInterval);
                launchInterval = null;
            }

            btnStop.classList.add('hidden'); // 중단 버튼 숨기기

            let winnerText = "";
            if (p1.hp <= 0 && p2.hp <= 0) {
                winnerText = "무승부 (DRAW)!";
            } else if (p1.hp <= 0) {
                winnerText = "🔴 RED 승리!";
            } else {
                winnerText = "🔵 BLUE 승리!";
            }

            overlayTitle.innerText = winnerText;
            overlaySubtitle.innerHTML = `최종 체력<br>BLUE: ${Math.max(0, Math.ceil(p1.hp))} HP | RED: ${Math.max(0, Math.ceil(p2.hp))} HP`;
            btnStart.innerHTML = `<i class="fa-solid fa-rotate-right"></i> 다시 하기`;

            gameOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Render loop
        function gameLoop() {
            // 깨끗한 흰색 배경 (격자선 완전 제거)
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);

            // 외곽선 경계
            ctx.strokeStyle = '#E2E8F0';
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, width, height);

            // 준비 카운트다운 표시
            if (isPreparing && isRunning) {
                ctx.save();
                ctx.font = '900 48px Orbitron, sans-serif';
                ctx.fillStyle = '#334155';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(launchTimer > 0 ? launchTimer : 'START!', width / 2, height / 2);
                ctx.restore();
            }

            // 물리 및 위치 업데이트
            p1.updatePosition();
            p2.updatePosition();

            // 공 충돌 처리
            handleBallCollision();

            // 파티클 처리
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            // floating 데미지 텍스트 처리
            damageTexts = damageTexts.filter(t => t.life > 0);
            damageTexts.forEach(t => {
                t.update();
                t.draw(ctx);
            });

            // 공 그리기
            p1.draw(ctx);
            p2.draw(ctx);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Button Event Listeners
        btnStart.addEventListener('click', () => {
            audio.init();
            startGame();
        });

        btnStop.addEventListener('click', () => {
            stopGame();
        });

        btnSound.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            if (audio.enabled) {
                soundIcon.className = "fa-solid fa-volume-high";
                btnSound.classList.remove('opacity-50');
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark";
                btnSound.classList.add('opacity-50');
            }
        });

        // Initialize Canvas & Run Game Loop
        resizeCanvas();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
