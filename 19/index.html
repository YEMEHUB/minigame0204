<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피자 토핑 러쉬 - Pizza Topping Rush</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&family=Orbitron:wght@700;900&family=Jua&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        jua: ['Jua', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: #0f0a1c;
        }

        /* Conveyor belt animation */
        @keyframes conveyorMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
        .conveyor-belt {
            background: repeating-linear-gradient(90deg, #1e293b, #1e293b 20px, #334155 20px, #334155 40px);
            animation: conveyorMove 0.4s linear infinite;
        }
        .conveyor-belt.paused {
            animation-play-state: paused;
        }

        @keyframes boxPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .box-pop {
            animation: boxPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropTopping {
            0% { transform: translateY(-80px) scale(1.3); opacity: 0.8; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .dropping {
            animation: dropTopping 0.15s ease-in forwards;
        }

        @keyframes splat {
            0% { transform: scale(1); }
            50% { transform: scale(1.4, 0.6); }
            100% { transform: scale(1); }
        }
        .splatter {
            animation: splat 0.3s ease-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.5); border-radius: 9999px; }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden relative selection:bg-amber-500 selection:text-slate-950">

    <!-- Header Section -->
    <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-500 to-red-500 flex items-center justify-center text-2xl shadow-lg shadow-amber-500/30 ring-2 ring-amber-400/30">
                🍕
            </div>
            <div>
                <h1 class="font-jua text-2xl tracking-wide bg-gradient-to-r from-amber-300 via-orange-300 to-yellow-200 bg-clip-text text-transparent leading-none">
                    피자 토핑 러쉬!
                </h1>
                <p class="text-[11px] text-amber-300/70 font-semibold tracking-wider mt-1">타이밍 맞춰 토핑을 얹어 황금 피자 완성하기!</p>
            </div>
        </div>

        <!-- Score & Money Indicator -->
        <div class="flex items-center space-x-2">
            <div class="bg-slate-900/90 border border-amber-500/40 rounded-2xl px-3.5 py-1.5 flex items-center space-x-2 shadow-lg backdrop-blur-md">
                <span class="text-amber-400 text-sm">🪙</span>
                <span id="moneyDisplay" class="font-orbitron font-extrabold text-amber-300 text-sm">0</span>
            </div>
            <button id="soundToggleBtn" class="w-10 h-10 rounded-2xl bg-slate-900/80 hover:bg-slate-800 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-all active:scale-95 shadow-md">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
        </div>
    </header>

    <!-- Stage Progress Indicator Bar -->
    <div class="w-full max-w-md mx-auto px-4 mb-2 z-20">
        <div class="bg-slate-900/90 border border-amber-500/30 rounded-2xl p-2.5 shadow-lg backdrop-blur-md flex flex-col gap-1.5">
            <div class="flex justify-between items-center px-1">
                <span id="stageLabel" class="font-orbitron font-black text-xs text-amber-400 tracking-wider">STAGE 1 / 10</span>
                <span id="stageTargetText" class="text-[11px] font-jua text-slate-300">목표: 피자 완성하기</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden border border-slate-700">
                <div id="stageProgressBar" class="bg-gradient-to-r from-amber-500 via-orange-500 to-emerald-400 h-full w-[10%] transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- Main Game Section -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-1 max-w-md mx-auto w-full text-center relative z-10">

        <!-- Customer Order Bubble -->
        <div class="w-full bg-slate-900/90 backdrop-blur-xl border border-amber-500/30 p-3.5 rounded-2xl mb-3 flex items-center justify-between shadow-xl relative overflow-hidden">
            <div class="flex items-center space-x-3">
                <div id="customerAvatar" class="text-3xl bg-slate-800/80 p-2 rounded-xl border border-slate-700">👦</div>
                <div class="text-left">
                    <div id="customerName" class="text-xs font-bold text-amber-300">단골 손님 민수</div>
                    <div id="customerMsg" class="text-xs font-jua text-slate-200">"페퍼로니 3개를 중앙에 딱 올려주세요!"</div>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block font-semibold">남은 필요 토핑</span>
                <span id="remainingToppings" class="text-sm font-orbitron font-extrabold text-amber-400">3 / 3</span>
            </div>
        </div>

        <!-- Pizza Factory Area -->
        <div id="factoryArea" class="w-full aspect-square max-w-[320px] mx-auto bg-slate-950 border-4 border-amber-600/40 rounded-3xl p-4 flex flex-col items-center justify-between relative shadow-2xl overflow-hidden select-none cursor-pointer">
            
            <!-- Target Alignment Line Zone (Dynamic Width by Stage) -->
            <div id="targetZone" class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-16 border-x-2 border-emerald-500/50 bg-emerald-500/10 pointer-events-none z-10 flex flex-col justify-between py-2 items-center transition-all duration-300">
                <span id="targetZoneLabel" class="text-[9px] font-orbitron font-bold text-emerald-400/90 bg-slate-900/90 px-1.5 py-0.5 rounded animate-pulse">EASY TARGET</span>
                <i class="fa-solid fa-chevron-down text-emerald-400 text-xs animate-bounce"></i>
            </div>

            <!-- Top Dropper Dispenser -->
            <div class="relative z-20 w-full flex justify-center mt-1">
                <div class="bg-gradient-to-b from-stone-800 to-slate-900 border-2 border-amber-500/50 rounded-2xl px-6 py-2 shadow-xl flex items-center gap-2">
                    <span class="text-xs text-amber-300 font-bold font-jua">투하 준비:</span>
                    <span id="currentTopperIcon" class="text-3xl animate-pulse">🍕</span>
                </div>
            </div>

            <!-- Moving Conveyor Area -->
            <div class="relative w-full h-36 my-auto flex items-center overflow-hidden rounded-2xl border-y-4 border-slate-700 bg-slate-900">
                <!-- Conveyor Background -->
                <div id="conveyorBelt" class="absolute inset-0 conveyor-belt paused opacity-40"></div>

                <!-- Moving Pizza Dough -->
                <div id="pizzaDough" class="absolute left-[-100px] w-28 h-28 rounded-full bg-gradient-to-tr from-amber-700 via-amber-500 to-amber-300 border-4 border-amber-200 flex items-center justify-center shadow-2xl z-20">
                    <!-- Pizza Cheese Base -->
                    <div class="w-22 h-22 rounded-full bg-yellow-200/90 border-2 border-amber-400 flex items-center justify-center relative overflow-hidden">
                        <!-- Placed Toppings Slot -->
                        <div id="placedToppings" class="absolute inset-0 flex items-center justify-center flex-wrap p-2 gap-1"></div>
                    </div>
                </div>

                <!-- Result Overlays (Boxed Success / Burnt Ruined) -->
                <div id="boxGraphic" class="hidden absolute inset-0 bg-slate-950/80 z-30 flex flex-col items-center justify-center box-pop p-4">
                    <div id="boxEmoji" class="text-[80px] filter drop-shadow-[0_15px_25px_rgba(245,158,11,0.6)]">🎁</div>
                    <div id="victoryText" class="hidden flex-col items-center justify-center mt-1">
                        <span class="text-4xl font-jua font-black text-amber-300 drop-shadow-[0_4px_12px_rgba(245,158,11,0.8)] animate-bounce text-center leading-tight">
                            🍕 피자먹고<br>얼굴피자! 😊
                        </span>
                        <span class="text-xs font-bold text-amber-200/90 mt-2 bg-amber-500/20 px-3 py-1 rounded-full border border-amber-400/40">
                            10단계 ALL CLEAR! 🎉
                        </span>
                    </div>
                </div>

                <div id="burntGraphic" class="hidden absolute inset-0 bg-rose-950/90 z-30 flex flex-col items-center justify-center text-center p-2">
                    <span class="text-6xl mb-1">💥</span>
                    <span class="font-jua text-rose-300 text-lg">망한 피자! 토핑을 놓쳤습니다!</span>
                </div>
            </div>

            <!-- Judgment Floating Badge -->
            <div id="judgeBadge" class="hidden text-xl font-black font-orbitron px-4 py-1 rounded-full shadow-2xl border z-30 mb-2">
                PERFECT!
            </div>
            
            <p id="tapPrompt" class="text-xs font-jua text-amber-300/80 z-20">화면을 클릭하면 토핑을 바로 떨어뜨립니다!</p>
        </div>

        <!-- Combo & Score Bar -->
        <div class="w-full flex justify-between items-center my-3 px-2">
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-400">연속 콤보:</span>
                <span id="comboDisplay" class="font-orbitron font-black text-lg text-amber-400">0 x</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-400">성공 피자:</span>
                <span id="completedPizzas" class="font-orbitron font-black text-lg text-emerald-400">0</span>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full grid grid-cols-2 gap-3 mt-1">
            <!-- Drop Topping Button -->
            <button id="dropBtn" disabled class="py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/30 border border-amber-300/40 transition-all duration-150 flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-bullseye text-base"></i>
                <span>토핑 투하! (Space)</span>
            </button>

            <!-- Start / Next Order Button -->
            <button id="startBtn" class="py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-95 text-white font-extrabold text-base shadow-lg shadow-emerald-600/30 border border-emerald-400/30 transition-all duration-150 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play text-base"></i>
                <span id="startBtnText">새 피자 만들기</span>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl mx-auto p-4 text-center text-xs text-slate-500">
        <p class="font-jua text-slate-400">🍕 도우가 중앙에 도착했을 때 딱 맞춰 토핑을 투하하세요!</p>
    </footer>

    <!-- Web Audio Sound Synthesizer Engine -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.error(e);
                }
            }

            playDrop() {
                this.playTone(523.25, 'triangle', 0.1, 0.2); // C5
            }

            playPerfect() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, C
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.15), idx * 80);
                });
            }

            playFail() {
                if (!this.enabled) return;
                this.init();
                this.playTone(180, 'sawtooth', 0.3, 0.2);
                setTimeout(() => this.playTone(130, 'sawtooth', 0.4, 0.25), 150);
            }
        }

        const sound = new SoundEngine();

        // Game State Engine
        let gameState = 'IDLE'; // 'IDLE', 'RUNNING', 'RESULT'
        let currentStage = 1; // 1 to 10 Stages
        const maxStage = 10;

        let doughX = -100;
        let baseDoughSpeed = 2.8; 
        let doughSpeed = 2.8;
        let doughDirection = 1;
        let animFrameId = null;

        let requiredToppings = 3;
        let currentToppingsCount = 0;
        let currentToppingIcon = '🍕';

        let money = 0;
        let combo = 0;
        let successCount = 0;

        // Customer Data (Variations)
        const customers = [
            { name: "단골 손님 민수", avatar: "👦", topping: "🍕", msg: "페퍼로니 피자가 제일 좋아요!" },
            { name: "미소천사 수진", avatar: "👧", topping: "🍄", msg: "버섯을 듬뿍 올려주세요!" },
            { name: "피자 매니아 동현", avatar: "👨", topping: "🧀", msg: "치즈 토핑으로 가득 채워줘요!" },
            { name: "친절한 할머니", avatar: "👵", topping: "🍍", msg: "상큼한 파인애플 피자 부탁하네~" },
            { name: "미식가 셰프", avatar: "👨‍🍳", topping: "🫒", msg: "올리브 토핑 정밀 투하 부탁합니다!" }
        ];
        let currentCustomer = customers[0];

        // DOM Cache
        const stageLabel = document.getElementById('stageLabel');
        const stageTargetText = document.getElementById('stageTargetText');
        const stageProgressBar = document.getElementById('stageProgressBar');
        const targetZone = document.getElementById('targetZone');
        const targetZoneLabel = document.getElementById('targetZoneLabel');

        const moneyDisplay = document.getElementById('moneyDisplay');
        const customerAvatar = document.getElementById('customerAvatar');
        const customerName = document.getElementById('customerName');
        const customerMsg = document.getElementById('customerMsg');
        const remainingToppings = document.getElementById('remainingToppings');

        const factoryArea = document.getElementById('factoryArea');
        const conveyorBelt = document.getElementById('conveyorBelt');
        const pizzaDough = document.getElementById('pizzaDough');
        const placedToppings = document.getElementById('placedToppings');
        const currentTopperIcon = document.getElementById('currentTopperIcon');
        
        const boxGraphic = document.getElementById('boxGraphic');
        const burntGraphic = document.getElementById('burntGraphic');
        const judgeBadge = document.getElementById('judgeBadge');
        
        const comboDisplay = document.getElementById('comboDisplay');
        const completedPizzas = document.getElementById('completedPizzas');
        
        const dropBtn = document.getElementById('dropBtn');
        const startBtn = document.getElementById('startBtn');
        const startBtnText = document.getElementById('startBtnText');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');

        // Update Stage difficulty parameters
        function setupStageDifficulty() {
            stageLabel.textContent = `STAGE ${currentStage} / ${maxStage}`;
            stageProgressBar.style.width = `${(currentStage / maxStage) * 100}%`;

            // Stage difficulty scaling
            baseDoughSpeed = 2.4 + (currentStage * 0.55); // Speed increases per stage
            
            // Required toppings (starts at 3, increases up to 6)
            requiredToppings = Math.min(6, 2 + Math.floor(currentStage / 2));

            // Target zone width & precision decreases at higher stages
            if (currentStage <= 3) {
                targetZone.style.width = '4rem'; // 64px - Easy
                targetZoneLabel.textContent = 'EASY TARGET';
                targetZoneLabel.className = 'text-[9px] font-orbitron font-bold text-emerald-400/90 bg-slate-900/90 px-1.5 py-0.5 rounded animate-pulse';
            } else if (currentStage <= 7) {
                targetZone.style.width = '3rem'; // 48px - Medium
                targetZoneLabel.textContent = 'MEDIUM TARGET';
                targetZoneLabel.className = 'text-[9px] font-orbitron font-bold text-amber-400/90 bg-slate-900/90 px-1.5 py-0.5 rounded animate-pulse';
            } else {
                targetZone.style.width = '2.25rem'; // 36px - Hard Master
                targetZoneLabel.textContent = 'MASTER ZONE';
                targetZoneLabel.className = 'text-[9px] font-orbitron font-bold text-rose-400/90 bg-slate-900/90 px-1.5 py-0.5 rounded animate-pulse';
            }

            stageTargetText.textContent = `속도 Level ${currentStage} | 토핑 ${requiredToppings}개 필요`;
        }

        // Customer Selection
        function pickNextCustomer() {
            setupStageDifficulty();

            currentCustomer = customers[(currentStage - 1) % customers.length];
            customerAvatar.textContent = currentCustomer.avatar;
            customerName.textContent = `${currentCustomer.name} (St.${currentStage})`;
            customerMsg.textContent = `"${currentCustomer.msg}"`;
            
            currentToppingsCount = 0;
            currentToppingIcon = currentCustomer.topping;

            currentTopperIcon.textContent = currentToppingIcon;
            remainingToppings.textContent = `${currentToppingsCount} / ${requiredToppings}`;
        }

        // Animation Conveyor Loop
        function animateConveyor() {
            if (gameState !== 'RUNNING') return;

            const containerWidth = factoryArea.clientWidth;
            doughX += doughSpeed * doughDirection;

            if (doughX >= containerWidth - 110) {
                doughDirection = -1;
            } else if (doughX <= -10) {
                doughDirection = 1;
            }

            pizzaDough.style.left = `${doughX}px`;
            animFrameId = requestAnimationFrame(animateConveyor);
        }

        // Start Pizza Dough Motion
        function startNewPizza() {
            sound.init();
            gameState = 'RUNNING';

            pickNextCustomer();
            placedToppings.innerHTML = '';
            
            boxGraphic.classList.add('hidden');
            burntGraphic.classList.add('hidden');
            judgeBadge.classList.add('hidden');

            conveyorBelt.classList.remove('paused');
            
            doughX = -10;
            doughDirection = 1;
            doughSpeed = baseDoughSpeed;

            startBtn.disabled = true;
            dropBtn.disabled = false;

            animFrameId = requestAnimationFrame(animateConveyor);
        }

        // Drop Topping Action & Precision Calculation
        function dropTopping() {
            if (gameState !== 'RUNNING') return;
            sound.playDrop();

            const containerWidth = factoryArea.clientWidth;
            const targetCenterX = containerWidth / 2;
            const currentDoughCenterX = doughX + 56;
            
            const distance = Math.abs(targetCenterX - currentDoughCenterX);

            let judgment = '';
            let badgeStyle = '';
            let isHit = false;
            let toppingValue = 0;

            // Target tolerance shrinks as stage progresses
            const perfectRange = Math.max(14, 30 - currentStage * 1.5);
            const greatRange = Math.max(30, 56 - currentStage * 2);

            if (distance <= perfectRange) {
                judgment = 'PERFECT! 🎯 (+1)';
                badgeStyle = 'bg-emerald-400 text-slate-950 border-emerald-300';
                isHit = true;
                toppingValue = 1;
                combo++;
            } else if (distance <= greatRange) {
                judgment = 'GREAT! 👍 (+0.5)';
                badgeStyle = 'bg-amber-400 text-slate-950 border-amber-300';
                isHit = true;
                toppingValue = 0.5;
            } else {
                judgment = 'MISS! ❌';
                badgeStyle = 'bg-rose-600 text-white border-rose-400';
                isHit = false;
                toppingValue = 0;
                combo = 0;
            }

            comboDisplay.textContent = `${combo} x`;

            judgeBadge.textContent = judgment;
            judgeBadge.className = `text-xl font-black font-orbitron px-4 py-1 rounded-full shadow-2xl border z-30 mb-2 ${badgeStyle}`;
            judgeBadge.classList.remove('hidden');

            if (isHit) {
                currentToppingsCount += toppingValue;
                remainingToppings.textContent = `${currentToppingsCount} / ${requiredToppings}`;

                const toppingEl = document.createElement('span');
                toppingEl.className = 'text-xl dropping';
                // Display half-topping visual cue if +0.5
                toppingEl.textContent = toppingValue === 0.5 ? `${currentToppingIcon}½` : currentToppingIcon;
                placedToppings.appendChild(toppingEl);

                // Slight increment inside stage
                doughSpeed += 0.25;

                if (currentToppingsCount >= requiredToppings) {
                    completePizzaSuccess();
                }
            } else {
                failPizza();
            }
        }

        // Pizza Success Handling (Stage Progression)
        function completePizzaSuccess() {
            gameState = 'RESULT';
            cancelAnimationFrame(animFrameId);
            conveyorBelt.classList.add('paused');

            dropBtn.disabled = true;
            startBtn.disabled = false;

            successCount++;
            completedPizzas.textContent = successCount;

            const stageReward = 150 + (currentStage * 100) + (combo * 30);
            money += stageReward;
            moneyDisplay.textContent = money.toLocaleString();

            const boxEmoji = document.getElementById('boxEmoji');
            const victoryText = document.getElementById('victoryText');

            if (currentStage >= maxStage) {
                // Game Clear Victory!
                startBtnText.textContent = "🏆 게임 다시하기 🍕";
                boxEmoji.textContent = "🍕";
                victoryText.classList.remove('hidden');
                victoryText.classList.add('flex');

                setTimeout(() => {
                    boxGraphic.classList.remove('hidden');
                    sound.playPerfect();
                    confetti({ particleCount: 250, spread: 120, origin: { y: 0.5 } });
                }, 300);
                currentStage = 1; // Reset to level 1 for repeat
            } else {
                // Advance to next stage
                currentStage++;
                startBtnText.textContent = `다음 ${currentStage}단계 도전 🚀`;
                boxEmoji.textContent = "🎁";
                victoryText.classList.add('hidden');
                victoryText.classList.remove('flex');

                setTimeout(() => {
                    boxGraphic.classList.remove('hidden');
                    sound.playPerfect();
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                }, 300);
            }
        }

        // Pizza Failure Handling
        function failPizza() {
            gameState = 'RESULT';
            cancelAnimationFrame(animFrameId);
            conveyorBelt.classList.add('paused');

            dropBtn.disabled = true;
            startBtn.disabled = false;
            startBtnText.textContent = `${currentStage}단계 다시 도전하기 🔄`;

            sound.playFail();

            setTimeout(() => {
                burntGraphic.classList.remove('hidden');
            }, 200);
        }

        // Event Listener Registration
        function setupEventListeners() {
            startBtn.addEventListener('click', startNewPizza);
            dropBtn.addEventListener('click', dropTopping);

            factoryArea.addEventListener('click', (e) => {
                if (gameState === 'RUNNING') {
                    dropTopping();
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    if (gameState === 'RUNNING') {
                        dropTopping();
                    } else if (gameState === 'IDLE' || gameState === 'RESULT') {
                        startNewPizza();
                    }
                }
            });

            soundToggleBtn.addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                if (sound.enabled) {
                    soundIcon.className = "fa-solid fa-volume-high";
                    soundToggleBtn.classList.remove('opacity-50');
                    sound.playTone(600, 'sine', 0.05);
                } else {
                    soundIcon.className = "fa-solid fa-volume-xmark";
                    soundToggleBtn.classList.add('opacity-50');
                }
            });
        }

        // Window Init
        window.onload = function() {
            setupEventListeners();
            pickNextCustomer();
        };
    </script>
</body>
</html>
