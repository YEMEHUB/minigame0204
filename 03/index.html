<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도망쳐, 피그! (Pig Escape: Dark Alley Thriller)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #08070b;
      color: #e2e8f0;
      touch-action: manipulation;
      overflow: hidden;
    }

    .font-thriller {
      font-family: 'Creepster', cursive, 'Noto Sans KR', sans-serif;
    }

    canvas {
      box-shadow: 0 0 30px rgba(220, 38, 38, 0.2);
    }

    /* Scanline Effect for Thriller Vibe */
    .scanline {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
    }

    .vignette {
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.4; }
    }

    .danger-border {
      animation: pulse-red 1.5s infinite;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 select-none">

  <!-- UI Overlay Container -->
  <div class="relative w-full max-w-4xl flex flex-col items-center">
    
    <!-- Title Bar -->
    <div class="w-full flex justify-between items-center mb-2 px-2">
      <h1 class="text-2xl md:text-3xl font-bold tracking-wider text-red-600 font-thriller flex items-center gap-2 drop-shadow-[0_2px_4px_rgba(255,0,0,0.8)]">
        <i class="fa-solid font-bold fa-skull text-red-700"></i> RUN PIG RUN
      </h1>
      <div class="flex items-center gap-4">
        <div class="text-sm md:text-base font-bold bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-lg text-zinc-300">
          거리: <span id="distanceText" class="text-yellow-500 font-mono text-lg">0</span>m
        </div>
        <div class="text-sm md:text-base font-bold bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-lg text-zinc-300">
          최고: <span id="highScoreText" class="text-red-500 font-mono text-lg">0</span>m
        </div>
      </div>
    </div>

    <!-- Main Canvas Wrapper -->
    <div class="relative w-full aspect-[16/9] max-h-[70vh] bg-black rounded-xl overflow-hidden border-2 border-zinc-800">
      
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>
      
      <!-- Overlay Effects -->
      <div class="absolute inset-0 pointer-events-none scanline opacity-40"></div>
      <div class="absolute inset-0 pointer-events-none vignette"></div>
      <div id="dangerOverlay" class="absolute inset-0 pointer-events-none border-8 border-red-600 danger-border opacity-0 transition-opacity duration-300"></div>

      <!-- Start / Game Over Screen Overlay -->
      <div id="uiOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
        
        <!-- Start Screen -->
        <div id="startMenu" class="flex flex-col items-center max-w-md">
          <div class="w-20 h-20 mb-4 bg-red-950/60 rounded-full border-2 border-red-600 flex items-center justify-center text-red-500 text-4xl shadow-[0_0_20px_rgba(220,38,38,0.5)]">
            <i class="fa-solid fa-piggy-bank"></i>
          </div>
          <h2 class="text-3xl md:text-4xl font-extrabold text-red-600 mb-2 font-thriller">잔혹한 도살장 탈출</h2>
          <p class="text-zinc-400 text-sm md:text-base mb-6 leading-relaxed">
            비 내리는 어두운 으스스한 밤... 도살자와 칼날, 장애물을 피해 끝까지 도망치세요!<br>
            추격자와의 거리가 좁혀지면 위험해집니다.
          </p>
          <div class="grid grid-cols-2 gap-3 w-full mb-6 text-xs text-zinc-400">
            <div class="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800 flex items-center gap-2">
              <span class="bg-zinc-800 px-2 py-1 rounded text-white font-mono">Space / Click</span>
              <span>점프 (2단 점프)</span>
            </div>
            <div class="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800 flex items-center gap-2">
              <span class="bg-zinc-800 px-2 py-1 rounded text-white font-mono">↓ Key / Swipe</span>
              <span>슬라이딩</span>
            </div>
          </div>
          <button id="startBtn" class="w-full py-4 bg-red-700 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-900/40 transform active:scale-95 transition-all text-lg tracking-wider border border-red-500">
            <i class="fa-solid fa-play mr-2"></i> 탈출 시작하기
          </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverMenu" class="hidden flex flex-col items-center max-w-md">
          <div class="text-red-600 text-5xl mb-2 font-thriller">CAPTURED!</div>
          <p id="deathReason" class="text-zinc-400 text-sm mb-4">도살자에게 잡혔습니다...</p>
          
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 w-full mb-6 text-center">
            <div class="text-zinc-400 text-sm mb-1">도망친 거리</div>
            <div id="finalDistance" class="text-4xl font-extrabold text-yellow-500 font-mono mb-2">0m</div>
            <div class="text-xs text-zinc-500">최고 기록: <span id="finalHighScore" class="text-zinc-300">0m</span></div>
          </div>

          <button id="restartBtn" class="w-full py-4 bg-red-700 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-900/40 transform active:scale-95 transition-all text-lg tracking-wider border border-red-500">
            <i class="fa-solid fa-rotate-right mr-2"></i> 다시 도망치기
          </button>
        </div>

      </div>

    </div>

    <!-- On-screen Controls for Mobile -->
    <div class="w-full grid grid-cols-2 gap-3 mt-3 md:hidden">
      <button id="mobileJumpBtn" class="py-4 bg-zinc-900 border border-zinc-800 active:bg-zinc-800 text-zinc-200 rounded-xl font-bold flex items-center justify-center gap-2 text-lg">
        <i class="fa-solid fa-arrow-up"></i> 점프
      </button>
      <button id="mobileSlideBtn" class="py-4 bg-zinc-900 border border-zinc-800 active:bg-zinc-800 text-zinc-200 rounded-xl font-bold flex items-center justify-center gap-2 text-lg">
        <i class="fa-solid fa-arrow-down"></i> 슬라이딩
      </button>
    </div>

    <!-- Audio Settings / Instructions Footer -->
    <div class="w-full flex justify-between items-center mt-3 text-xs text-zinc-500 px-2">
      <div>스릴러 사운드 효과 지원 (Web Audio API)</div>
      <button id="soundToggle" class="flex items-center gap-1 hover:text-zinc-300">
        <i class="fa-solid fa-volume-high" id="soundIcon"></i> <span id="soundText">사운드 ON</span>
      </button>
    </div>

  </div>

  <script>
    // --- Audio System (Synthesized Web Audio API & Speech) ---
    class SoundController {
      constructor() {
        this.ctx = null;
        this.muted = false;
        // Speech Synthesis setup
        this.synth = window.speechSynthesis;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        // Warm up speech synthesis on user interaction
        if (this.synth && this.synth.speaking) {
          this.synth.cancel();
        }
      }

      speak(text, pitch = 1.3, rate = 1.4) {
        if (this.muted || !this.synth) return;
        
        // Cancel previous speech to play sound immediately on jump
        this.synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.pitch = pitch; // High pitched panicked voice
        utterance.rate = rate;   // Fast frantic speech
        utterance.volume = 1.0;

        // Try to find a Korean voice if available
        const voices = this.synth.getVoices();
        const koVoice = voices.find(v => v.lang.includes('ko'));
        if (koVoice) {
          utterance.voice = koVoice;
        }

        this.synth.speak(utterance);
      }

      playJump(isDoubleJump = false) {
        if (this.muted) return;

        // Sound effect (boing sound)
        if (this.ctx) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(isDoubleJump ? 250 : 150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(isDoubleJump ? 600 : 400, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        }

        // Voice lines requested by user
        if (!isDoubleJump) {
          // 1st Jump: "이게 뭐야!"
          this.speak("이게 뭐야!", 1.4, 1.5);
        } else {
          // 2nd Jump: "치킨 좋아!"
          this.speak("치킨 좋아!", 1.6, 1.6);
        }
      }

      playSqueal() {
        if (this.muted || !this.ctx) return;
        // Pig squeal sound simulation
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.1);
        osc.frequency.linearRampToValueAtTime(400, this.ctx.currentTime + 0.3);
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }

      playHit() {
        if (this.muted || !this.ctx) return;
        // Low impact sound
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }

      playChainsaw() {
        if (this.muted || !this.ctx) return;
        // Buzzing threat sound
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.setValueAtTime(120, this.ctx.currentTime + 0.05);
        osc.frequency.setValueAtTime(90, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);

        // Pursuer shouting line
        this.speak("강지원 바보!", 0.8, 1.2);
      }
    }

    const soundCtrl = new SoundController();

    // --- Game Logic ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const uiOverlay = document.getElementById('uiOverlay');
    const startMenu = document.getElementById('startMenu');
    const gameOverMenu = document.getElementById('gameOverMenu');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const distanceText = document.getElementById('distanceText');
    const highScoreText = document.getElementById('highScoreText');
    const finalDistance = document.getElementById('finalDistance');
    const finalHighScore = document.getElementById('finalHighScore');
    const deathReason = document.getElementById('deathReason');
    const dangerOverlay = document.getElementById('dangerOverlay');

    // Sound toggle
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    soundToggle.addEventListener('click', () => {
      soundCtrl.muted = !soundCtrl.muted;
      if (soundCtrl.muted) {
        soundIcon.className = 'fa-solid fa-volume-xmark';
        soundText.textContent = '사운드 OFF';
      } else {
        soundIcon.className = 'fa-solid fa-volume-high';
        soundText.textContent = '사운드 ON';
      }
    });

    // Game Variables
    let gameRunning = false;
    let distance = 0;
    let highScore = localStorage.getItem('pig_escape_highscore') || 0;
    highScoreText.textContent = Math.floor(highScore);

    let speed = 6;
    const baseSpeed = 6;
    let gameTime = 0;

    // Viewport Resizing
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ground definition
    const groundY = () => canvas.height * 0.8;

    // --- Entities ---

    // Pig Player
    const pig = {
      x: 120,
      y: 0,
      width: 50,
      height: 38,
      normalHeight: 38,
      slideHeight: 22,
      vy: 0,
      gravity: 0.65,
      jumpStrength: -12.5,
      isGrounded: false,
      jumpCount: 0,
      maxJumps: 2,
      isSliding: false,
      slideTimer: 0,
      eyeRedness: 0,
      mudSplatterTimer: 0,

      reset() {
        this.x = canvas.width * 0.25;
        this.y = groundY() - this.height;
        this.vy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
        this.isSliding = false;
        this.height = this.normalHeight;
      },

      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.vy = this.jumpStrength;
          this.isGrounded = false;
          this.jumpCount++;
          this.isSliding = false;
          this.height = this.normalHeight;
          
          // Pass double jump state to play customized voice lines
          soundCtrl.playJump(this.jumpCount === 2);
        }
      },

      slide() {
        if (!this.isSliding && this.isGrounded) {
          this.isSliding = true;
          this.height = this.slideHeight;
          this.y = groundY() - this.height;
          this.slideTimer = 35; // Frames to slide
        }
      },

      update() {
        // Apply Gravity
        this.vy += this.gravity;
        this.y += this.vy;

        // Ground Collision
        const currentGround = groundY() - this.height;
        if (this.y >= currentGround) {
          this.y = currentGround;
          this.vy = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }

        // Slide Timer
        if (this.isSliding) {
          this.slideTimer--;
          if (this.slideTimer <= 0) {
            this.isSliding = false;
            this.height = this.normalHeight;
            this.y = groundY() - this.height;
          }
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Dirty/Muddy Pig Body (Darker pink/brownish for thriller)
        const pigColor = '#b86b77';
        const darkMud = '#3d251e';

        if (this.isSliding) {
          // Sliding Pose (flattened)
          ctx.fillStyle = pigColor;
          ctx.beginPath();
          ctx.ellipse(this.width / 2, this.height / 2, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
          ctx.fill();

          // Ear
          ctx.fillStyle = '#8a4b54';
          ctx.beginPath();
          ctx.moveTo(5, 5);
          ctx.lineTo(15, 0);
          ctx.lineTo(15, 10);
          ctx.fill();

          // Terrified Red/Glowing Eye
          ctx.fillStyle = '#ff2222';
          ctx.beginPath();
          ctx.arc(this.width - 12, 8, 3, 0, Math.PI * 2);
          ctx.fill();

          // Snout
          ctx.fillStyle = '#d98492';
          ctx.fillRect(this.width - 6, 8, 6, 8);

        } else {
          // Standing / Running / Jumping Pose
          // Legs animation
          const legAnim = Math.sin(gameTime * 0.3) * 8;

          ctx.fillStyle = '#221115';
          // Back Legs
          ctx.fillRect(10 + legAnim, this.height - 10, 6, 12);
          ctx.fillRect(this.width - 20 - legAnim, this.height - 10, 6, 12);

          // Body
          ctx.fillStyle = pigColor;
          ctx.beginPath();
          ctx.roundRect(0, 0, this.width, this.height - 6, [15, 20, 10, 10]);
          ctx.fill();

          // Mud Splatters (Thriller Texture)
          ctx.fillStyle = darkMud;
          ctx.beginPath();
          ctx.arc(12, 18, 5, 0, Math.PI * 2);
          ctx.arc(25, 22, 4, 0, Math.PI * 2);
          ctx.arc(32, 12, 3, 0, Math.PI * 2);
          ctx.fill();

          // Front Legs
          ctx.fillStyle = '#11080a';
          ctx.fillRect(12 - legAnim, this.height - 8, 6, 10);
          ctx.fillRect(this.width - 16 + legAnim, this.height - 8, 6, 10);

          // Ears
          ctx.fillStyle = '#8a4b54';
          ctx.beginPath();
          ctx.moveTo(8, -2);
          ctx.lineTo(18, -8);
          ctx.lineTo(20, 8);
          ctx.fill();

          // Scared Face Details
          // Wide Panic Eye
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(this.width - 14, 12, 5, 0, Math.PI * 2);
          ctx.fill();
          
          // Pupil (terrified)
          ctx.fillStyle = '#ff0000';
          ctx.beginPath();
          ctx.arc(this.width - 13, 12, 2, 0, Math.PI * 2);
          ctx.fill();

          // Snout
          ctx.fillStyle = '#d98492';
          ctx.beginPath();
          ctx.roundRect(this.width - 8, 12, 10, 12, 3);
          ctx.fill();
          // Nostrils
          ctx.fillStyle = '#5c2d34';
          ctx.fillRect(this.width - 2, 15, 2, 2);
          ctx.fillRect(this.width - 2, 19, 2, 2);

          // Curly Tail
          ctx.strokeStyle = pigColor;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(-4, 12, 6, 0, Math.PI * 1.5);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    // The Pursuer (Chainsaw Butcher Silhouette)
    const butcher = {
      x: -100,
      distanceFromPig: 220, // Lower means closer
      minDistance: 60,
      maxDistance: 250,

      update() {
        // Butcher approaches pig if pig trips or slows down
        const targetX = pig.x - this.distanceFromPig;
        this.x += (targetX - this.x) * 0.1;

        // Sound threat when close
        if (this.distanceFromPig < 120 && Math.random() < 0.05) {
          soundCtrl.playChainsaw();
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, groundY() - 90);

        // Ominous Red Aura
        const aura = ctx.createRadialGradient(40, 40, 10, 40, 40, 80);
        aura.addColorStop(0, 'rgba(220, 38, 38, 0.4)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(40, 40, 80, 0, Math.PI * 2);
        ctx.fill();

        // Dark Silhouette of Butcher
        ctx.fillStyle = '#050508';

        // Head with mask
        ctx.fillRect(30, 0, 25, 25);
        // Glowing Red Eyes
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(48, 6, 4, 3);

        // Body (Apron)
        ctx.fillStyle = '#0a0a0f';
        ctx.beginPath();
        ctx.moveTo(20, 25);
        ctx.lineTo(60, 25);
        ctx.lineTo(70, 85);
        ctx.lineTo(10, 85);
        ctx.fill();

        // Chainsaw Arm
        ctx.fillStyle = '#111';
        ctx.fillRect(55, 35, 35, 12);

        // Saw Blade (Flashing)
        const flash = Math.random() > 0.5 ? '#e11d48' : '#94a3b8';
        ctx.fillStyle = flash;
        ctx.fillRect(85, 25, 30, 28);

        // Blood Splatters on Saw
        ctx.fillStyle = '#990000';
        ctx.fillRect(95, 28, 8, 8);
        ctx.fillRect(105, 38, 6, 10);

        ctx.restore();
      }
    };

    // Rain & Environment Particles
    let raindrops = [];
    function initRain() {
      raindrops = [];
      for (let i = 0; i < 80; i++) {
        raindrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 10 + 12
        });
      }
    }

    function updateAndDrawRain() {
      ctx.strokeStyle = 'rgba(160, 175, 200, 0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let r of raindrops) {
        r.y += r.speed;
        r.x -= 2; // Wind effect
        if (r.y > canvas.height) {
          r.y = -20;
          r.x = Math.random() * canvas.width;
        }
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 4, r.y + r.length);
      }
      ctx.stroke();
    }

    // Background Buildings & Streetlamps
    let bgElements = [];
    function initBg() {
      bgElements = [];
      for (let i = 0; i < 6; i++) {
        bgElements.push({
          x: i * 200,
          width: 120 + Math.random() * 80,
          height: 150 + Math.random() * 150,
          hasLight: Math.random() > 0.4
        });
      }
    }

    function updateAndDrawBg() {
      ctx.fillStyle = '#0d0d14';
      for (let el of bgElements) {
        el.x -= speed * 0.2; // Parallax
        if (el.x + el.width < 0) {
          el.x = canvas.width + Math.random() * 50;
        }
        // Building body
        ctx.fillRect(el.x, groundY() - el.height, el.width, el.height);

        // Windows (Creepy dim light)
        if (el.hasLight) {
          ctx.fillStyle = 'rgba(234, 179, 8, 0.15)';
          for (let wx = el.x + 15; wx < el.x + el.width - 20; wx += 25) {
            for (let wy = groundY() - el.height + 20; wy < groundY() - 30; wy += 35) {
              if (Math.random() > 0.1) {
                ctx.fillRect(wx, wy, 12, 18);
              }
            }
          }
          ctx.fillStyle = '#0d0d14';
        }
      }

      // Street Fog / Mist on Ground
      const fogGradient = ctx.createLinearGradient(0, groundY() - 40, 0, groundY() + 40);
      fogGradient.addColorStop(0, 'rgba(15, 23, 42, 0)');
      fogGradient.addColorStop(0.5, 'rgba(30, 41, 59, 0.6)');
      fogGradient.addColorStop(1, 'rgba(15, 23, 42, 0.9)');
      ctx.fillStyle = fogGradient;
      ctx.fillRect(0, groundY() - 40, canvas.width, 100);
    }

    // Obstacles
    let obstacles = [];
    let spawnTimer = 0;

    class Obstacle {
      constructor() {
        this.type = Math.random() < 0.5 ? 'low' : 'high'; // low = jump over, high = slide under
        this.x = canvas.width + 50;
        
        if (this.type === 'low') {
          // Meat Meat Cleaver / Meat Hook / Barrel
          this.width = 35;
          this.height = 40 + Math.random() * 10;
          this.y = groundY() - this.height;
          this.subType = Math.random() < 0.5 ? 'cleaver' : 'barrel';
        } else {
          // Hanging Meat Hook / Blade
          this.width = 40;
          this.height = 50;
          this.y = groundY() - pig.normalHeight - 25; // Requires slide
          this.subType = 'hook';
        }

        this.passed = false;
      }

      update() {
        this.x -= speed;
      }

      draw() {
        ctx.save();
        if (this.subType === 'cleaver') {
          // Giant Cleaver stuck in ground
          ctx.fillStyle = '#475569';
          ctx.fillRect(this.x + 10, this.y, 15, this.height);
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.moveTo(this.x, this.y + 10);
          ctx.lineTo(this.x + 30, this.y);
          ctx.lineTo(this.x + 25, this.y + this.height);
          ctx.lineTo(this.x, this.y + this.height - 5);
          ctx.fill();

          // Blood on blade
          ctx.fillStyle = '#990000';
          ctx.fillRect(this.x + 2, this.y + this.height - 15, 18, 12);

        } else if (this.subType === 'barrel') {
          // Toxic/Biohazard Slime Barrel
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.roundRect(this.x, this.y, this.width, this.height, 5);
          ctx.fill();

          // Glowing hazard stripe
          ctx.fillStyle = '#ca8a04';
          ctx.fillRect(this.x, this.y + 12, this.width, 8);

        } else if (this.subType === 'hook') {
          // Hanging Meat Hook
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(this.x + this.width / 2, 0);
          ctx.lineTo(this.x + this.width / 2, this.y + 20);
          ctx.stroke();

          // Sharp Hook Blade
          ctx.fillStyle = '#cbd5e1';
          ctx.beginPath();
          ctx.arc(this.x + this.width / 2, this.y + 30, 15, 0, Math.PI);
          ctx.fill();

          ctx.fillStyle = '#990000'; // Blood tip
          ctx.beginPath();
          ctx.arc(this.x + this.width / 2 - 12, this.y + 30, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function handleObstacles() {
      spawnTimer++;
      // Min distance between obstacles decreases as speed increases
      const minInterval = Math.max(70, 140 - Math.floor(speed * 4));
      
      if (spawnTimer > minInterval + Math.random() * 50) {
        obstacles.push(new Obstacle());
        spawnTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.update();
        obs.draw();

        // Collision Check (AABB)
        const hitBoxBuffer = 6; // slightly forgiving
        if (
          pig.x + hitBoxBuffer < obs.x + obs.width &&
          pig.x + pig.width - hitBoxBuffer > obs.x &&
          pig.y + hitBoxBuffer < obs.y + obs.height &&
          pig.y + pig.height - hitBoxBuffer > obs.y
        ) {
          // Hit obstacle!
          soundCtrl.playHit();
          soundCtrl.playSqueal();

          // Butcher gets closer on stumble
          butcher.distanceFromPig -= 60;
          obstacles.splice(i, 1);

          // Danger visual flash
          dangerOverlay.style.opacity = '0.8';
          setTimeout(() => { dangerOverlay.style.opacity = '0'; }, 300);

          if (butcher.distanceFromPig <= butcher.minDistance) {
            triggerGameOver("장애물에 걸려 도살자에게 잡혔습니다!");
          }
          continue;
        }

        // Remove offscreen
        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    // Draw Ground
    function drawGround() {
      const gY = groundY();
      // Wet Asphalt
      ctx.fillStyle = '#12131a';
      ctx.fillRect(0, gY, canvas.width, canvas.height - gY);

      // Sidewalk Line
      ctx.fillStyle = '#27272a';
      ctx.fillRect(0, gY, canvas.width, 4);

      // Reflective puddles
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fillRect((gameTime * 3) % canvas.width, gY + 15, 60, 6);
      ctx.fillRect((gameTime * 2 + 200) % canvas.width, gY + 35, 90, 8);
    }

    // --- Input Handlers ---
    function handleJumpInput() {
      if (!gameRunning) return;
      pig.jump();
    }

    function handleSlideInput() {
      if (!gameRunning) return;
      pig.slide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleJumpInput();
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        handleSlideInput();
      }
    });

    // Touch & Mouse Support
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.touchStartY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (!this.touchStartY) return;
      const touchEndY = e.changedTouches[0].clientY;
      const diffY = touchEndY - this.touchStartY;

      if (diffY > 30) {
        // Swipe Down
        handleSlideInput();
      } else {
        // Tap / Swipe Up
        handleJumpInput();
      }
      this.touchStartY = null;
    }, { passive: false });

    // Buttons
    document.getElementById('mobileJumpBtn').addEventListener('click', handleJumpInput);
    document.getElementById('mobileSlideBtn').addEventListener('click', handleSlideInput);

    // --- Game Loop & Control ---
    function startNewGame() {
      soundCtrl.init();
      gameRunning = true;
      distance = 0;
      speed = baseSpeed;
      gameTime = 0;
      obstacles = [];
      spawnTimer = 0;

      pig.reset();
      butcher.distanceFromPig = butcher.maxDistance;

      initRain();
      initBg();

      uiOverlay.classList.add('hidden');
      startMenu.classList.add('hidden');
      gameOverMenu.classList.add('hidden');

      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver(reason) {
      gameRunning = false;
      soundCtrl.playSqueal();

      if (distance > highScore) {
        highScore = distance;
        localStorage.setItem('pig_escape_highscore', highScore);
        highScoreText.textContent = Math.floor(highScore);
      }

      deathReason.textContent = reason;
      finalDistance.textContent = `${Math.floor(distance)}m`;
      finalHighScore.textContent = `${Math.floor(highScore)}m`;

      uiOverlay.classList.remove('hidden');
      gameOverMenu.classList.remove('hidden');
    }

    function gameLoop() {
      if (!gameRunning) return;

      gameTime++;
      distance += speed * 0.05;
      distanceText.textContent = Math.floor(distance);

      // Gradually increase difficulty
      speed = baseSpeed + Math.min(8, distance * 0.005);

      // Slowly recover butcher distance if running smoothly
      if (butcher.distanceFromPig < butcher.maxDistance) {
        butcher.distanceFromPig += 0.05;
      }

      // Danger UI warning when butcher is close
      if (butcher.distanceFromPig < 130) {
        dangerOverlay.style.opacity = (130 - butcher.distanceFromPig) / 100;
      } else {
        dangerOverlay.style.opacity = '0';
      }

      // Clear Frame
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render World Elements
      updateAndDrawBg();
      drawGround();
      updateAndDrawRain();

      // Render Entities
      handleObstacles();
      pig.update();
      pig.draw();

      butcher.update();
      butcher.draw();

      requestAnimationFrame(gameLoop);
    }

    // Event Listeners
    startBtn.addEventListener('click', startNewGame);
    restartBtn.addEventListener('click', startNewGame);

  </script>
</body>
</html>
