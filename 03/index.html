            user-select: none;

        .neon-text-purple {

        /* Custom Scrollbar */

        }

            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {

            50% { opacity: 0.6; transform: scale(1.05); }

        .glow-bg {
            animation: pulseGlow 6s infinite ease-in-out;

</head>

    <!-- Audio Synth Manager (Web Audio API) -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                return this.isMuted;
            }

            // Soft neon click sound
            playClick() {
                if (this.isMuted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);

                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            }

            // Ladder traversal step sound (sweet bell)
            playStep() {
                if (this.isMuted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C E G C E
                    const freq = freqs[Math.floor(Math.random() * freqs.length)];
                    
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e) {}
            }

            // Heartbeat / turn pop sound for direction change
            playTurnPop() {
                if (this.isMuted) return;
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    
                    // Low heartbeat thump
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch(e) {}
            }

            // Romantic Fanfare Jingle for result reveal
            playWin() {
                if (this.isMuted) return;
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    // Charming arpeggio ladder finish
                    const notes = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51];
                    
                    notes.forEach((f, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = i === notes.length - 1 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(f, now + i * 0.08);
                        
                        const vol = i === notes.length - 1 ? 0.2 : 0.1;
                        gain.gain.setValueAtTime(vol, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + (i === notes.length - 1 ? 0.8 : 0.25));

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + (i === notes.length - 1 ? 0.8 : 0.25));
                    });
                } catch(e) {}
            }
        }

        const sfx = new SoundFX();
    </script>

    <!-- Particles Background & Enhanced Game Logic -->
    <script>
        // Background Heart Particles
        function initParticles() {
            const pCanvas = document.getElementById('particle-canvas');
            const pCtx = pCanvas.getContext('2d');
            let particles = [];

            function resize() {
                pCanvas.width = window.innerWidth;
                pCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class HeartParticle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * pCanvas.width;
                    this.y = pCanvas.height + Math.random() * 20;
                    this.size = Math.random() * 12 + 6;
                    this.speedY = Math.random() * 0.8 + 0.3;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.5 + 0.2;
                    this.color = Math.random() > 0.4 ? '#ff69b4' : '#ba55d3';
                }

                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX;
                    if (this.y < -20) this.reset();
                }

                draw() {
                    pCtx.save();
                    pCtx.translate(this.x, this.y);
                    pCtx.globalAlpha = this.opacity;
                    pCtx.fillStyle = this.color;
                    
                    // Simple heart shape
                    pCtx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    pCtx.moveTo(0, topCurveHeight);
                    pCtx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    pCtx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    pCtx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    pCtx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    pCtx.closePath();
                    pCtx.fill();
                    pCtx.restore();
                }
            }

            for (let i = 0; i < 25; i++) {
                const p = new HeartParticle();
                p.y = Math.random() * pCanvas.height;
                particles.push(p);
            }

            function animateParticles() {
                pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();
        }

        // App State
        let playerCount = 4;
        let ladderData = [];

        let isAnimating = false;
        let playerResults = {};

        // DOM Elements
        const setupPanel = document.getElementById('setup-panel');

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {

        function setupEventListeners() {
            document.getElementById('btn-decrease').addEventListener('click', () => {

            document.getElementById('btn-increase').addEventListener('click', () => {
                sfx.playClick();
                updatePlayerCount(1);
            });
            document.getElementById('btn-start-game').addEventListener('click', () => {
                sfx.playClick();
                startGame();
            });
            document.getElementById('btn-reset').addEventListener('click', () => {
                sfx.playClick();
                resetToSetup();
            });
            document.getElementById('btn-reveal-all').addEventListener('click', () => {
                sfx.playClick();
                revealAllResults();
            });

            document.getElementById('btn-close-modal').addEventListener('click', () => {
                sfx.playClick();
                closeModal();
            });
            document.getElementById('btn-modal-confirm').addEventListener('click', () => {
                sfx.playClick();
                closeModal();
            });

            // Mute Toggle Event Listener
            const muteBtn = document.getElementById('btn-toggle-mute');
            const muteIcon = document.getElementById('mute-icon');
            const muteText = document.getElementById('mute-text');
            
            muteBtn.addEventListener('click', () => {
                const isMuted = sfx.toggleMute();
                if (isMuted) {
                    muteIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
                    muteText.textContent = '음소거';
                    muteText.className = 'text-slate-500';
                } else {
                    muteIcon.className = 'fa-solid fa-volume-high text-pink-400';
                    muteText.textContent = '소리 켬';
                    muteText.className = 'text-pink-300';
                    sfx.playClick();
                }
            });

            window.addEventListener('resize', () => {
                if (!gamePanel.classList.contains('hidden')) {
                    resizeAndDrawLadder();
                }
            });
        }

        function updatePlayerCount(delta) {
            const newCount = playerCount + delta;
            if (newCount >= 2 && newCount <= 8) {
                playerCount = newCount;
                playerCountDisplay.textContent = playerCount;
                renderInputs();
            }
        }

        function renderInputs() {
            const currentPlayers = Array.from(playerInputsContainer.querySelectorAll('input')).map(i => i.value);
            const currentPrizes = Array.from(prizeInputsContainer.querySelectorAll('input')).map(i => i.value);

            playerInputsContainer.innerHTML = '';
            prizeInputsContainer.innerHTML = '';

            const defaultPreset = PRESETS.couple;

            for (let i = 0; i < playerCount; i++) {
                const pValue = currentPlayers[i] || defaultPreset.players[i] || `참가자 ${i+1}`;
                const pDiv = document.createElement('div');
                pDiv.className = 'flex items-center gap-2';
                pDiv.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-pink-500/20 text-pink-300 font-bold text-xs flex items-center justify-center border border-pink-500/30">${i+1}</span>
                    <input type="text" id="player-input-${i}" value="${pValue}" class="w-full bg-slate-900/80 border border-pink-500/20 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-pink-500 transition placeholder-slate-600" placeholder="이름 입력">
                `;
                playerInputsContainer.appendChild(pDiv);

                const prValue = currentPrizes[i] || defaultPreset.prizes[i] || `미션 / 벌칙 ${i+1}`;
                const prDiv = document.createElement('div');
                prDiv.className = 'flex items-center gap-2';
                prDiv.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-purple-500/20 text-purple-300 font-bold text-xs flex items-center justify-center border border-purple-500/30">${i+1}</span>
                    <input type="text" id="prize-input-${i}" value="${prValue}" class="w-full bg-slate-900/80 border border-purple-500/20 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500 transition placeholder-slate-600" placeholder="결과 입력">
                `;
                prizeInputsContainer.appendChild(prDiv);
            }
        }

        function applyPreset(presetKey) {
            sfx.playClick();
            const preset = PRESETS[presetKey];
            if (!preset) return;

            playerCount = preset.players.length;
            playerCountDisplay.textContent = playerCount;

            playerInputsContainer.innerHTML = '';
            prizeInputsContainer.innerHTML = '';

            for (let i = 0; i < playerCount; i++) {
                const pDiv = document.createElement('div');
                pDiv.className = 'flex items-center gap-2';
                pDiv.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-pink-500/20 text-pink-300 font-bold text-xs flex items-center justify-center border border-pink-500/30">${i+1}</span>
                    <input type="text" id="player-input-${i}" value="${preset.players[i]}" class="w-full bg-slate-900/80 border border-pink-500/20 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-pink-500 transition placeholder-slate-600">
                `;
                playerInputsContainer.appendChild(pDiv);

                const prDiv = document.createElement('div');
                prDiv.className = 'flex items-center gap-2';
                prDiv.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-purple-500/20 text-purple-300 font-bold text-xs flex items-center justify-center border border-purple-500/30">${i+1}</span>
                    <input type="text" id="prize-input-${i}" value="${preset.prizes[i]}" class="w-full bg-slate-900/80 border border-purple-500/20 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500 transition placeholder-slate-600">
                `;
                prizeInputsContainer.appendChild(prDiv);
            }
        }

        function generateLadderData() {
            ladderData = [];
            const rows = 12;

            for (let r = 1; r < rows - 1; r++) {
                let rowRungs = [];
                for (let col = 0; col < playerCount - 1; col++) {
                    if (Math.random() < 0.45 && (col === 0 || !rowRungs[col - 1])) {
                        rowRungs[col] = true;
                    } else {
                        rowRungs[col] = false;
                    }
                }
                ladderData.push(rowRungs);
            }

            playerResults = {};
            for (let i = 0; i < playerCount; i++) {
                playerResults[i] = calculatePath(i).endCol;
            }
        }

        function calculatePath(startCol) {
            let currentCol = startCol;
            let path = [{ col: currentCol, row: 0, isTurn: false }];

            for (let r = 0; r < ladderData.length; r++) {
                const rowRungs = ladderData[r];
                
                path.push({ col: currentCol, row: r + 1, isTurn: false });

                if (currentCol < playerCount - 1 && rowRungs[currentCol]) {
                    currentCol++;
                    path.push({ col: currentCol, row: r + 1, isTurn: true });
                } 
                else if (currentCol > 0 && rowRungs[currentCol - 1]) {
                    currentCol--;
                    path.push({ col: currentCol, row: r + 1, isTurn: true });
                }
            }

            path.push({ col: currentCol, row: ladderData.length + 1, isTurn: false });

            return { path, endCol: currentCol };
        }

        function startGame() {
            setupPanel.classList.add('hidden');
            gamePanel.classList.remove('hidden');
            gamePanel.classList.add('flex');

            generateLadderData();
            buildLabels();
            resizeAndDrawLadder();
        }

        function resetToSetup() {
            gamePanel.classList.add('hidden');
            gamePanel.classList.remove('flex');
            setupPanel.classList.remove('hidden');
            animatedPaths = [];
            isAnimating = false;
        }

        function buildLabels() {
            topLabelsContainer.innerHTML = '';
            bottomLabelsContainer.innerHTML = '';

            const players = getPlayerNames();
            const prizes = getPrizeNames();

            players.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.className = `player-top-btn px-2 py-1.5 rounded-xl text-xs font-bold transition flex flex-col items-center gap-1 border border-pink-500/30 glass-card hover:border-pink-400 hover:scale-105 active:scale-95`;
                btn.style.width = `${100 / playerCount}%`;
                btn.innerHTML = `
                    <span class="w-5 h-5 rounded-full bg-pink-500 text-white flex items-center justify-center text-[10px] shadow">${idx+1}</span>
                    <span class="truncate max-w-full text-pink-200">${p}</span>
                `;
                btn.onclick = () => tracePlayerPath(idx);
                topLabelsContainer.appendChild(btn);
            });

            prizes.forEach((pr, idx) => {
                const div = document.createElement('div');
                div.id = `bottom-label-${idx}`;
                div.className = `px-2 py-2 rounded-xl text-xs font-semibold text-center glass-card border border-purple-500/20 text-purple-200 transition duration-300 flex flex-col items-center justify-center`;
                div.style.width = `${100 / playerCount}%`;
                div.innerHTML = `<span class="truncate max-w-full">${pr}</span>`;
                bottomLabelsContainer.appendChild(div);
            });
        }

        function getPlayerNames() {
            const names = [];
            for (let i = 0; i < playerCount; i++) {
                const val = document.getElementById(`player-input-${i}`).value.trim();
                names.push(val || `참가자 ${i+1}`);
            }
            return names;
        }

        function getPrizeNames() {
            const prizes = [];
            for (let i = 0; i < playerCount; i++) {
                const val = document.getElementById(`prize-input-${i}`).value.trim();
                prizes.push(val || `미션 ${i+1}`);
            }
            return prizes;
        }

        function resizeAndDrawLadder() {
            const containerWidth = canvasWrapper.clientWidth;
            canvas.width = containerWidth;
            canvas.height = Math.max(380, window.innerHeight * 0.45);

            drawLadderBase();
            animatedPaths.forEach(pData => drawPathTrace(pData.path, pData.color));
        }

        function getLadderCoords() {
            const numCols = playerCount;
            const paddingX = canvas.width / (numCols * 2);
            const colSpacing = (canvas.width - paddingX * 2) / (numCols - 1);
            
            const numRows = ladderData.length + 1;
            const paddingY = 20;
            const rowSpacing = (canvas.height - paddingY * 2) / numRows;

            return { paddingX, colSpacing, paddingY, rowSpacing };
        }

        function drawLadderBase() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const { paddingX, colSpacing, paddingY, rowSpacing } = getLadderCoords();

            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 105, 180, 0.25)';
            ctx.lineCap = 'round';

            for (let col = 0; col < playerCount; col++) {
                const x = paddingX + col * colSpacing;
                ctx.beginPath();
                ctx.moveTo(x, paddingY);
                ctx.lineTo(x, canvas.height - paddingY);
                ctx.stroke();
            }

            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(186, 85, 211, 0.35)';

            for (let r = 0; r < ladderData.length; r++) {
                const y = paddingY + (r + 1) * rowSpacing;
                for (let c = 0; c < playerCount - 1; c++) {
                    if (ladderData[r][c]) {
                        const x1 = paddingX + c * colSpacing;
                        const x2 = paddingX + (c + 1) * colSpacing;
                        ctx.beginPath();
                        ctx.moveTo(x1, y);
                        ctx.lineTo(x2, y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animate path traversal with direction turn pop sound & step sounds
        function tracePlayerPath(playerIdx) {
            if (isAnimating) return;

            const existingIdx = animatedPaths.findIndex(p => p.playerIdx === playerIdx);
            if (existingIdx !== -1) {
                sfx.playClick();
                showResultModal(playerIdx, playerResults[playerIdx]);
                return;
            }

            isAnimating = true;
            sfx.init();

            const { path, endCol } = calculatePath(playerIdx);
            const colors = ['#ff2a85', '#00f3ff', '#b537ff', '#ffb800', '#00ff66', '#ff0055', '#3399ff', '#ff66cc'];
            const pathColor = colors[playerIdx % colors.length];

            const { paddingX, colSpacing, paddingY, rowSpacing } = getLadderCoords();

            const pixelPoints = path.map(pt => ({
                x: paddingX + pt.col * colSpacing,
                y: paddingY + pt.row * rowSpacing,
                isTurn: pt.isTurn
            }));

            let currentSegment = 0;
            let progress = 0;
            const speed = 0.08;

            function animate() {
                if (currentSegment >= pixelPoints.length - 1) {
                    isAnimating = false;
                    animatedPaths.push({ playerIdx, path: pixelPoints, color: pathColor });
                    
                    sfx.playWin();

                    const targetLabel = document.getElementById(`bottom-label-${endCol}`);
                    if (targetLabel) {
                        targetLabel.classList.add('border-pink-400', 'bg-pink-500/20', 'neon-border-pink', 'scale-105');
                    }

                    setTimeout(() => {
                        showResultModal(playerIdx, endCol);
                    }, 200);
                    return;
                }

                const p1 = pixelPoints[currentSegment];
                const p2 = pixelPoints[currentSegment + 1];

                progress += speed;
                if (progress >= 1) {
                    progress = 0;
                    currentSegment++;
                    
                    // Sound effects on step or turn
                    if (p2.isTurn) {
                        sfx.playTurnPop();
                    } else {
                        sfx.playStep();
                    }
                }

                drawLadderBase();
                animatedPaths.forEach(pData => drawPathTrace(pData.path, pData.color));

                ctx.lineWidth = 5;
                ctx.strokeStyle = pathColor;
                ctx.shadowColor = pathColor;
                ctx.shadowBlur = 12;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(pixelPoints[0].x, pixelPoints[0].y);

                for (let i = 0; i < currentSegment; i++) {
                    ctx.lineTo(pixelPoints[i + 1].x, pixelPoints[i + 1].y);
                }

                const currX = p1.x + (p2.x - p1.x) * progress;
                const currY = p1.y + (p2.y - p1.y) * progress;
                ctx.lineTo(currX, currY);
                ctx.stroke();

                // Leading glowing orb
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(currX, currY, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        }

        function drawPathTrace(pixelPoints, color) {
            ctx.lineWidth = 5;
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(pixelPoints[0].x, pixelPoints[0].y);
            for (let i = 1; i < pixelPoints.length; i++) {
                ctx.lineTo(pixelPoints[i].x, pixelPoints[i].y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function revealAllResults() {
            if (isAnimating) return;

            animatedPaths = [];
            const colors = ['#ff2a85', '#00f3ff', '#b537ff', '#ffb800', '#00ff66', '#ff0055', '#3399ff', '#ff66cc'];
            const { paddingX, colSpacing, paddingY, rowSpacing } = getLadderCoords();

            for (let i = 0; i < playerCount; i++) {
                const { path, endCol } = calculatePath(i);
                const pixelPoints = path.map(pt => ({
                    x: paddingX + pt.col * colSpacing,
                    y: paddingY + pt.row * rowSpacing,
                    isTurn: pt.isTurn
                }));

                animatedPaths.push({
                    playerIdx: i,
                    path: pixelPoints,
                    color: colors[i % colors.length]
                });

                const targetLabel = document.getElementById(`bottom-label-${endCol}`);
                if (targetLabel) {
                    targetLabel.classList.add('border-pink-400', 'bg-pink-500/20', 'neon-border-pink');
                }
            }

            drawLadderBase();
            animatedPaths.forEach(pData => drawPathTrace(pData.path, pData.color));
            sfx.playWin();
        }

        function showResultModal(playerIdx, prizeIdx) {
            const players = getPlayerNames();
            const prizes = getPrizeNames();

            modalPlayerName.textContent = `[ ${players[playerIdx]} ] 님의 운명`;
            modalResultText.textContent = prizes[prizeIdx];

            const randomComment = COMMENTS[Math.floor(Math.random() * COMMENTS.length)];
            modalComment.textContent = `"${randomComment}"`;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-90');
            modal.querySelector('div').classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-90');
        }
    </script>
</body>
