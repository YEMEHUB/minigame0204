
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장애물 피하기 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a202c;
            touch-action: none; /* Prevent scroll on touch */
            font-family: 'Inter', sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #87CEEB; /* Default Morning Sky */
            overflow: hidden;
            transition: background-color 1s ease;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark-glass-panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Mobile Controls */
        .control-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255,255,255,0.6);
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            user-select: none;
            transition: transform 0.1s, background 0.1s;
        }
        .control-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.6);
        }
        .jump-btn {
            width: 80px;
            height: 80px;
            border-radius: 20px;
        }
        
        #game-over-screen {
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer p-4 z-50">
        <!-- Top UI: Score and Themes -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="glass-panel text-white font-bold text-xl px-4 py-2 rounded-xl shadow-lg" id="score-display">
                    점수: 0
                </div>
                <button id="btn-pause" onclick="togglePause()" class="glass-panel text-white font-bold px-4 py-1 rounded-xl hover:bg-white/40 transition">⏸️ 멈춤</button>
            </div>
            <div class="flex flex-col gap-2">
                <button onclick="setTheme('morning')" class="glass-panel text-white px-3 py-1 rounded-lg text-sm hover:bg-white/40 transition">☀️ 아침</button>
                <button onclick="setTheme('sunset')" class="glass-panel text-white px-3 py-1 rounded-lg text-sm hover:bg-white/40 transition">🌇 노을</button>
                <button onclick="setTheme('dark')" class="glass-panel text-white px-3 py-1 rounded-lg text-sm hover:bg-white/40 transition">🌙 다크</button>
            </div>
        </div>

        <!-- Music Player Input -->
        <div class="pointer-events-auto mt-2">
            <div class="glass-panel rounded-xl p-2 flex flex-col gap-2">
                <label class="text-white text-xs font-bold">음악 검색 (가수 제목):</label>
                <div class="flex gap-2">
                    <input type="text" id="music-search" placeholder="예: 뉴진스 Ditto" class="w-full bg-black/30 text-white text-xs px-2 py-1 rounded outline-none border border-white/30 placeholder-gray-300">
                    <button onclick="searchAndPlayMusic()" class="bg-white/30 text-white text-xs px-3 py-1 rounded hover:bg-white/50 transition whitespace-nowrap">검색/재생</button>
                </div>
                <div id="music-info" class="text-green-400 text-xs font-bold mt-1 hidden"></div>
                <div id="music-error" class="hidden text-red-400 text-xs font-bold mt-1">검색 실패!</div>
                
                <label class="text-white text-xs font-bold mt-1">또는 음악 파일 직접 추가:</label>
                <input type="file" id="music-file-input" accept="audio/*" class="w-full text-white text-xs bg-black/30 p-1 rounded border border-white/30">
                <audio id="bg-music" loop></audio>
                
                <label class="text-white text-xs font-bold mt-1">배경 사진 추가:</label>
                <input type="file" id="bg-image-input" accept="image/*" class="w-full text-white text-xs bg-black/30 p-1 rounded border border-white/30">
            </div>
        </div>

        <div class="flex-grow"></div>

        <!-- Mobile Controls -->
        <div class="flex justify-between items-end pb-4 pointer-events-auto">
            <div class="flex gap-4">
                <button class="control-btn" id="btn-left">←</button>
                <button class="control-btn" id="btn-right">→</button>
            </div>
            <button class="control-btn jump-btn" id="btn-jump">JUMP</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="absolute inset-0 dark-glass-panel flex flex-col items-center justify-center pointer-events-auto z-50">
        <h1 class="text-5xl font-black text-red-500 mb-2 drop-shadow-lg">충돌! 실패</h1>
        <p class="text-white text-2xl mb-6">최종 점수: <span id="final-score">0</span></p>
        <button onclick="resetGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-xl transition transform hover:scale-105 active:scale-95">다시 하기</button>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="hidden absolute inset-0 dark-glass-panel flex-col items-center justify-center pointer-events-auto z-40">
        <h1 class="text-5xl font-black text-white mb-8 drop-shadow-lg">일시정지</h1>
        <button onclick="togglePause()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-xl transition transform hover:scale-105 active:scale-95">계속 하기</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 dark-glass-panel flex flex-col items-center justify-center pointer-events-auto z-50">
        <h1 class="text-4xl font-black text-white mb-2 drop-shadow-lg text-center">차량 장애물 피하기</h1>
        <p class="text-gray-200 mb-8 text-center px-4">A / D 키(또는 좌우 버튼)로 이동<br>스페이스바(또는 JUMP 버튼)로 점프하여 피하세요!</p>
        <button onclick="startGame()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-xl transition transform hover:scale-105 active:scale-95">게임 시작</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    // UI Elements
    const scoreDisplay = document.getElementById('score-display');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startScreen = document.getElementById('start-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    
    // Resize Canvas
    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Variables
    let animationId;
    let isGameOver = false;
    let isPlaying = false;
    let isPaused = false;
    let score = 0;
    let frameCount = 0;
    
    // 3D Perspective Variables
    let gameSpeed = 15;
    let cameraZ = 0;
    let currentCameraX = 0;
    let currentCameraY = 80;
    const cameraHeight = 80;
    
    // Lanes: -120 (Left), 0 (Center), 120 (Right)
    const laneX = [-120, 0, 120];

    // Themes (Two-tone colors added for speed effect on grass/road)
    const themes = {
        morning: { bg: '#87CEEB', road1: '#555555', road2: '#4A4A4A', line: '#FFFFFF', grass1: '#55a630', grass2: '#38b000' },
        sunset: { bg: '#FF7E67', road1: '#4A3B32', road2: '#3E3129', line: '#FFD700', grass1: '#8B4513', grass2: '#70370F' },
        dark: { bg: '#1A202C', road1: '#2D3748', road2: '#232A38', line: '#718096', grass1: '#111111', grass2: '#0a0a0a' }
    };
    let currentTheme = 'morning';

    function setTheme(themeName) {
        currentTheme = themeName;
        container.style.backgroundColor = themes[themeName].bg;
    }

    // Sound Setup (Tone.js)
    let crashSynth, jumpSynth;
    let audioInitialized = false;

    async function initAudio() {
        if(audioInitialized) return;
        await Tone.start();
        
        crashSynth = new Tone.NoiseSynth({
            noise: { type: 'brown' },
            envelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.5 }
        }).toDestination();

        jumpSynth = new Tone.Synth({
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
        }).toDestination();

        audioInitialized = true;
    }

    function playCrashSound() {
        if(crashSynth) crashSynth.triggerAttackRelease("4n");
    }

    function playJumpSound() {
        if(jumpSynth) jumpSynth.triggerAttackRelease("C5", "16n");
    }

    // Music Player
    const bgMusic = document.getElementById('bg-music');
    const musicSearch = document.getElementById('music-search');
    const musicInfo = document.getElementById('music-info');
    const musicError = document.getElementById('music-error');
    
    // 검색창 클릭 시 자동 일시정지
    musicSearch.addEventListener('focus', () => {
        if (isPlaying && !isGameOver && !isPaused) {
            togglePause();
        }
    });

    async function searchAndPlayMusic() {
        musicError.classList.add('hidden');
        musicInfo.classList.add('hidden');
        const query = musicSearch.value;
        if(!query) return;
        
        try {
            // iTunes Search API (무료, 30초 미리듣기 제공)
            const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
            const data = await response.json();
            
            if (data.results && data.results.length > 0) {
                const track = data.results[0];
                bgMusic.src = track.previewUrl; // 30초 미리듣기 음원
                bgMusic.play().then(() => {
                    musicInfo.innerText = `🎵 ${track.trackName} - ${track.artistName}`;
                    musicInfo.classList.remove('hidden');
                }).catch(e => {
                    console.error("음악 재생 오류:", e);
                    musicError.innerText = "음악 재생 실패!";
                    musicError.classList.remove('hidden');
                });
            } else {
                musicError.innerText = "검색 결과가 없습니다.";
                musicError.classList.remove('hidden');
            }
        } catch (error) {
            console.error("검색 오류:", error);
            musicError.innerText = "검색 중 오류가 발생했습니다.";
            musicError.classList.remove('hidden');
        }
    }

    // 파일 업로드로 음악 재생
    const musicFileInput = document.getElementById('music-file-input');
    musicFileInput.addEventListener('change', function(e) {
        musicError.classList.add('hidden');
        const file = e.target.files[0];
        if (file) {
            const objectURL = URL.createObjectURL(file);
            bgMusic.src = objectURL;
            bgMusic.play().catch(e => {
                console.error("음악 재생 오류:", e);
                musicError.classList.remove('hidden');
            });
        }
    });

    // Custom Background Image Handling
    let customBgImg = null;
    const bgImageInput = document.getElementById('bg-image-input');
    bgImageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    customBgImg = img;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        } else {
            customBgImg = null;
        }
    });

    // 3D Projection Engine
    function project3D(x, y, z) {
        let fov = canvas.width * 0.7;
        let horizonY = canvas.height * 0.4; // 40% height for horizon
        let scale = z > 0.1 ? fov / z : 0;
        let screenX = canvas.width / 2 + (x - currentCameraX) * scale;
        let screenY = horizonY + (currentCameraY - y) * scale;
        return { x: screenX, y: screenY, scale };
    }

    // Player Car (First Person View / Dashboard)
    const car = {
        lane: 1, // 0, 1, 2
        currentX: 0,
        jumpY: 0,
        jumpVel: 0,
        isJumping: false,
        draw() {
            let dashHeight = Math.min(canvas.height * 0.45, 300); // 스포츠카 느낌을 위해 약간 더 높게
            let dashY = canvas.height - dashHeight + (Math.sin(frameCount * 0.2) * 3);
            
            if(this.jumpY > 0) dashY += (this.jumpY * 0.2); // 점프 시 대시보드 흔들림

            // 1. 후드 (차량 앞코 - 다크 카본 느낌)
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.moveTo(0, dashY);
            ctx.lineTo(canvas.width, dashY);
            ctx.lineTo(canvas.width * 0.75, dashY - 40);
            ctx.lineTo(canvas.width * 0.25, dashY - 40);
            ctx.fill();

            // 2. 메인 대시보드 바탕 (알칸타라 다크 그레이)
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, dashY, canvas.width, canvas.height - dashY);

            // 대시보드 상단 굴곡
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.moveTo(0, dashY);
            ctx.lineTo(canvas.width, dashY);
            ctx.lineTo(canvas.width, dashY + 45);
            ctx.lineTo(0, dashY + 45);
            ctx.fill();

            // 옐로우 트림 (시그니처 라인)
            ctx.strokeStyle = '#FACC15'; // 람보르기니 옐로우
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, dashY + 45);
            ctx.lineTo(canvas.width, dashY + 45);
            ctx.stroke();

            // 3. 육각형 송풍구 (에어벤트)
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.52, dashY + 5);
            ctx.lineTo(canvas.width * 0.58, dashY + 5);
            ctx.lineTo(canvas.width * 0.60, dashY + 25);
            ctx.lineTo(canvas.width * 0.50, dashY + 25);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 4. 센터페시아 (중앙 콘솔 - 비스듬한 구조)
            ctx.fillStyle = '#161616';
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.52, dashY + 45);
            ctx.lineTo(canvas.width * 0.85, dashY + 45);
            ctx.lineTo(canvas.width * 0.95, canvas.height);
            ctx.lineTo(canvas.width * 0.55, canvas.height);
            ctx.fill();
            // 센터페시아 옐로우 테두리
            ctx.strokeStyle = '#FACC15';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 센터페시아 레드 토글 스위치 및 버튼들
            let btnStartX = canvas.width * 0.62;
            let btnY = dashY + 80;
            ctx.fillStyle = '#E53E3E'; // 강렬한 레드
            for(let i=0; i<5; i++) {
                ctx.fillRect(btnStartX + (i * 22) - (i*2), btnY + (i*5), 8, 16);
            }
            // 엔진 스타트 버튼 (육각형)
            ctx.fillStyle = '#E53E3E';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.7, dashY + 160, 20, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#FACC15';
            ctx.stroke();

            // 5. 디지털 계기판
            ctx.fillStyle = '#0a192f'; // 푸른 디지털 화면
            ctx.beginPath();
            ctx.roundRect(canvas.width * 0.12, dashY + 55, canvas.width * 0.36, 80, 10);
            ctx.fill();
            
            // 속도 및 기어 텍스트
            ctx.fillStyle = '#63B3ED';
            ctx.font = 'bold 26px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.floor(gameSpeed * 12)} km/h`, canvas.width * 0.3, dashY + 105);
            ctx.fillStyle = '#F56565';
            ctx.font = 'bold 16px Inter';
            ctx.fillText(`GEAR 6`, canvas.width * 0.3, dashY + 125);

            // 6. D컷 스티어링 휠 (운전대)
            let steerX = canvas.width * 0.3; // 계기판 앞
            let steerY = dashY + 140;
            let steerAngle = (laneX[this.lane] - this.currentX) * 0.015; // 회전 애니메이션
            
            ctx.save();
            ctx.translate(steerX, steerY);
            ctx.rotate(steerAngle);
            
            // 패들 시프트 (핸들 뒤 기어 변속기)
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.roundRect(-110, -40, 25, 70, 5); // 왼쪽
            ctx.roundRect(85, -40, 25, 70, 5);  // 오른쪽
            ctx.fill();

            // 핸들 림 (알칸타라 느낌의 두꺼운 그립)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 24;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 둥근 상단
            ctx.beginPath();
            ctx.arc(0, -10, 95, 0, Math.PI, true); 
            ctx.stroke();
            
            // 평평한 하단 (D컷)
            ctx.beginPath();
            ctx.moveTo(-95, -10);
            ctx.lineTo(-70, 80);
            ctx.lineTo(70, 80);
            ctx.lineTo(95, -10);
            ctx.stroke();

            // 상단 옐로우 띠 (정중앙 인디케이터)
            ctx.fillStyle = '#FACC15';
            ctx.fillRect(-6, -117, 12, 24);

            // 핸들 중앙 육각형 허브
            ctx.fillStyle = '#161616';
            ctx.beginPath();
            ctx.moveTo(-45, -35);
            ctx.lineTo(45, -35);
            ctx.lineTo(55, 25);
            ctx.lineTo(35, 55);
            ctx.lineTo(-35, 55);
            ctx.lineTo(-55, 25);
            ctx.closePath();
            ctx.fill();
            
            // 옐로우 스티치 디테일
            ctx.strokeStyle = '#FACC15';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 핸들 중앙 엠블럼 (옐로우 실드)
            ctx.fillStyle = '#FACC15';
            ctx.beginPath();
            ctx.moveTo(-12, -15);
            ctx.lineTo(12, -15);
            ctx.lineTo(12, 10);
            ctx.lineTo(0, 20);
            ctx.lineTo(-12, 10);
            ctx.fill();
            
            ctx.restore();
        },
        update() {
            // Smooth Camera X movement for first person view
            this.currentX += (laneX[this.lane] - this.currentX) * 0.15;
            currentCameraX = this.currentX;

            if (this.isJumping) {
                this.jumpY += this.jumpVel;
                this.jumpVel -= 2.5; // Gravity
                
                if (this.jumpY <= 0) {
                    this.jumpY = 0;
                    this.isJumping = false;
                    this.jumpVel = 0;
                }
            }
            
            currentCameraY = cameraHeight + this.jumpY;
        },
        jump() {
            if (!this.isJumping) {
                this.isJumping = true;
                this.jumpVel = 22;
                playJumpSound();
            }
        },
        moveLeft() {
            if (this.lane > 0) this.lane--;
        },
        moveRight() {
            if (this.lane < 2) this.lane++;
        }
    };

    let obstacles = [];
    class Obstacle {
        constructor() {
            this.lane = Math.floor(Math.random() * 3);
            this.z = 1500; // Spawn far away at the horizon
            this.passed = false;
            // 랜덤 색상의 마주오는 자동차
            this.color = ['#E53E3E', '#D69E2E', '#38A169', '#805AD5'][Math.floor(Math.random()*4)];
        }
        draw() {
            if (this.z < 10) return;
            
            let x = laneX[this.lane];
            let y = 0; // Ground level
            
            let proj = project3D(x, y, this.z);
            if(proj.scale <= 0) return;

            let w = 90 * proj.scale;
            let h = 55 * proj.scale;
            let cX = proj.x - w/2;
            let cY = proj.y - h;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(proj.x, proj.y, w*0.8, h*0.25, 0, 0, Math.PI*2);
            ctx.fill();

            // Car Body
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.roundRect(cX, cY, w, h, 6 * proj.scale);
            ctx.fill();
            
            // Roof
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.roundRect(cX + w*0.1, cY - h*0.2, w*0.8, h*0.4, 4 * proj.scale);
            ctx.fill();

            // Windshield
            ctx.fillStyle = '#E2E8F0';
            ctx.fillRect(cX + w*0.15, cY - h*0.15, w*0.7, h*0.3);

            // Grill
            ctx.fillStyle = '#1A202C';
            ctx.fillRect(cX + w*0.3, cY + h*0.4, w*0.4, h*0.3);

            // Headlights (Bright, facing camera)
            ctx.fillStyle = '#FEFCBF';
            ctx.beginPath();
            ctx.arc(cX + w*0.15, cY + h*0.5, w*0.12, 0, Math.PI*2);
            ctx.arc(cX + w*0.85, cY + h*0.5, w*0.12, 0, Math.PI*2);
            ctx.fill();
            
            // Glow effect for headlights
            ctx.fillStyle = 'rgba(254, 252, 191, 0.4)';
            ctx.beginPath();
            ctx.arc(cX + w*0.15, cY + h*0.5, w*0.25, 0, Math.PI*2);
            ctx.arc(cX + w*0.85, cY + h*0.5, w*0.25, 0, Math.PI*2);
            ctx.fill();
        }
        update() {
            // Obstacles move towards the camera based on Z-depth
            this.z -= gameSpeed;
        }
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (!isPlaying || isGameOver || isPaused) return;
        if (e.target.tagName === 'INPUT') return; // 입력창 타이핑 중일 때 조작 방지

        const key = e.key.toLowerCase();
        if (key === 'a' || e.key === 'ArrowLeft') car.moveLeft();
        if (key === 'd' || e.key === 'ArrowRight') car.moveRight();
        if (e.key === ' ' || e.key === 'ArrowUp') { 
            e.preventDefault(); 
            car.jump(); 
        }
    });

    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); car.moveLeft(); });
    document.getElementById('btn-left').addEventListener('mousedown', () => car.moveLeft());
    
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); car.moveRight(); });
    document.getElementById('btn-right').addEventListener('mousedown', () => car.moveRight());
    
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); car.jump(); });
    document.getElementById('btn-jump').addEventListener('mousedown', () => car.jump());

    // Draw Realistic Pseudo-3D Environment
    function drawEnvironment() {
        const theme = themes[currentTheme];
        const horizonY = canvas.height * 0.4;
        
        // 1. Draw Sky Gradient or Custom Background
        if (customBgImg) {
            // Draw custom image for the sky
            ctx.drawImage(customBgImg, 0, 0, canvas.width, horizonY);
        } else {
            // Default Gradient Sky
            let grad = ctx.createLinearGradient(0, 0, 0, horizonY);
            if (currentTheme === 'morning') {
                grad.addColorStop(0, '#4299E1');
                grad.addColorStop(1, '#BEE3F8');
            } else if (currentTheme === 'sunset') {
                grad.addColorStop(0, '#C53030');
                grad.addColorStop(1, '#F6AD55');
            } else {
                grad.addColorStop(0, '#1A202C');
                grad.addColorStop(1, '#2D3748');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, horizonY);
            
            // 2. Draw Sun/Moon (Only if no custom background)
            ctx.fillStyle = currentTheme === 'dark' ? '#F6E05E' : (currentTheme === 'sunset' ? '#ED8936' : '#FAF089');
            ctx.beginPath();
            ctx.arc(canvas.width * 0.7, horizonY * 0.6, horizonY * 0.2, 0, Math.PI*2);
            ctx.fill();
        }

        // 3. Draw 3D Ground & Road (Painters Algorithm: Far to Near)
        let maxDrawZ = 1500;
        let segmentLength = 60;
        let startOffset = cameraZ % segmentLength;
        
        let prevProj = project3D(0, 0, maxDrawZ - startOffset);
        let prevProjLeft = project3D(-180, 0, maxDrawZ - startOffset);
        let prevProjRight = project3D(180, 0, maxDrawZ - startOffset);
        
        for (let actualZ = maxDrawZ - segmentLength - startOffset; actualZ >= 5; actualZ -= segmentLength) {
            let proj = project3D(0, 0, actualZ);
            let projLeft = project3D(-180, 0, actualZ);
            let projRight = project3D(180, 0, actualZ);
            
            // 색상 교차를 통해 질주하는 잔디 효과
            let colorIndex = Math.floor((actualZ + cameraZ) / segmentLength) % 2;
            
            // Grass Background
            ctx.fillStyle = colorIndex === 0 ? theme.grass1 : theme.grass2;
            ctx.beginPath();
            ctx.moveTo(0, proj.y);
            ctx.lineTo(canvas.width, proj.y);
            ctx.lineTo(canvas.width, prevProj.y + 1); // +1 prevents subpixel gaps
            ctx.lineTo(0, prevProj.y + 1);
            ctx.fill();
            
            // Road
            ctx.fillStyle = colorIndex === 0 ? theme.road1 : theme.road2;
            ctx.beginPath();
            ctx.moveTo(projLeft.x, proj.y);
            ctx.lineTo(projRight.x, proj.y);
            ctx.lineTo(prevProjRight.x, prevProj.y + 1);
            ctx.lineTo(prevProjLeft.x, prevProj.y + 1);
            ctx.fill();
            
            // Lane Lines (Dashed, drawn on one color index)
            if (colorIndex === 0) {
                ctx.fillStyle = theme.line;
                let lineW = 6; // base width
                
                // Left Lane Line
                let l1Top = project3D(-60, 0, actualZ + segmentLength);
                let l1Bot = project3D(-60, 0, actualZ);
                ctx.beginPath(); 
                ctx.moveTo(l1Top.x - lineW*l1Top.scale, prevProj.y); 
                ctx.lineTo(l1Top.x + lineW*l1Top.scale, prevProj.y);
                ctx.lineTo(l1Bot.x + lineW*l1Bot.scale, proj.y); 
                ctx.lineTo(l1Bot.x - lineW*l1Bot.scale, proj.y); 
                ctx.fill();
                
                // Right Lane Line
                let l2Top = project3D(60, 0, actualZ + segmentLength);
                let l2Bot = project3D(60, 0, actualZ);
                ctx.beginPath(); 
                ctx.moveTo(l2Top.x - lineW*l2Top.scale, prevProj.y); 
                ctx.lineTo(l2Top.x + lineW*l2Top.scale, prevProj.y);
                ctx.lineTo(l2Bot.x + lineW*l2Bot.scale, proj.y); 
                ctx.lineTo(l2Bot.x - lineW*l2Bot.scale, proj.y); 
                ctx.fill();
            }
            
            prevProj = proj;
            prevProjLeft = projLeft;
            prevProjRight = projRight;
        }
    }

    // Collision Logic (3D Depth & Height)
    function checkCollision(obs) {
        // Player is at Z = 0 in first person view
        if (obs.lane === car.lane) {
            // Collision zone is when obstacle is right in front (Z between 0 and 40)
            if (obs.z > 0 && obs.z < 40) {
                // Height check for jump evasion (Obstacle is around 55 high)
                if (car.jumpY < 45) {
                    return true;
                }
            }
        }
        return false;
    }

    // Main Game Loop
    function gameLoop() {
        if (!isPlaying) return;

        if (isPaused) {
            animationId = requestAnimationFrame(gameLoop);
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Move camera forward
        cameraZ += gameSpeed;

        drawEnvironment();

        car.update();

        // Spawn Obstacles (faster spawning as score increases)
        let spawnRate = Math.max(10, 40 - Math.floor(score/30));
        if (frameCount % spawnRate === 0) {
            // 점수가 어느 정도 올랐을 때(50점 이상) 10% 확률로 자동차 3대 동시 소환 (점프 필수)
            if (score >= 50 && Math.random() < 0.1) {
                let obs1 = new Obstacle(); obs1.lane = 0;
                let obs2 = new Obstacle(); obs2.lane = 1;
                let obs3 = new Obstacle(); obs3.lane = 2;
                obstacles.push(obs1, obs2, obs3);
            } else {
                obstacles.push(new Obstacle());
            }
        }

        // Sort obstacles by Z (Far to Near) for correct Painters Algorithm
        obstacles.sort((a, b) => b.z - a.z);

        // Update & Draw Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.update();
            
            // Collision check
            if (checkCollision(obs)) {
                handleGameOver();
                return; 
            }

            obs.draw();

            // Score update when car passes behind the player
            if (obs.z < 0 && !obs.passed) {
                obs.passed = true;
                score += 10;
                scoreDisplay.innerText = `점수: ${score}`;
                
                // Increase speed progressively (가면 갈수록 더 빠르게)
                if (score % 30 === 0) {
                    gameSpeed += 1.0;
                }
            }

            // Remove cars out of view
            if (obs.z < -100) {
                obstacles.splice(i, 1);
            }
        }

        // Draw Player Dashboard Overlay last
        car.draw();

        frameCount++;
        animationId = requestAnimationFrame(gameLoop);
    }

    function togglePause() {
        if (!isPlaying || isGameOver) return;
        isPaused = !isPaused;
        const pauseScreen = document.getElementById('pause-screen');
        const pauseBtn = document.getElementById('btn-pause');
        
        if (isPaused) {
            pauseScreen.classList.remove('hidden');
            pauseScreen.classList.add('flex');
            pauseBtn.innerText = "▶️ 재생";
        } else {
            pauseScreen.classList.add('hidden');
            pauseScreen.classList.remove('flex');
            pauseBtn.innerText = "⏸️ 멈춤";
        }
    }

    function handleGameOver() {
        isGameOver = true;
        isPlaying = false;
        playCrashSound();
        cancelAnimationFrame(animationId);
        
        // Visual shake effect
        container.style.transform = 'translate(15px, 15px)';
        setTimeout(() => container.style.transform = 'translate(-15px, -15px)', 50);
        setTimeout(() => container.style.transform = 'translate(15px, -15px)', 100);
        setTimeout(() => container.style.transform = 'translate(0, 0)', 150);

        finalScoreDisplay.innerText = score;
        gameOverScreen.style.display = 'flex';
    }

    async function startGame() {
        await initAudio();
        startScreen.style.display = 'none';
        resetGameLogic();
        isPlaying = true;
        gameLoop();
    }

    function resetGame() {
        gameOverScreen.style.display = 'none';
        resetGameLogic();
        isPlaying = true;
        gameLoop();
    }

    function resetGameLogic() {
        car.lane = 1;
        car.currentX = 0;
        car.jumpY = 0;
        car.isJumping = false;
        obstacles = [];
        score = 0;
        frameCount = 0;
        gameSpeed = 15;
        cameraZ = 0;
        currentCameraX = 0;
        currentCameraY = cameraHeight;
        isGameOver = false;
        isPaused = false;
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('pause-screen').classList.remove('flex');
        document.getElementById('btn-pause').innerText = "⏸️ 멈춤";
        scoreDisplay.innerText = `점수: 0`;
    }

    // Initial render for background before start
    setTheme(currentTheme);
    drawEnvironment(); 
    car.draw();

</script>
</body>
