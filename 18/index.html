<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>사이버 도지 - 장애물 피하기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #05050d;
            color: #ffffff;
            overflow: hidden;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-glow-magenta {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .glass-panel {
            background: rgba(13, 16, 33, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0d1021 0%, #040409 100%);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center relative overflow-hidden">

    <!-- Canvas Container -->
    <div id="gameContainer" class="relative w-full h-full max-w-4xl max-h-[900px] sm:rounded-2xl overflow-hidden shadow-2xl border border-cyan-500/30">
        <canvas id="gameCanvas"></canvas>

        <!-- Top HUD Panel -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-10">
            <!-- Score & Multiplier -->
            <div class="flex flex-col">
                <div class="text-xs text-cyan-400 font-orbitron uppercase tracking-wider">SCORE</div>
                <div id="scoreText" class="text-3xl font-bold font-orbitron text-white neon-glow-cyan">0</div>
                <div id="multiplierBadge" class="hidden text-xs font-bold text-amber-300 bg-amber-500/20 border border-amber-400/50 rounded-full px-2 py-0.5 mt-1 w-fit animate-pulse">
                    x2 점수 보너스
                </div>
            </div>

            <!-- Lives & Level -->
            <div class="flex flex-col items-center">
                <div class="text-xs text-pink-400 font-orbitron uppercase tracking-wider mb-1">HEALTH</div>
                <div id="livesContainer" class="flex gap-1.5 text-pink-500 text-xl">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>

            <!-- High Score & Sound Toggle -->
            <div class="flex flex-col items-end pointer-events-auto">
                <div class="flex items-center gap-2 mb-1">
                    <button id="soundBtn" class="p-2 rounded-lg bg-gray-800/80 hover:bg-gray-700 text-cyan-400 border border-cyan-500/30 transition">
                        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <button id="pauseBtn" class="p-2 rounded-lg bg-gray-800/80 hover:bg-gray-700 text-yellow-400 border border-yellow-500/30 transition">
                        <i class="fa-solid fa-pause"></i>
                    </button>
                </div>
                <div class="text-[10px] text-gray-400 font-orbitron">BEST: <span id="highScoreText" class="text-cyan-300">0</span></div>
            </div>
        </div>

        <!-- Active Power-ups Bar -->
        <div id="powerupBar" class="absolute top-20 left-4 flex flex-col gap-2 pointer-events-none z-10">
            <!-- Dynamic power-up timers will be inserted here -->
        </div>

        <!-- Start Screen Overlay -->
        <div id="startScreen" class="absolute inset-0 glass-panel flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity duration-300">
            <h1 class="text-5xl md:text-6xl font-extrabold font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 mb-2 neon-glow-cyan">
                CYBER DODGE
            </h1>
            <p class="text-cyan-200 text-sm md:text-base max-w-md mb-8">
                장애물을 피하고 아이템을 획득하여 최고 기록에 도전하세요!
            </p>

            <div class="grid grid-cols-2 gap-3 max-w-md w-full mb-8 text-left text-xs bg-black/40 p-4 rounded-xl border border-white/10">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-400 inline-block"></span> ☄️ 운석: 위에서 낙하</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> ⚡ 레이저: 경고 후 발사</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span> 🔮 에너지구: 플레이어 추적</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> ✨ 별/보석: 추가 점수</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-400 inline-block"></span> 🛡️ 실드: 피해 1회 방어</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-400 inline-block"></span> ⏳ 슬로우: 시간 감속</div>
            </div>

            <button id="startBtn" class="px-8 py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-extrabold text-xl rounded-xl font-orbitron shadow-lg shadow-cyan-500/50 hover:scale-105 active:scale-95 transition transform">
                게임 시작 <i class="fa-solid fa-play ml-2"></i>
            </button>
            <div class="mt-4 text-xs text-gray-400">조작: [방향키] / [WASD] / 화면 드래그</div>
        </div>

        <!-- Pause Screen Overlay -->
        <div id="pauseScreen" class="hidden absolute inset-0 glass-panel flex flex-col items-center justify-center p-6 text-center z-20">
            <h2 class="text-4xl font-bold font-orbitron text-yellow-400 mb-6">일시 정지</h2>
            <button id="resumeBtn" class="px-6 py-3 bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-bold text-lg rounded-xl font-orbitron hover:scale-105 transition mb-3 w-48">
                계속하기
            </button>
            <button id="restartPauseBtn" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold text-lg rounded-xl font-orbitron transition w-48">
                다시 시작
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverScreen" class="hidden absolute inset-0 glass-panel flex flex-col items-center justify-center p-6 text-center z-20">
            <h2 class="text-5xl font-extrabold font-orbitron text-pink-500 mb-2 neon-glow-magenta">GAME OVER</h2>
            <p class="text-gray-300 text-sm mb-6">기체가 파괴되었습니다!</p>

            <div class="bg-black/50 border border-white/10 rounded-xl p-6 w-full max-w-xs mb-8 flex flex-col gap-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">최종 점수</span>
                    <span id="finalScore" class="text-2xl font-bold font-orbitron text-cyan-400">0</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-white/10 pt-3">
                    <span class="text-gray-400">최고 기록</span>
                    <span id="finalHighScore" class="text-xl font-bold font-orbitron text-amber-400">0</span>
                </div>
            </div>

            <button id="restartBtn" class="px-8 py-4 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white font-extrabold text-xl rounded-xl font-orbitron shadow-lg shadow-pink-500/50 hover:scale-105 active:scale-95 transition transform">
                다시 하기 <i class="fa-solid fa-rotate-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // Sound System using Web Audio API
        class SoundController {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playCollect() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.15); // C6
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playPowerup() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playDamage() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playLaser() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            }
        }

        const audio = new SoundController();

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        let canvasWidth = 0;
        let canvasHeight = 0;

        function resizeCanvas() {
            canvasWidth = container.clientWidth;
            canvasHeight = container.clientHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game State Variables
        let isPlaying = false;
        let isPaused = false;
        let score = 0;
        let highScore = localStorage.getItem('cyberDodge_highScore') || 0;
        let lives = 3;
        let gameTime = 0;
        let lastTime = 0;

        // Player Variables
        const player = {
            x: 0,
            y: 0,
            radius: 18,
            speed: 6,
            vx: 0,
            vy: 0,
            trail: [],
            invulnerable: false,
            invulnerableTimer: 0,
            shieldActive: false,
            multiplierTimer: 0,
            slowTimer: 0
        };

        // Input Handling
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };
        let isTouching = false;
        let touchX = 0;
        let touchY = 0;

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === 'KeyW' || e.key === 'w') keys.w = true;
            if (e.key === 'KeyA' || e.key === 'a') keys.a = true;
            if (e.key === 'KeyS' || e.key === 's') keys.s = true;
            if (e.key === 'KeyD' || e.key === 'd') keys.d = true;
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if (e.key === 'KeyW' || e.key === 'w') keys.w = false;
            if (e.key === 'KeyA' || e.key === 'a') keys.a = false;
            if (e.key === 'KeyS' || e.key === 's') keys.s = false;
            if (e.key === 'KeyD' || e.key === 'd') keys.d = false;
        });

        // Touch Control Setup
        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying || isPaused) return;
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            touchX = e.touches[0].clientX - rect.left;
            touchY = e.touches[0].clientY - rect.top;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isPlaying || isPaused || !isTouching) return;
            const rect = canvas.getBoundingClientRect();
            touchX = e.touches[0].clientX - rect.left;
            touchY = e.touches[0].clientY - rect.top;
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => { isTouching = false; });

        // Entities Arrays
        let obstacles = [];
        let lasers = [];
        let powerups = [];
        let particles = [];
        let floatingTexts = [];

        // UI Element References
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const livesContainer = document.getElementById('livesContainer');
        const multiplierBadge = document.getElementById('multiplierBadge');
        const powerupBar = document.getElementById('powerupBar');
        const startScreen = document.getElementById('startScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreText = document.getElementById('finalScore');
        const finalHighScoreText = document.getElementById('finalHighScore');

        highScoreText.innerText = highScore;

        // Button Listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        document.getElementById('restartPauseBtn').addEventListener('click', () => {
            togglePause();
            startGame();
        });

        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        soundBtn.addEventListener('click', () => {
            audio.init();
            audio.muted = !audio.muted;
            soundIcon.className = audio.muted ? 'fa-solid fa-volume-xmark text-red-400' : 'fa-solid fa-volume-high text-cyan-400';
        });

        // Initialize Game
        function startGame() {
            audio.init();
            isPlaying = true;
            isPaused = false;
            score = 0;
            lives = 3;
            gameTime = 0;
            
            player.x = canvasWidth / 2;
            player.y = canvasHeight * 0.75;
            player.shieldActive = false;
            player.multiplierTimer = 0;
            player.slowTimer = 0;
            player.invulnerable = false;
            player.trail = [];

            obstacles = [];
            lasers = [];
            powerups = [];
            particles = [];
            floatingTexts = [];

            startScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            updateHUD();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseScreen.classList.remove('hidden');
            } else {
                pauseScreen.classList.add('hidden');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            isPlaying = false;
            audio.playGameOver();
            
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('cyberDodge_highScore', highScore);
                highScoreText.innerText = highScore;
            }

            finalScoreText.innerText = Math.floor(score);
            finalHighScoreText.innerText = highScore;
            gameOverScreen.classList.remove('hidden');
        }

        // Particle System
        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015
                });
            }
        }

        function createFloatingText(text, x, y, color = '#00f0ff') {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                vy: -1.5,
                alpha: 1,
                color: color
            });
        }

        // Spawning Mechanics
        let spawnMeteorsTimer = 0;
        let spawnLaserTimer = 0;
        let spawnOrbTimer = 0;
        let spawnPowerupTimer = 0;

        function updateSpawners(dt) {
            const timeScale = player.slowTimer > 0 ? 0.5 : 1.0;
            const difficultyMultiplier = 1 + Math.min(gameTime / 60, 2.5); // Escalates over time

            // Spawn Meteors
            spawnMeteorsTimer += dt * timeScale * difficultyMultiplier;
            if (spawnMeteorsTimer > 1.2) {
                spawnMeteorsTimer = 0;
                obstacles.push({
                    type: 'meteor',
                    x: Math.random() * (canvasWidth - 40) + 20,
                    y: -30,
                    radius: Math.random() * 12 + 12,
                    speedY: (Math.random() * 3 + 3) * difficultyMultiplier,
                    speedX: (Math.random() - 0.5) * 1.5,
                    color: '#ff4d4d',
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.05
                });
            }

            // Spawn Lasers
            spawnLaserTimer += dt * timeScale * difficultyMultiplier;
            if (spawnLaserTimer > 6.0) {
                spawnLaserTimer = 0;
                const isHorizontal = Math.random() > 0.5;
                lasers.push({
                    type: 'laser',
                    isHorizontal: isHorizontal,
                    pos: isHorizontal ? Math.random() * (canvasHeight - 100) + 50 : Math.random() * (canvasWidth - 100) + 50,
                    warningTimer: 1.5, // 1.5s warning before firing
                    activeTimer: 0.8,
                    width: 16,
                    state: 'warning' // 'warning', 'firing', 'done'
                });
            }

            // Spawn Homing Orbs
            spawnOrbTimer += dt * timeScale * difficultyMultiplier;
            if (spawnOrbTimer > 8.0) {
                spawnOrbTimer = 0;
                obstacles.push({
                    type: 'orb',
                    x: Math.random() * canvasWidth,
                    y: -20,
                    radius: 16,
                    speed: 2.2 * difficultyMultiplier,
                    color: '#b026ff',
                    pulse: 0
                });
            }

            // Spawn Powerups & Coins
            spawnPowerupTimer += dt;
            if (spawnPowerupTimer > 4.5) {
                spawnPowerupTimer = 0;
                const types = ['coin', 'coin', 'coin', 'shield', 'slow', 'multiplier', 'heart'];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                
                powerups.push({
                    type: selectedType,
                    x: Math.random() * (canvasWidth - 60) + 30,
                    y: -20,
                    radius: 14,
                    speedY: 2.0
                });
            }
        }

        // Game Loop Update
        function update(dt) {
            gameTime += dt;
            score += dt * 10 * (player.multiplierTimer > 0 ? 2 : 1);
            
            // Handle Timers
            if (player.invulnerableTimer > 0) {
                player.invulnerableTimer -= dt;
                if (player.invulnerableTimer <= 0) player.invulnerable = false;
            }
            if (player.multiplierTimer > 0) player.multiplierTimer -= dt;
            if (player.slowTimer > 0) player.slowTimer -= dt;

            // Player Movement Logic
            let dx = 0;
            let dy = 0;

            if (keys.ArrowLeft || keys.a) dx -= 1;
            if (keys.ArrowRight || keys.d) dx += 1;
            if (keys.ArrowUp || keys.w) dy -= 1;
            if (keys.ArrowDown || keys.s) dy += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            if (isTouching) {
                const targetDx = touchX - player.x;
                const targetDy = touchY - player.y;
                const dist = Math.hypot(targetDx, targetDy);
                if (dist > 5) {
                    dx = targetDx / dist;
                    dy = targetDy / dist;
                }
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            // Canvas Constraints
            player.x = Math.max(player.radius, Math.min(canvasWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvasHeight - player.radius, player.y));

            // Player Trail
            player.trail.push({ x: player.x, y: player.y, alpha: 0.6 });
            if (player.trail.length > 10) player.trail.shift();
            player.trail.forEach(t => t.alpha -= dt * 1.2);

            // Update Spawners
            updateSpawners(dt);

            const speedScale = player.slowTimer > 0 ? 0.5 : 1.0;

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                if (obs.type === 'meteor') {
                    obs.x += obs.speedX * speedScale;
                    obs.y += obs.speedY * speedScale;
                    obs.rotation += obs.rotSpeed;

                    // Collision Check
                    const dist = Math.hypot(player.x - obs.x, player.y - obs.y);
                    if (dist < player.radius + obs.radius) {
                        handlePlayerHit();
                        createExplosion(obs.x, obs.y, '#ff4d4d', 10);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    if (obs.y > canvasHeight + 30) obstacles.splice(i, 1);
                } else if (obs.type === 'orb') {
                    // Homing toward player
                    const angle = Math.atan2(player.y - obs.y, player.x - obs.x);
                    obs.x += Math.cos(angle) * obs.speed * speedScale;
                    obs.y += Math.sin(angle) * obs.speed * speedScale;
                    obs.pulse += dt * 5;

                    const dist = Math.hypot(player.x - obs.x, player.y - obs.y);
                    if (dist < player.radius + obs.radius) {
                        handlePlayerHit();
                        createExplosion(obs.x, obs.y, '#b026ff', 12);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    if (obs.y > canvasHeight + 50) obstacles.splice(i, 1);
                }
            }

            // Update Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                if (l.state === 'warning') {
                    l.warningTimer -= dt;
                    if (l.warningTimer <= 0) {
                        l.state = 'firing';
                        audio.playLaser();
                    }
                } else if (l.state === 'firing') {
                    l.activeTimer -= dt;
                    
                    // Laser Collision Check
                    if (l.isHorizontal) {
                        if (Math.abs(player.y - l.pos) < player.radius + l.width / 2) {
                            handlePlayerHit();
                        }
                    } else {
                        if (Math.abs(player.x - l.pos) < player.radius + l.width / 2) {
                            handlePlayerHit();
                        }
                    }

                    if (l.activeTimer <= 0) {
                        lasers.splice(i, 1);
                    }
                }
            }

            // Update Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.speedY * speedScale;

                const dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.radius + p.radius) {
                    collectPowerup(p);
                    createExplosion(p.x, p.y, getPowerupColor(p.type), 8);
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.y > canvasHeight + 30) powerups.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= pt.decay;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }

            // Update Floating Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= dt * 0.8;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            updateHUD();
        }

        function handlePlayerHit() {
            if (player.invulnerable) return;

            if (player.shieldActive) {
                player.shieldActive = false;
                player.invulnerable = true;
                player.invulnerableTimer = 1.0;
                audio.playDamage();
                createFloatingText("방어 성공!", player.x, player.y - 20, "#00f0ff");
                return;
            }

            lives -= 1;
            audio.playDamage();
            createExplosion(player.x, player.y, '#ff0055', 25);
            player.invulnerable = true;
            player.invulnerableTimer = 1.5;

            if (lives <= 0) {
                gameOver();
            }
        }

        function collectPowerup(p) {
            switch (p.type) {
                case 'coin':
                    score += 150;
                    audio.playCollect();
                    createFloatingText("+150", p.x, p.y, "#ffd700");
                    break;
                case 'shield':
                    player.shieldActive = true;
                    audio.playPowerup();
                    createFloatingText("보호막!", p.x, p.y, "#00f0ff");
                    break;
                case 'slow':
                    player.slowTimer = 5.0;
                    audio.playPowerup();
                    createFloatingText("시간 감속!", p.x, p.y, "#39ff14");
                    break;
                case 'multiplier':
                    player.multiplierTimer = 6.0;
                    audio.playPowerup();
                    createFloatingText("점수 2배!", p.x, p.y, "#ff007f");
                    break;
                case 'heart':
                    if (lives < 5) lives += 1;
                    score += 50;
                    audio.playPowerup();
                    createFloatingText("+1 체력!", p.x, p.y, "#ff0055");
                    break;
            }
        }

        function getPowerupColor(type) {
            switch (type) {
                case 'coin': return '#ffd700';
                case 'shield': return '#00f0ff';
                case 'slow': return '#39ff14';
                case 'multiplier': return '#ff007f';
                case 'heart': return '#ff0055';
                default: return '#ffffff';
            }
        }

        function updateHUD() {
            scoreText.innerText = Math.floor(score);
            
            // Lives Hearts Display
            let heartsHtml = '';
            for (let i = 0; i < lives; i++) {
                heartsHtml += '<i class="fa-solid fa-heart animate-pulse"></i>';
            }
            livesContainer.innerHTML = heartsHtml;

            // Multiplier Badge
            if (player.multiplierTimer > 0) {
                multiplierBadge.classList.remove('hidden');
            } else {
                multiplierBadge.classList.add('hidden');
            }

            // Powerup Timers Display
            let pBarHtml = '';
            if (player.shieldActive) {
                pBarHtml += `<div class="flex items-center gap-2 bg-cyan-950/80 border border-cyan-400 text-cyan-300 text-xs px-2.5 py-1 rounded-full"><i class="fa-solid fa-shield-halved"></i> 보호막 가동 중</div>`;
            }
            if (player.slowTimer > 0) {
                pBarHtml += `<div class="flex items-center gap-2 bg-green-950/80 border border-green-400 text-green-300 text-xs px-2.5 py-1 rounded-full"><i class="fa-solid fa-hourglass-half"></i> 슬로우 (${Math.ceil(player.slowTimer)}s)</div>`;
            }
            if (player.multiplierTimer > 0) {
                pBarHtml += `<div class="flex items-center gap-2 bg-pink-950/80 border border-pink-400 text-pink-300 text-xs px-2.5 py-1 rounded-full"><i class="fa-solid fa-bolt"></i> 2배 점수 (${Math.ceil(player.multiplierTimer)}s)</div>`;
            }
            powerupBar.innerHTML = pBarHtml;
        }

        // Render Functions
        function render() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Draw Dynamic Background Starfield / Grid
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            const offsetY = (gameTime * 20) % gridSize;
            for (let x = 0; x < canvasWidth; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvasHeight);
                ctx.stroke();
            }
            for (let y = offsetY; y < canvasHeight; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvasWidth, y);
                ctx.stroke();
            }

            // Render Lasers Warning / Active
            lasers.forEach(l => {
                if (l.state === 'warning') {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
                    if (l.isHorizontal) {
                        ctx.fillRect(0, l.pos - l.width / 2, canvasWidth, l.width);
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
                        ctx.setLineDash([10, 10]);
                        ctx.beginPath();
                        ctx.moveTo(0, l.pos);
                        ctx.lineTo(canvasWidth, l.pos);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else {
                        ctx.fillRect(l.pos - l.width / 2, 0, l.width, canvasHeight);
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
                        ctx.setLineDash([10, 10]);
                        ctx.beginPath();
                        ctx.moveTo(l.pos, 0);
                        ctx.lineTo(l.pos, canvasHeight);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                } else if (l.state === 'firing') {
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#ffffff';
                    if (l.isHorizontal) {
                        ctx.fillRect(0, l.pos - l.width / 2, canvasWidth, l.width);
                        ctx.fillStyle = 'rgba(255, 0, 85, 0.5)';
                        ctx.fillRect(0, l.pos - l.width, canvasWidth, l.width * 2);
                    } else {
                        ctx.fillRect(l.pos - l.width / 2, 0, l.width, canvasHeight);
                        ctx.fillStyle = 'rgba(255, 0, 85, 0.5)';
                        ctx.fillRect(l.pos - l.width, 0, l.width * 2, canvasHeight);
                    }
                    ctx.shadowBlur = 0;
                }
            });

            // Render Obstacles
            obstacles.forEach(obs => {
                if (obs.type === 'meteor') {
                    ctx.save();
                    ctx.translate(obs.x, obs.y);
                    ctx.rotate(obs.rotation);
                    ctx.shadowColor = obs.color;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = obs.color;
                    ctx.beginPath();
                    // Draw Octagon / Asteroid shape
                    for (let i = 0; i < 8; i++) {
                        const angle = (i * Math.PI) / 4;
                        const r = obs.radius * (0.8 + Math.sin(i * 3) * 0.2);
                        const px = Math.cos(angle) * r;
                        const py = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                } else if (obs.type === 'orb') {
                    ctx.shadowColor = obs.color;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = obs.color;
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius + Math.sin(obs.pulse) * 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Core
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Render Powerups
            powerups.forEach(p => {
                ctx.shadowColor = getPowerupColor(p.type);
                ctx.shadowBlur = 12;
                ctx.fillStyle = getPowerupColor(p.type);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Icon / Letter representation inside powerup
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let symbol = '★';
                if (p.type === 'shield') symbol = '🛡';
                else if (p.type === 'slow') symbol = '⏳';
                else if (p.type === 'multiplier') symbol = '2X';
                else if (p.type === 'heart') symbol = '♥';
                ctx.fillText(symbol, p.x, p.y);
                ctx.shadowBlur = 0;
            });

            // Render Player Trail
            player.trail.forEach(t => {
                ctx.fillStyle = `rgba(0, 240, 255, ${Math.max(0, t.alpha)})`;
                ctx.beginPath();
                ctx.arc(t.x, t.y, player.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });

            // Render Player Character
            if (!player.invulnerable || Math.floor(gameTime * 20) % 2 === 0) {
                ctx.save();
                ctx.translate(player.x, player.y);

                // Shield Aura
                if (player.shieldActive) {
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.radius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Main Ship Design
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath();
                ctx.moveTo(0, -player.radius - 2);
                ctx.lineTo(player.radius, player.radius);
                ctx.lineTo(0, player.radius * 0.5);
                ctx.lineTo(-player.radius, player.radius);
                ctx.closePath();
                ctx.fill();

                // Cockpit Core
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, player.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Render Particles
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // Render Floating Texts
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = 'bold 16px Orbitron, Noto Sans KR';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
            });
        }

        // Main Game Loop
        function gameLoop(time) {
            if (!isPlaying || isPaused) return;

            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
