<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Pulse Beat - 밝고 신나는 리듬게임</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    body {
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* 노트 레이인 3D 원근감 효과 */
    .game-stage {
      perspective: 800px;
      perspective-origin: 50% 20%;
    }
    .track-container {
      transform: rotateX(32deg);
      transform-style: preserve-3d;
    }
    /* 판정선 광원 반짝임 */
    .hit-line {
      box-shadow: 0 0 25px #ffffff, 0 0 50px #ff007f;
    }
    /* 노트 스타일 */
    .note {
      position: absolute;
      border-radius: 12px;
      box-shadow: 0 0 15px currentColor;
    }
    /* 키 프레스 애니메이션 */
    .key-btn.active {
      transform: scale(0.92) translateY(6px);
      filter: brightness(1.3);
    }
    /* 콤보 및 판정 팝업 */
    @keyframes judgePop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .judge-pop {
      animation: judgePop 0.4s ease-out forwards;
    }
    /* 파티클 애니메이션 */
    @keyframes particleFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: particleFly 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center text-white relative">

  <!-- 배경 장식 원형 오브젝트들 -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-yellow-300 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-20 w-96 h-96 bg-pink-400 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 left-1/3 w-96 h-96 bg-cyan-300 rounded-full blur-3xl"></div>
  </div>

  <!-- 메인 게임 컨테이너 -->
  <div id="app" class="relative z-10 w-full max-w-lg h-full max-h-[920px] flex flex-col justify-between p-4 bg-white/10 backdrop-blur-xl rounded-3xl border border-white/20 shadow-2xl overflow-hidden">
    
    <!-- 1. 메인 메뉴 화면 -->
    <div id="start-screen" class="flex-1 flex flex-col justify-between items-center py-8 px-4 text-center">
      <div class="space-y-3 mt-6">
        <span class="inline-block px-4 py-1.5 rounded-full bg-white/20 backdrop-blur-md text-sm font-semibold tracking-wider uppercase border border-white/30 text-yellow-200">
          ✨ Bright Vibe Rhythm
        </span>
        <h1 class="text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-pink-200 to-cyan-200 drop-shadow-sm">
          NEON PULSE
        </h1>
        <p class="text-white/80 text-sm font-medium">리듬을 따라 신나게 키를 눌러보세요!</p>
      </div>

      <!-- 노래 및 난이도 선택 -->
      <div class="w-full space-y-4 my-auto">
        <!-- 곡 목록 -->
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-white/70 block text-left px-1">Song Selection</label>
          <div class="grid grid-cols-1 gap-2 text-left">
            <button onclick="selectSong(0)" id="song-btn-0" class="song-card p-3.5 rounded-2xl bg-white/20 hover:bg-white/30 border border-white/30 transition flex items-center justify-between">
              <div>
                <div class="font-bold text-base text-yellow-200">1. Sunshine Pop Party</div>
                <div class="text-xs text-white/70">128 BPM • 신나는 팝 사운드</div>
              </div>
              <i class="fa-solid fa-music text-yellow-300"></i>
            </button>
            <button onclick="selectSong(1)" id="song-btn-1" class="song-card p-3.5 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/10 transition flex items-center justify-between opacity-80">
              <div>
                <div class="font-bold text-base text-pink-200">2. Sparkle Bubble Beat</div>
                <div class="text-xs text-white/70">140 BPM • 톡톡 튀는 일렉트로</div>
              </div>
              <i class="fa-solid fa-compact-disc text-pink-300"></i>
            </button>
            <button onclick="selectSong(2)" id="song-btn-2" class="song-card p-3.5 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/10 transition flex items-center justify-between opacity-80">
              <div>
                <div class="font-bold text-base text-cyan-200">3. Rainbow Neon Rush</div>
                <div class="text-xs text-white/70">160 BPM • 스피디한 댄스 트랙</div>
              </div>
              <i class="fa-solid fa-bolt text-cyan-300"></i>
            </button>
          </div>
        </div>

        <!-- 난이도 선택 -->
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-white/70 block text-left px-1">Difficulty</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="selectDifficulty('easy')" id="diff-easy" class="diff-btn py-2.5 rounded-xl font-extrabold text-sm border border-white/30 bg-green-400/30 text-green-200 transition">EASY</button>
            <button onclick="selectDifficulty('normal')" id="diff-normal" class="diff-btn py-2.5 rounded-xl font-extrabold text-sm border border-white/10 bg-white/10 text-white/70 transition">NORMAL</button>
            <button onclick="selectDifficulty('hard')" id="diff-hard" class="diff-btn py-2.5 rounded-xl font-extrabold text-sm border border-white/10 bg-white/10 text-white/70 transition">HARD</button>
          </div>
        </div>
      </div>

      <!-- 게임 시작 버튼 -->
      <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 hover:from-yellow-300 hover:to-purple-400 text-white font-black text-xl shadow-lg shadow-pink-500/30 active:scale-95 transition transform">
        START GAME <i class="fa-solid fa-play ml-2"></i>
      </button>
      
      <!-- 키 설명 -->
      <div class="mt-3 text-xs text-white/60 flex items-center justify-center gap-2">
        <span>조작키:</span>
        <span class="px-2 py-0.5 rounded bg-white/20 font-mono text-white">A</span>
        <span class="px-2 py-0.5 rounded bg-white/20 font-mono text-white">S</span>
        <span class="px-2 py-0.5 rounded bg-white/20 font-mono text-white">D</span>
        <span class="px-2 py-0.5 rounded bg-white/20 font-mono text-white">F</span>
        <span>(화면 터치 가능)</span>
      </div>
    </div>

    <!-- 2. 실제 리듬게임 플레이 화면 -->
    <div id="game-screen" class="hidden flex-1 flex flex-col justify-between relative overflow-hidden">
      <!-- 상단 점수 헤더 -->
      <div class="flex justify-between items-center px-2 py-1 z-20">
        <div>
          <div class="text-xs uppercase tracking-wider text-white/70">SCORE</div>
          <div id="score-display" class="text-3xl font-black text-yellow-300 tracking-tight">000000</div>
        </div>
        <div class="text-center">
          <div class="text-xs uppercase tracking-wider text-white/70">ACCURACY</div>
          <div id="acc-display" class="text-lg font-bold text-cyan-200">100%</div>
        </div>
        <!-- 멈추기 버튼 -->
        <button onclick="pauseGame()" title="일시정지" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 text-white transition active:scale-95 shadow-md border border-white/20">
          <i class="fa-solid fa-pause"></i>
        </button>
      </div>

      <!-- 멈춤(일시정지) 팝업 모달 -->
      <div id="pause-modal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-md z-30 flex flex-col items-center justify-center p-6 text-center animate-fade-in">
        <div class="bg-white/10 border border-white/20 p-6 rounded-3xl w-full max-w-xs space-y-4 shadow-2xl">
          <div class="w-16 h-16 mx-auto rounded-full bg-yellow-400/20 border border-yellow-300/40 flex items-center justify-center text-yellow-300 text-2xl">
            <i class="fa-solid fa-pause"></i>
          </div>
          <h3 class="text-2xl font-black text-white">PAUSED</h3>
          <p class="text-xs text-white/70">잠시 멈춤 상태입니다</p>
          <div class="space-y-2 pt-2">
            <button onclick="pauseGame()" class="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-pink-500 hover:brightness-110 text-white font-extrabold text-base shadow-md transition">
              CONTINUE <i class="fa-solid fa-play ml-1"></i>
            </button>
            <button onclick="restartGame()" class="w-full py-2.5 rounded-xl bg-white/20 hover:bg-white/30 border border-white/20 text-white font-bold text-sm transition">
              RETRY <i class="fa-solid fa-rotate-right ml-1"></i>
            </button>
            <button onclick="showStartScreen()" class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 text-white/80 font-bold text-sm transition">
              MAIN MENU
            </button>
          </div>
        </div>
      </div>

      <!-- 콤보 & 판정 이펙트 표시 영역 -->
      <div class="absolute top-24 left-0 right-0 z-20 flex flex-col items-center pointer-events-none">
        <div id="judge-display" class="text-2xl font-black tracking-widest h-8"></div>
        <div id="combo-display" class="text-4xl font-black text-white drop-shadow-md h-10 opacity-0 transform transition-all duration-75">
          0 <span class="text-sm font-bold text-yellow-300">COMBO</span>
        </div>
      </div>

      <!-- 3D 노드가 내려오는 필드 -->
      <div class="game-stage flex-1 relative w-full h-full flex justify-center items-center overflow-hidden">
        <div class="track-container w-full h-[120%] relative flex justify-center border-x-2 border-white/20 bg-gradient-to-b from-purple-900/40 via-indigo-900/60 to-pink-900/80">
          
          <!-- 4개 트랙 레인 분리선 -->
          <div class="w-1/4 h-full border-r border-white/10 relative" id="lane-0"></div>
          <div class="w-1/4 h-full border-r border-white/10 relative" id="lane-1"></div>
          <div class="w-1/4 h-full border-r border-white/10 relative" id="lane-2"></div>
          <div class="w-1/4 h-full relative" id="lane-3"></div>

          <!-- 노트 판정선 (Hit-Line) -->
          <div class="hit-line absolute bottom-[15%] left-0 right-0 h-4 bg-white/80 rounded-full border-2 border-pink-300 pointer-events-none z-10"></div>
        </div>
      </div>

      <!-- 하단 패드 (키 누름 버튼 / 터치 영역) -->
      <div class="grid grid-cols-4 gap-2 py-2 px-1 z-20 relative bg-black/20 backdrop-blur-md rounded-2xl border border-white/10">
        <button id="key-btn-0" class="key-btn h-16 rounded-xl bg-gradient-to-b from-red-400 to-red-500 text-white font-extrabold text-xl shadow-md border-b-4 border-red-700 flex flex-col items-center justify-center transition-all duration-75 active:brightness-125">
          <span>A</span>
          <span class="text-[10px] font-normal opacity-70">RED</span>
        </button>
        <button id="key-btn-1" class="key-btn h-16 rounded-xl bg-gradient-to-b from-yellow-400 to-yellow-500 text-white font-extrabold text-xl shadow-md border-b-4 border-yellow-700 flex flex-col items-center justify-center transition-all duration-75 active:brightness-125">
          <span>S</span>
          <span class="text-[10px] font-normal opacity-70">YELLOW</span>
        </button>
        <button id="key-btn-2" class="key-btn h-16 rounded-xl bg-gradient-to-b from-green-400 to-green-500 text-white font-extrabold text-xl shadow-md border-b-4 border-green-700 flex flex-col items-center justify-center transition-all duration-75 active:brightness-125">
          <span>D</span>
          <span class="text-[10px] font-normal opacity-70">GREEN</span>
        </button>
        <button id="key-btn-3" class="key-btn h-16 rounded-xl bg-gradient-to-b from-cyan-400 to-cyan-500 text-white font-extrabold text-xl shadow-md border-b-4 border-cyan-700 flex flex-col items-center justify-center transition-all duration-75 active:brightness-125">
          <span>F</span>
          <span class="text-[10px] font-normal opacity-70">BLUE</span>
        </button>
      </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden flex-1 flex flex-col justify-between items-center py-8 px-4 text-center">
      <div class="space-y-2 mt-4">
        <h2 id="result-rank" class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-purple-400 drop-shadow-lg">S</h2>
        <p id="result-title" class="text-xl font-bold text-white">STAGE CLEAR!</p>
      </div>

      <!-- 통계 카드 -->
      <div class="w-full bg-white/10 border border-white/20 backdrop-blur-md rounded-2xl p-4 space-y-3">
        <div class="flex justify-between items-center text-sm border-b border-white/10 pb-2">
          <span class="text-white/70">Final Score</span>
          <span id="res-score" class="text-2xl font-black text-yellow-300">0</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-white/70">Max Combo</span>
          <span id="res-maxcombo" class="font-bold text-white">0</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-white/70">Accuracy</span>
          <span id="res-accuracy" class="font-bold text-cyan-200">100%</span>
        </div>
        <div class="grid grid-cols-4 gap-1 pt-2 text-center text-xs font-bold">
          <div class="bg-blue-500/20 rounded-lg p-1.5 text-blue-300 border border-blue-500/30">
            <div>PERFECT</div>
            <div id="res-perfect" class="text-sm">0</div>
          </div>
          <div class="bg-green-500/20 rounded-lg p-1.5 text-green-300 border border-green-500/30">
            <div>GREAT</div>
            <div id="res-great" class="text-sm">0</div>
          </div>
          <div class="bg-yellow-500/20 rounded-lg p-1.5 text-yellow-300 border border-yellow-500/30">
            <div>GOOD</div>
            <div id="res-good" class="text-sm">0</div>
          </div>
          <div class="bg-red-500/20 rounded-lg p-1.5 text-red-300 border border-red-500/30">
            <div>MISS</div>
            <div id="res-miss" class="text-sm">0</div>
          </div>
        </div>
      </div>

      <!-- 재시작/메인 메뉴 버튼 -->
      <div class="w-full space-y-2">
        <button onclick="restartGame()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-yellow-400 to-pink-500 hover:brightness-110 text-white font-extrabold text-lg shadow-md transition">
          RETRY <i class="fa-solid fa-rotate-right ml-1"></i>
        </button>
        <button onclick="showStartScreen()" class="w-full py-3 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold text-sm transition">
          MAIN MENU
        </button>
      </div>
    </div>

  </div>

  <!-- JavaScript logic -->
  <script>
    /* ===================================================================
       1. 데이터 및 게임 상태 관리
       =================================================================== */
    const KEYS = ['KeyA', 'KeyS', 'KeyD', 'KeyF'];
    const LANE_COLORS = [
      { bg: 'from-red-400 to-pink-500', glow: '#f43f5e' },
      { bg: 'from-yellow-300 to-amber-500', glow: '#eab308' },
      { bg: 'from-green-400 to-emerald-500', glow: '#10b981' },
      { bg: 'from-cyan-400 to-blue-500', glow: '#06b6d4' }
    ];

    // 선택 가능한 곡 목록 데이터
    const SONGS = [
      {
        title: "Sunshine Pop Party",
        bpm: 128,
        synthFreq: [261.63, 329.63, 392.00, 523.25], // C4, E4, G4, C5
        patternSeed: [0, 1, 2, 3, 1, 2, 0, 3, 2, 1, 0, 3]
      },
      {
        title: "Sparkle Bubble Beat",
        bpm: 140,
        synthFreq: [293.66, 349.23, 440.00, 587.33], // D4, F4, A4, D5
        patternSeed: [0, 2, 1, 3, 0, 1, 2, 3, 3, 1, 2, 0]
      },
      {
        title: "Rainbow Neon Rush",
        bpm: 160,
        synthFreq: [329.63, 392.00, 493.88, 659.25], // E4, G4, B4, E5
        patternSeed: [0, 3, 1, 2, 0, 2, 1, 3, 2, 0, 3, 1]
      }
    ];

    let currentSongIndex = 0;
    let currentDiff = 'easy'; // 'easy', 'normal', 'hard'

    // 게임 내부 변수
    let isPlaying = false;
    let isPaused = false;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let totalHitCount = 0;
    let notes = []; // 현재 화면에 보이는 노트들
    let noteIdCounter = 0;
    let gameStartTime = 0;
    let songDuration = 35; // 35초 길이 트랙
    let animationFrameId = null;
    let audioCtx = null;
    let bgmInterval = null;

    // 판정 통계
    let judgeStats = { perfect: 0, great: 0, good: 0, miss: 0 };

    /* ===================================================================
       2. Web Audio API (사운드 합성 엔진)
       =================================================================== */
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 효과음 - 노트 타격음
    function playHitSound(laneIndex, quality) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const baseFreq = SONGS[currentSongIndex].synthFreq[laneIndex] || 440;

        osc.type = quality === 'PERFECT' ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(baseFreq * (quality === 'PERFECT' ? 1.2 : 1.0), audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error("Audio Playback Error", e);
      }
    }

    // 신나는 브금 루프 생성기
    function startBGM() {
      initAudio();
      const song = SONGS[currentSongIndex];
      const intervalMs = (60 / song.bpm) * 1000 / 2; // 8비트 간격
      let step = 0;

      bgmInterval = setInterval(() => {
        if (!isPlaying || isPaused) return;

        // 드럼 킥 (매 4박자)
        if (step % 4 === 0) {
          playKick();
        }
        // 스네어 / 클랩 (매 2, 4번째)
        if (step % 4 === 2) {
          playSnare();
        }
        // 메인 Synth Melodic 노트
        if (step % 2 === 0) {
          const noteFreq = song.synthFreq[(step / 2) % song.synthFreq.length];
          playSynthNote(noteFreq);
        }

        step++;
      }, intervalMs);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function playKick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playSnare() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playSynthNote(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    /* ===================================================================
       3. 메뉴 선택 및 화면 전환
       =================================================================== */
    function selectSong(index) {
      currentSongIndex = index;
      [0, 1, 2].forEach(i => {
        const btn = document.getElementById(`song-btn-${i}`);
        if (i === index) {
          btn.classList.remove('bg-white/10', 'opacity-80');
          btn.classList.add('bg-white/30', 'border-white/40', 'shadow-md');
        } else {
          btn.classList.remove('bg-white/30', 'border-white/40', 'shadow-md');
          btn.classList.add('bg-white/10', 'opacity-80');
        }
      });
    }

    function selectDifficulty(diff) {
      currentDiff = diff;
      ['easy', 'normal', 'hard'].forEach(d => {
        const btn = document.getElementById(`diff-${d}`);
        if (d === diff) {
          btn.className = `diff-btn py-2.5 rounded-xl font-extrabold text-sm border border-white/30 transition ${
            d === 'easy' ? 'bg-green-400/40 text-green-200' : d === 'normal' ? 'bg-yellow-400/40 text-yellow-200' : 'bg-red-400/40 text-red-200'
          }`;
        } else {
          btn.className = 'diff-btn py-2.5 rounded-xl font-extrabold text-sm border border-white/10 bg-white/10 text-white/70 transition';
        }
      });
    }

    function showStartScreen() {
      stopBGM();
      isPlaying = false;
      document.getElementById('start-screen').classList.remove('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
    }

    /* ===================================================================
       4. 게임 루프 & 패턴 생성
       =================================================================== */
    function startGame() {
      initAudio();
      
      // 상태 초기화
      score = 0;
      combo = 0;
      maxCombo = 0;
      totalHitCount = 0;
      notes = [];
      judgeStats = { perfect: 0, great: 0, good: 0, miss: 0 };
      
      updateUI();

      // 기존 화면에 남아있는 노트 DOM 제거
      [0, 1, 2, 3].forEach(i => {
        document.getElementById(`lane-${i}`).innerHTML = '';
      });

      // 화면 전환
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      // 게임 생성 및 타이머 시작
      generateChart();
      gameStartTime = performance.now();
      isPlaying = true;
      isPaused = false;

      startBGM();
      requestAnimationFrame(gameLoop);
    }

    // 선택된 난이도 및 곡에 맞춘 악보(Note Chart) 데이터 생성
    function generateChart() {
      const song = SONGS[currentSongIndex];
      const bpm = song.bpm;
      const beatInterval = 60 / bpm; // 초 단위 1박자
      
      let speedFactor = 0.5; // easy
      if (currentDiff === 'normal') speedFactor = 0.35;
      if (currentDiff === 'hard') speedFactor = 0.25;

      const totalBeats = Math.floor(songDuration / beatInterval);
      const pattern = song.patternSeed;

      for (let beat = 2; beat < totalBeats; beat++) {
        // 난이도별 노트 출현 확률 및 밀도
        let spawnChance = 0.6;
        if (currentDiff === 'normal') spawnChance = 0.8;
        if (currentDiff === 'hard') spawnChance = 0.95;

        if (Math.random() < spawnChance) {
          const lane = pattern[beat % pattern.length];
          const targetTime = beat * beatInterval * 1000; // 밀리초

          notes.push({
            id: noteIdCounter++,
            lane: lane,
            targetTime: targetTime,
            hit: false,
            missed: false,
            dom: null
          });
        }

        // Hard 난이도의 경우 동시타(Double Note) 확률 추가
        if (currentDiff === 'hard' && beat % 4 === 0) {
          const extraLane = (pattern[beat % pattern.length] + 2) % 4;
          notes.push({
            id: noteIdCounter++,
            lane: extraLane,
            targetTime: beat * beatInterval * 1000,
            hit: false,
            missed: false,
            dom: null
          });
        }
      }
    }

    // 메인 게임 프레임 루프
    function gameLoop(currentTime) {
      if (!isPlaying || isPaused) return;

      const elapsedTime = currentTime - gameStartTime;

      // 노트 스피드 (높을수록 빠름)
      const noteTravelTime = currentDiff === 'hard' ? 1200 : currentDiff === 'normal' ? 1500 : 1800; // ms

      // 1. 노트 위치 업데이트 및 렌더링
      notes.forEach(note => {
        if (note.hit) return;

        // 타겟 도착 시간까지 남은 시간
        const timeDiff = note.targetTime - elapsedTime;
        
        // 노트가 화면 상단에 등장해야 할 시점
        if (timeDiff <= noteTravelTime && !note.dom && !note.missed) {
          createNoteDOM(note);
        }

        if (note.dom) {
          // 이동 비율 (0: 레인 맨 위, 85: 판정선 위치)
          const progress = 1 - (timeDiff / noteTravelTime);
          const topPercent = progress * 85;

          if (topPercent >= 0 && topPercent <= 100) {
            note.dom.style.top = `${topPercent}%`;
          }

          // 판정선을 지나쳐 흘러 내려간 경우 (MISS 처리)
          if (timeDiff < -180 && !note.missed) {
            note.missed = true;
            processJudge('MISS', note.lane);
            removeNoteDOM(note);
          }
        }
      });

      // 2. 곡 종료 체크
      if (elapsedTime > (songDuration * 1000) + 2000) {
        endGame();
        return;
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // 노트 DOM 생성
    function createNoteDOM(note) {
      const laneElem = document.getElementById(`lane-${note.lane}`);
      const noteEl = document.createElement('div');
      
      const colorInfo = LANE_COLORS[note.lane];
      noteEl.className = `note w-full h-8 bg-gradient-to-r ${colorInfo.bg} border-2 border-white/80 z-20 flex items-center justify-center`;
      noteEl.style.top = '-10%';

      laneElem.appendChild(noteEl);
      note.dom = noteEl;
    }

    function removeNoteDOM(note) {
      if (note.dom && note.dom.parentNode) {
        note.dom.parentNode.removeChild(note.dom);
        note.dom = null;
      }
    }

    /* ===================================================================
       5. 입력 처리 및 판정 로직
       =================================================================== */
    function handleKeyPress(laneIndex) {
      if (!isPlaying || isPaused) return;

      // 키 누름 Visual 피드백
      const btn = document.getElementById(`key-btn-${laneIndex}`);
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 100);

      // 판정선 근처 노트 탐색
      const elapsedTime = performance.now() - gameStartTime;
      const noteTravelTime = currentDiff === 'hard' ? 1200 : currentDiff === 'normal' ? 1500 : 1800;

      // 해당 레인에서 아직 처리되지 않은 가장 가까운 노트 찾기
      const targetNote = notes.find(n => n.lane === laneIndex && !n.hit && !n.missed && n.dom);

      if (targetNote) {
        const timeDiff = Math.abs(targetNote.targetTime - elapsedTime);

        // 판정 기준 시간 (ms)
        if (timeDiff <= 50) {
          targetNote.hit = true;
          processJudge('PERFECT', laneIndex);
          createHitParticles(laneIndex, '#fef08a');
          removeNoteDOM(targetNote);
        } else if (timeDiff <= 100) {
          targetNote.hit = true;
          processJudge('GREAT', laneIndex);
          createHitParticles(laneIndex, '#4ade80');
          removeNoteDOM(targetNote);
        } else if (timeDiff <= 160) {
          targetNote.hit = true;
          processJudge('GOOD', laneIndex);
          removeNoteDOM(targetNote);
        }
      }
    }

    // 판정 처리 및 점수 계산
    function processJudge(quality, laneIndex) {
      playHitSound(laneIndex, quality);
      totalHitCount++;

      const judgeElem = document.getElementById('judge-display');
      const comboElem = document.getElementById('combo-display');

      let judgeColor = 'text-white';
      let scoreAdd = 0;

      switch (quality) {
        case 'PERFECT':
          judgeColor = 'text-yellow-300 drop-shadow-[0_0_10px_rgba(253,224,71,0.8)]';
          scoreAdd = 1000;
          combo++;
          judgeStats.perfect++;
          break;
        case 'GREAT':
          judgeColor = 'text-green-300 drop-shadow-[0_0_10px_rgba(74,222,128,0.8)]';
          scoreAdd = 700;
          combo++;
          judgeStats.great++;
          break;
        case 'GOOD':
          judgeColor = 'text-blue-300';
          scoreAdd = 400;
          combo++;
          judgeStats.good++;
          break;
        case 'MISS':
          judgeColor = 'text-red-400 font-bold';
          combo = 0;
          judgeStats.miss++;
          break;
      }

      // 콤보 보너스 반영
      score += scoreAdd + Math.floor(combo * 10);
      if (combo > maxCombo) maxCombo = combo;

      // UI 텍스트 업데이트 및 애니메이션
      judgeElem.className = `text-2xl font-black tracking-widest judge-pop ${judgeColor}`;
      judgeElem.innerText = quality;

      if (combo > 1) {
        comboElem.innerHTML = `${combo} <span class="text-xs font-bold text-yellow-300">COMBO</span>`;
        comboElem.classList.remove('opacity-0', 'scale-90');
        comboElem.classList.add('opacity-100', 'scale-110');
        setTimeout(() => comboElem.classList.remove('scale-110'), 50);
      } else {
        comboElem.classList.add('opacity-0');
      }

      updateUI();
    }

    function updateUI() {
      document.getElementById('score-display').innerText = String(score).padStart(6, '0');
      
      const totalNotesProcessed = judgeStats.perfect + judgeStats.great + judgeStats.good + judgeStats.miss;
      let acc = 100;
      if (totalNotesProcessed > 0) {
        const weightedScore = (judgeStats.perfect * 100) + (judgeStats.great * 80) + (judgeStats.good * 50);
        acc = (weightedScore / (totalNotesProcessed * 100)) * 100;
      }
      document.getElementById('acc-display').innerText = `${acc.toFixed(1)}%`;
    }

    // 판정 시 터지는 이펙트 파티클
    function createHitParticles(laneIndex, colorHex) {
      const laneElem = document.getElementById(`lane-${laneIndex}`);
      const particleCount = 12;

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.backgroundColor = colorHex;
        
        const size = Math.random() * 8 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        
        // 판정선 위치 근처
        p.style.left = '50%';
        p.style.top = '85%';

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 80 + 20;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed;

        p.style.setProperty('--dx', `${dx}px`);
        p.style.setProperty('--dy', `${dy}px`);

        laneElem.appendChild(p);
        setTimeout(() => p.remove(), 500);
      }
    }

    /* ===================================================================
       6. 게임 일시정지 및 결과 창 처리
       =================================================================== */
    function pauseGame() {
      if (!isPlaying) return;
      isPaused = !isPaused;
      
      const pauseModal = document.getElementById('pause-modal');
      
      if (isPaused) {
        stopBGM();
        if (pauseModal) pauseModal.classList.remove('hidden');
      } else {
        if (pauseModal) pauseModal.classList.add('hidden');
        startBGM();
        requestAnimationFrame(gameLoop);
      }
    }

    function endGame() {
      isPlaying = false;
      stopBGM();

      // 결과 화면 텍스트 할당
      document.getElementById('res-score').innerText = score.toLocaleString();
      document.getElementById('res-maxcombo').innerText = maxCombo;
      document.getElementById('res-perfect').innerText = judgeStats.perfect;
      document.getElementById('res-great').innerText = judgeStats.great;
      document.getElementById('res-good').innerText = judgeStats.good;
      document.getElementById('res-miss').innerText = judgeStats.miss;

      const totalProcessed = judgeStats.perfect + judgeStats.great + judgeStats.good + judgeStats.miss;
      let acc = 100;
      if (totalProcessed > 0) {
        const weightedScore = (judgeStats.perfect * 100) + (judgeStats.great * 80) + (judgeStats.good * 50);
        acc = (weightedScore / (totalProcessed * 100)) * 100;
      }
      document.getElementById('res-accuracy').innerText = `${acc.toFixed(1)}%`;

      // 랭크 계산
      let rank = 'F';
      if (acc >= 95) rank = 'S';
      else if (acc >= 85) rank = 'A';
      else if (acc >= 75) rank = 'B';
      else if (acc >= 60) rank = 'C';

      document.getElementById('result-rank').innerText = rank;

      // 화면 전환
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
    }

    function restartGame() {
      startGame();
    }

    /* ===================================================================
       7. 이벤트 리스너 (키보드 & 터치 입력 등록)
       =================================================================== */
    window.addEventListener('keydown', (e) => {
      const index = KEYS.indexOf(e.code);
      if (index !== -1 && !e.repeat) {
        handleKeyPress(index);
      }
    });

    // 화면 패드 터치 및 마우스 클릭 바인딩
    [0, 1, 2, 3].forEach(i => {
      const btn = document.getElementById(`key-btn-${i}`);
      
      const triggerAction = (e) => {
        e.preventDefault();
        handleKeyPress(i);
      };

      btn.addEventListener('touchstart', triggerAction, { passive: false });
      btn.addEventListener('mousedown', triggerAction);
    });

    // 초기 곡/난이도 설정
    selectSong(0);
    selectDifficulty('easy');
  </script>
</body>
</html>
