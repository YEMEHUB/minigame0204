    <script>
        // --- Web Audio API Synth Sound Generator ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.bgmTimer = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                return this.isMuted;
            }

            // Jump Sound Effect
            playJump() {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            // Crash Sound Effect
            playCrash() {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            // Synthesized BGM Loop (Retro synthwave arpeggio)
            startBGM() {
                if (this.bgmTimer || !this.ctx) return;
                
                const notes = [130.81, 146.83, 164.81, 196.00, 220.00, 196.00, 164.81, 146.83]; // C3, D3, E3, G3, A3...
                let noteIndex = 0;

                this.bgmTimer = setInterval(() => {
                    if (this.isMuted || !this.ctx) return;
                    
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(notes[noteIndex], this.ctx.currentTime);
                    
                    // Lowpass filter for synthwave effect
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                    
                    noteIndex = (noteIndex + 1) % notes.length;
                }, 130); // BPM tempo
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }

        // --- Character UI Setup ---
        function setupCharacterSelector() {
            const container = document.getElementById('character-selector');
            container.innerHTML = '';

            CHARACTERS.forEach((char, idx) => {
                const card = document.createElement('div');
                card.className = `character-card p-3 rounded-xl border border-slate-700 bg-slate-900/80 flex flex-col items-center gap-1.5 text-center ${idx === selectedCharIndex ? 'selected' : ''}`;

                container.appendChild(card);

        function selectCharacter(index) {
            selectedCharIndex = index;
            const cards = document.querySelectorAll('.character-card');
            cards.forEach((card, idx) => {
                if (idx === index) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
            updateCharInfo();
            createPlayer(); // Re-create player preview
        }

            const currentChar = CHARACTERS[selectedCharIndex];
            document.getElementById('char-desc-type').innerText = currentChar.desc;
            document.getElementById('char-perk').innerText = currentChar.perkText;
            document.getElementById('active-char-badge').innerHTML = `<i class="fas ${currentChar.icon} mr-2" style="color: ${currentChar.accentColor}"></i> ${currentChar.name}`;
        }

        // --- Initialization ---
        function initThree() {
            const container = document.getElementById('game-canvas');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.018);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 9);
            camera.lookAt(0, 1.5, -5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff007f, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x00f0ff, 1.5, 30);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // Environment: Infinite Road Grid
            createRoad();

            // Player Creation
            createPlayer();

            // Handle Resize
            window.addEventListener('resize', onWindowResize);
        }

        // Road & Cyber Grid
        function createRoad() {
            const roadGeo = new THREE.PlaneGeometry(12, 300);
            const roadMat = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a16, 
                roughness: 0.2, 
                metalness: 0.8 
            });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            scene.add(road);

            // Side Glowing Rails
            const railGeo = new THREE.BoxGeometry(0.3, 0.3, 300);
            const railMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
            
            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-6, 0.15, -100);
            scene.add(leftRail);

            const rightRail = new THREE.Mesh(railGeo, railMat);
            rightRail.position.set(6, 0.15, -100);
            scene.add(rightRail);

            // Grid Lines texture simulation
            roadGrid = new THREE.GridHelper(300, 60, 0xff0055, 0x1a1a3a);
            roadGrid.position.set(0, 0.01, -100);
            scene.add(roadGrid);
        }

        // Distinct Player Models based on selected Character
        function createPlayer() {
            if (player) {
                scene.remove(player);
            }

            player = new THREE.Group();
            const char = CHARACTERS[selectedCharIndex];

            if (char.id === 'neon-runner') {
                // Sleek jet shape
                const bodyGeo = new THREE.ConeGeometry(0.7, 2, 4);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: char.color, roughness: 0.1, metalness: 0.9, emissive: char.emissive 
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.x = Math.PI / 2;
                body.rotation.z = Math.PI;
                player.add(body);

                const wingGeo = new THREE.BoxGeometry(1.8, 0.1, 0.8);
                const wingMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const wings = new THREE.Mesh(wingGeo, wingMat);
                wings.position.set(0, 0, 0.2);
                player.add(wings);

            } else if (char.id === 'speed-phantom') {
                // Sharp Needle shape
                const bodyGeo = new THREE.ConeGeometry(0.4, 2.6, 3);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: char.color, roughness: 0.1, metalness: 0.9, emissive: char.emissive 
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.x = Math.PI / 2;
                player.add(body);

                const ringGeo = new THREE.TorusGeometry(0.8, 0.05, 8, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(0, 0, 0.3);
                player.add(ring);

                // UFO / Disk like shape
                const discGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.3, 8);
                const discMat = new THREE.MeshStandardMaterial({ 
                    color: char.color, roughness: 0.2, metalness: 0.8, emissive: char.emissive 
                });
                const disc = new THREE.Mesh(discGeo, discMat);
                player.add(disc);

                const topGeo = new THREE.SphereGeometry(0.5, 8, 8);
                const topMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const topDome = new THREE.Mesh(topGeo, topMat);
                topDome.position.set(0, 0.2, 0);
                player.add(topDome);

            } else if (char.id === 'heavy-titan') {
                // Bulky Blocky Mecha shape
                const coreGeo = new THREE.BoxGeometry(1.4, 0.8, 1.8);
                const coreMat = new THREE.MeshStandardMaterial({ 
                    color: char.color, roughness: 0.3, metalness: 0.7, emissive: char.emissive 
                });
                const core = new THREE.Mesh(coreGeo, coreMat);
                player.add(core);

                const sideGeo = new THREE.BoxGeometry(0.4, 0.9, 2.2);
                const sideMat = new THREE.MeshStandardMaterial({ color: 0x333344 });
                const leftSide = new THREE.Mesh(sideGeo, sideMat);
                leftSide.position.set(-0.9, 0, 0);
                const rightSide = leftSide.clone();
                rightSide.position.set(0.9, 0, 0);
                player.add(leftSide);
                player.add(rightSide);

            } else if (char.id === 'quantum-glider') {
                // Tri-wing glider shape
                const bodyGeo = new THREE.ConeGeometry(0.6, 2.2, 3);
                const bodyMat = new THREE.MeshStandardMaterial({ color: char.color, emissive: char.emissive, roughness: 0.2 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.x = Math.PI / 2;
                player.add(body);

                const ringGeo = new THREE.TorusGeometry(0.9, 0.04, 8, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(0, 0, -0.2);
                player.add(ring);

            } else if (char.id === 'solar-phoenix') {
                // Diamond Arrow Fighter
                const bodyGeo = new THREE.OctahedronGeometry(0.9);
                const bodyMat = new THREE.MeshStandardMaterial({ color: char.color, emissive: char.emissive, metalness: 0.8 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.scale.set(0.7, 0.4, 1.8);
                player.add(body);

                const flameGeo = new THREE.ConeGeometry(0.3, 1.2, 4);
                const flameMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.rotation.x = -Math.PI / 2;
                flame.position.set(0, 0, 1.2);
                player.add(flame);

            } else if (char.id === 'cyber-plasma') {
                // Spherical Orb Carrier
                const orbGeo = new THREE.SphereGeometry(0.8, 16, 16);
                const orbMat = new THREE.MeshStandardMaterial({ color: char.color, emissive: char.emissive, roughness: 0.1 });
                const orb = new THREE.Mesh(orbGeo, orbMat);
                player.add(orb);

                const ringGeo = new THREE.TorusGeometry(1.2, 0.08, 8, 24);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 3;
                player.add(ring);

            } else if (char.id === 'vortex-striker') {
                // Twin-engine Jet
                const bodyGeo = new THREE.BoxGeometry(0.6, 0.5, 2.0);
                const bodyMat = new THREE.MeshStandardMaterial({ color: char.color, emissive: char.emissive });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                player.add(body);

                const engGeo = new THREE.CylinderGeometry(0.25, 0.25, 1.8, 8);
                const engMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9 });
                const leftEng = new THREE.Mesh(engGeo, engMat);
                leftEng.rotation.x = Math.PI / 2;
                leftEng.position.set(-0.6, 0, 0);
                const rightEng = leftEng.clone();
                rightEng.position.set(0.6, 0, 0);
                player.add(leftEng);
                player.add(rightEng);
            }

            // Thruster Light
            const light = new THREE.PointLight(char.color, 2, 5);
            light.position.set(0, 0, 1);
            player.add(light);

            player.position.set(playerPos.x, playerPos.y || 0.8, playerPos.z);
            scene.add(player);

            // Bounding Box for Collision
            playerBox = new THREE.Box3();
        }

        // --- Expanded Obstacle Spawner (New Obstacle Types Added) ---
        // Types:
        // 1. 'LONG_WALL': Wide and low wall (Must Jump OVER)
        // 2. 'HIGH_WALL': Tall narrow pillar (Must Dodge Left/Right)
        // 3. 'HIGH_GATE': Suspended Overhead Gate (Must stay low / Cannot jump into)
        // 4. 'MOVING_BLOCK': Block moving horizontally back and forth
        // 5. 'LASER_GRID': High-contrast neon double barrier
        // 6. 'PYRAMID_BLOCK': Sharp geometric spike block
        function spawnObstacle(zPos) {
            const typeRandom = Math.random();
            let obstacle, type;

            if (typeRandom < 0.22) {
                // TYPE 1: LONG LOW WALL (Spans horizontally - Requires JUMP)
                type = 'LONG_WALL';
                const geo = new THREE.BoxGeometry(10.5, 1.2, 0.8);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0xff0055, 
                    emissive: 0x660022, 
                    roughness: 0.3 
                });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.position.set(0, 0.6, zPos);

                // Top Glowing Neon Trim
                const edgeGeo = new THREE.BoxGeometry(10.6, 0.12, 0.9);
                const edgeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const edge = new THREE.Mesh(edgeGeo, edgeMat);
                edge.position.set(0, 0.6, 0);
                obstacle.add(edge);

            } else if (typeRandom < 0.42) {
                // TYPE 2: TALL NARROW WALL (Dodge Left or Right)
                type = 'HIGH_WALL';
                const geo = new THREE.BoxGeometry(3.4, 6.5, 0.8);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x00f0ff, 
                    emissive: 0x004466, 
                    roughness: 0.2 
                });
                obstacle = new THREE.Mesh(geo, mat);
        // --- Balanced Obstacle Spawner ---
        // Spawn distance interval tuned for fair, moderate difficulty
        const SPAWN_INTERVAL_Z = 28; // Increased gap so players have time to react

        function spawnObstacle(zPos) {
            const typeRandom = Math.random();
            let obstacle, type;

            if (typeRandom < 0.35) {
                // TYPE 1: LONG LOW WALL (Spans horizontally - Requires JUMP)
                type = 'LONG_WALL';
                const geo = new THREE.BoxGeometry(10.5, 1.2, 0.8);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0xff0055, 
                    emissive: 0x660022, 
                    roughness: 0.3 
                });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.position.set(0, 0.6, zPos);

                // Top Glowing Neon Trim
                const edgeGeo = new THREE.BoxGeometry(10.6, 0.12, 0.9);
                const edgeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const edge = new THREE.Mesh(edgeGeo, edgeMat);
                edge.position.set(0, 0.6, 0);
                obstacle.add(edge);

            } else if (typeRandom < 0.65) {
                // TYPE 2: TALL NARROW WALL (Dodge Left or Right)
                type = 'HIGH_WALL';
                const geo = new THREE.BoxGeometry(3.2, 6.5, 0.8);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x00f0ff, 
                    emissive: 0x004466, 
                    roughness: 0.2 
                });
                obstacle = new THREE.Mesh(geo, mat);
                
                const lanes = [-LANE_WIDTH, 0, LANE_WIDTH];
                const xPos = lanes[Math.floor(Math.random() * lanes.length)];
                obstacle.position.set(xPos, 3.25, zPos);

            } else if (typeRandom < 0.82) {
                // TYPE 3: HIGH OVERHEAD GATE (Do NOT Jump / Stay Grounded)
                type = 'HIGH_GATE';
                const geo = new THREE.BoxGeometry(11, 3.5, 0.8);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0xffaa00, 
                    emissive: 0x664400, 
                    roughness: 0.3 
                });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.position.set(0, 3.8, zPos);

                const stripeGeo = new THREE.BoxGeometry(11.1, 0.15, 0.9);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.position.set(0, -1.6, 0);
                obstacle.add(stripe);

            } else {
                // TYPE 4: HORIZONTALLY MOVING BLOCK (Predictable moderate speed)
                type = 'MOVING_BLOCK';
                const geo = new THREE.BoxGeometry(3.0, 2.2, 1.2);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0xaa00ff, 
                    emissive: 0x440066 
                });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.position.set(0, 1.1, zPos);
                obstacle.userData.moveDirection = Math.random() > 0.5 ? 1 : -1;
                obstacle.userData.moveSpeed = 0.05; // Moderate movement speed
            }

            obstacle.userData = Object.assign(obstacle.userData || {}, { type: type, box: new THREE.Box3() });
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        // Spawns explosion particles on collision
        function createExplosion(pos) {
            for (let i = 0; i < 30; i++) {
                const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const pMat = new THREE.MeshBasicMaterial({ 
                    color: Math.random() > 0.5 ? 0xff0055 : 0x00f0ff 
                });
                const particle = new THREE.Mesh(pGeo, pMat);
                particle.position.copy(pos);
                
                particle.userData = {
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.5) * 0.8 + 0.3,
                        (Math.random() - 0.5) * 0.8
                    )
                };
                
                scene.add(particle);
                particles.push(particle);
            }
        }

        // --- Controls Handlers ---
        function setupControls() {
            setupCharacterSelector();

            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (gameState !== 'PLAYING') return;
                const code = e.code;
                if (code === 'KeyA' || code === 'ArrowLeft') keys.a = true;
                if (code === 'KeyD' || code === 'ArrowRight') keys.d = true;
                if (code === 'Space') {
                    e.preventDefault();
                    triggerJump();
                }
            });

            window.addEventListener('keyup', (e) => {
                const code = e.code;
                if (code === 'KeyA' || code === 'ArrowLeft') keys.a = false;
                if (code === 'KeyD' || code === 'ArrowRight') keys.d = false;
            });

            // Touch UI Buttons
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnJump = document.getElementById('btn-jump');

            const bindTouch = (elem, keyName) => {
                elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            };

            bindTouch(btnLeft, 'left');
            bindTouch(btnRight, 'right');
            
            btnJump.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameState === 'PLAYING') triggerJump();
            });

            // UI Buttons
            document.getElementById('start-btn').addEventListener('click', startGame);
            
            document.getElementById('audio-toggle-btn').addEventListener('click', () => {
                const muted = audio.toggleMute();
                document.getElementById('audio-icon').className = muted ? 'fas fa-volume-mute text-red-400' : 'fas fa-volume-up text-cyan-400';
            });
        }

        function triggerJump() {
            if (isGrounded) {
                playerVelY = currentJumpForce;
                isGrounded = false;
                audio.playJump();
            }
        }

        // --- Game Loop & Logic ---
        function startGame() {
            audio.init();
            audio.startBGM();

            // Clear Existing Obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            particles.forEach(p => scene.remove(p));
            particles = [];

            // Apply selected character stats
            const char = CHARACTERS[selectedCharIndex];
            speed = 0.85 * char.speedMultiplier; 
            currentJumpForce = char.jumpForce;

            // Reset Stats
            score = 0;
            playerPos = { x: 0, y: 0.8, z: 0 };
            playerVelY = 0;
            isGrounded = true;
            lastSpawnZ = -30;

            // Re-create player model for selected character
            createPlayer();

            // Pre-spawn initial obstacles ahead
            for (let z = -40; z > -150; z -= SPAWN_INTERVAL_Z) {
                spawnObstacle(z);
                lastSpawnZ = z;
            }

            // Update UI
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');

            gameState = 'PLAYING';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            audio.stopBGM();
            audio.playCrash();

            createExplosion(player.position);

            // Update Overlay UI
            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('game-over-info').classList.remove('hidden');
            document.getElementById('start-btn').innerText = '다시 시도 (RETRY)';
            document.getElementById('menu-overlay').classList.remove('hidden');
            document.getElementById('controls-hint').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
        }

        function update() {
            if (gameState === 'PLAYING') {
                const char = CHARACTERS[selectedCharIndex];
                
                // 1. Score & Speed Progression
                score += speed * 0.5 * char.scoreMultiplier;
                document.getElementById('score-text').innerText = Math.floor(score);
                
                // Hard mode gets progressively faster up to maxSpeed
                if (speed < maxSpeed * char.speedMultiplier) speed += 0.0003;

                // 2. Horizontal Movement Logic (A/D or Touch)
                const moveSpeed = 0.22;
                if ((keys.a || keys.left) && playerPos.x > -MAX_X) {
                    playerPos.x -= moveSpeed;
                }
                if ((keys.d || keys.right) && playerPos.x < MAX_X) {
                    playerPos.x += moveSpeed;
                }

                // Smooth Bank/Tilt Angle when turning
                const targetTilt = (keys.a || keys.left) ? 0.4 : ((keys.d || keys.right) ? -0.4 : 0);
                player.rotation.z += (targetTilt - player.rotation.z) * 0.15;

                // 3. Jump Physics
                playerPos.y += playerVelY;
                playerVelY += GRAVITY;

                if (playerPos.y <= 0.8) {
                    playerPos.y = 0.8;
                    playerVelY = 0;
                    isGrounded = true;
                }

                // Update Player Model Position
                player.position.set(playerPos.x, playerPos.y, playerPos.z);
                
                // Update Player Collision Box (Slightly smaller than mesh for forgiving gameplay)
                playerBox.setFromObject(player);
                playerBox.expandByScalar(-0.15); 

                // 4. Move Road Grid to give illusion of speed
                roadGrid.position.z += speed;
                if (roadGrid.position.z > 5) roadGrid.position.z = 0;

                // 5. Update & Spawn Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += speed;

                    // Moving obstacle special logic
                    if (obs.userData.type === 'MOVING_BLOCK') {
                        obs.position.x += obs.userData.moveDirection * obs.userData.moveSpeed;
                        if (obs.position.x > MAX_X) {
                            obs.position.x = MAX_X;
                            obs.userData.moveDirection = -1;
                        } else if (obs.position.x < -MAX_X) {
                            obs.position.x = -MAX_X;
                            obs.userData.moveDirection = 1;
                        }
                    }

                    // Collision Detection
                    obs.userData.box.setFromObject(obs);
                    if (playerBox.intersectsBox(obs.userData.box)) {
                        gameOver();
                        return;
                    }

                    // Remove off-screen obstacles
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Spawn New Obstacles ahead (Fair progression rate)
                const currentSpawnInterval = Math.max(20, SPAWN_INTERVAL_Z - Math.floor(score / 600));
                if (lastSpawnZ + speed > -160) {
                    lastSpawnZ -= currentSpawnInterval;
                    spawnObstacle(lastSpawnZ);
                }
            }

            // Update Explosion Particle FX
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.scale.multiplyScalar(0.95); // shrink
                if (p.scale.x < 0.01) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function render() {
            requestAnimationFrame(render);
            update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Start Application ---
        window.onload = () => {
            initThree();
            setupControls();
            render();
        };
    </script>
</body>
</html>
