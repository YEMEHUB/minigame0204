<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>야식대장 (치킨&피자 게임)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
        }

        /* Glassmorphic UI Containers */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.15);
        }

        /* Responsive Game Canvas Wrapper */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 600px;
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(180, 83, 9, 0.2), inset 0 0 0 4px rgba(255, 255, 255, 0.8);
            background: #fffdfa;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top Warning Line */
        .danger-line {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            height: 2px;
            border-top: 2px dashed #ef4444;
            pointer-events: none;
            z-index: 10;
        }

        /* Fruit Drop Guide Indicator */
        #guide-line {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: rgba(249, 115, 22, 0.4);
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        /* Bouncy Button Effect */
        .btn-bounce {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-slate-800">

    <!-- Top Navigation Header / Score Bar -->
    <div class="w-full max-w-[420px] mb-3 flex items-center justify-between gap-2">
        <div class="glass-card rounded-2xl px-4 py-2 flex items-center gap-3 shadow-md flex-1">
            <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center text-xl shadow-inner">
                🍗
            </div>
            <div>
                <div class="text-[11px] text-amber-700 font-bold uppercase tracking-wider">SCORE</div>
                <div id="score" class="text-2xl font-black text-amber-900 leading-none">0</div>
            </div>
        </div>

        <div class="glass-card rounded-2xl px-4 py-2 flex items-center gap-3 shadow-md flex-1">
            <div class="w-10 h-10 rounded-xl bg-orange-400 text-white flex items-center justify-center text-xl shadow-inner">
                🏆
            </div>
            <div>
                <div class="text-[11px] text-amber-700 font-bold uppercase tracking-wider">BEST</div>
                <div id="best-score" class="text-2xl font-black text-amber-900 leading-none">0</div>
            </div>
        </div>

        <!-- Next Food Preview & Reset -->
        <div class="glass-card rounded-2xl p-2 flex items-center justify-center gap-2 shadow-md">
            <div class="flex flex-col items-center">
                <span class="text-[10px] text-amber-700 font-bold mb-0.5">NEXT</span>
                <div id="next-fruit-preview" class="w-8 h-8 flex items-center justify-center text-xl">
                    🍿
                </div>
            </div>
            <button id="restart-btn" class="w-9 h-9 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 flex items-center justify-center btn-bounce shadow-sm">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <!-- Main Game Container -->
    <div id="game-container" class="relative">
        <div class="danger-line"></div>
        <div id="guide-line"></div>
        <canvas id="canvas"></canvas>

        <!-- Danger Warning Glow -->
        <div id="warning-overlay" class="absolute inset-0 bg-red-500/10 opacity-0 pointer-events-none transition-opacity duration-300"></div>

        <!-- Game Start Overlay -->
        <div id="start-modal" class="absolute inset-0 bg-amber-950/40 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center">
            <div class="glass-card rounded-3xl p-6 max-w-xs w-full flex flex-col items-center border-2 border-amber-300 shadow-2xl">
                <div class="text-6xl mb-2 animate-bounce">🍕</div>
                <h1 class="text-3xl font-black text-amber-900 mb-1">야식대장 게임</h1>
                <p class="text-xs text-amber-700 mb-6">맛있는 야식들을 합쳐서<br>최고의 치킨&피자 세트를 만들어보세요!</p>

                <div class="w-full bg-amber-50/80 rounded-2xl p-3 border border-amber-200 text-xs text-amber-800 mb-6 space-y-1 text-left">
                    <div class="flex items-center gap-1.5"><span class="text-amber-500 font-bold">•</span> 클릭/드래그로 위치 조절 후 손 떼기</div>
                    <div class="flex items-center gap-1.5"><span class="text-amber-500 font-bold">•</span> 같은 음식끼리 닿으면 더 큰 요리로 합체!</div>
                    <div class="flex items-center gap-1.5"><span class="text-amber-500 font-bold">•</span> 빨간선을 3초 이상 넘어가면 배부름 오버!</div>
                </div>

                <button id="start-btn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold text-xl rounded-2xl shadow-lg shadow-amber-500/30 btn-bounce">
                    게임 시작
                </button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameover-modal" class="absolute inset-0 bg-amber-950/60 backdrop-blur-md z-30 flex flex-col items-center justify-center p-6 text-center hidden">
            <div class="glass-card rounded-3xl p-6 max-w-xs w-full flex flex-col items-center border-2 border-red-300 shadow-2xl">
                <div class="text-6xl mb-2">💥</div>
                <h2 class="text-3xl font-black text-rose-600 mb-1">GAME OVER</h2>
                <p class="text-xs text-slate-500 mb-4">음식 상자가 가득 차버렸어요!</p>

                <div class="w-full bg-amber-50 rounded-2xl p-4 border border-amber-200 mb-6">
                    <div class="text-xs text-amber-700 font-bold mb-1">최종 점수</div>
                    <div id="final-score" class="text-4xl font-black text-amber-900">0</div>
                </div>

                <button id="retry-btn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold text-xl rounded-2xl shadow-lg shadow-amber-500/30 btn-bounce">
                    다시 도전하기
                </button>
            </div>
        </div>
    </div>

    <!-- Food Evolutionary Chain Bar -->
    <div class="w-full max-w-[420px] mt-3 glass-card rounded-2xl p-2.5 flex items-center justify-between text-lg overflow-x-auto gap-1">
        <span class="text-xs font-bold text-amber-800 px-1">합체:</span>
        <span title="팝콘">🍿</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="타코야키">🐙</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="핫도그">🌭</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="감자튀김">🍟</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="샌드위치">🥪</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="만두">🥟</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="초밥">🍣</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="치킨">🍗</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="피자">🍕</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="족발">🍖</span><i class="fa-solid fa-angle-right text-[10px] text-amber-400"></i>
        <span title="치킨피자세트">🍱</span>
    </div>

    <script>
        // --- Web Audio API Synthesizer Sound Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'merge') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.08);
                osc.frequency.setValueAtTime(900, now + 0.16);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'watermelon') {
                // Fanfare sound when making a big pizza/chicken set
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            } else if (type === 'gameover') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // 음성 합성(SpeechSynthesis) - "이게 뭐야" 재생 함수
        function speakWhatsThis() {
            if ('speechSynthesis' in window) {
                // 이전 음성이 재생 중이면 취소하고 즉시 새로 말하기
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance('이게 뭐야');
                utterance.lang = 'ko-KR';
                utterance.rate = 1.3;  // 신나고 통통 튀게 빠른 속도로 설정
                utterance.pitch = 1.2; // 약간 높은 톤
                utterance.volume = 1.0;
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Food Definitions (11 Evolution Stages including Chicken & Pizza) ---
        const FRUITS = [
            { name: '팝콘', radius: 15, score: 2, color: '#fde047', emoji: '🍿' },
            { name: '타코야키', radius: 22, score: 4, color: '#fb923c', emoji: '🐙' },
            { name: '핫도그', radius: 30, score: 8, color: '#f87171', emoji: '🌭' },
            { name: '감자튀김', radius: 38, score: 16, color: '#facc15', emoji: '🍟' },
            { name: '샌드위치', radius: 46, score: 32, color: '#a3e635', emoji: '🥪' },
            { name: '만두', radius: 55, score: 64, color: '#fed7aa', emoji: '🥟' },
            { name: '초밥', radius: 65, score: 128, color: '#f43f5e', emoji: '🍣' },
            { name: '치킨', radius: 75, score: 256, color: '#d97706', emoji: '🍗' },
            { name: '피자', radius: 88, score: 512, color: '#ea580c', emoji: '🍕' },
            { name: '족발', radius: 102, score: 1024, color: '#78350f', emoji: '🍖' },
            { name: '치킨피자세트', radius: 118, score: 2048, color: '#b45309', emoji: '🍱' }
        ];

        // --- Game Logic & Matter.js State ---
        const { Engine, Render, Runner, Bodies, World, Events, Body } = Matter;

        let engine, runner;
        let canvas, ctx;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('food_game_best') || '0');

        let currentFruit = null;
        let nextFruitIndex = 0;
        let canDrop = true;
        let isGameOver = false;
        let isGameStarted = false;

        let currentMouseX = 210; // Default center X
        let lineTimer = 0; // Overflow danger timer
        let particles = [];

        // Container Dimensions
        const CONTAINER_WIDTH = 420;
        const CONTAINER_HEIGHT = 600;
        const DANGER_Y = 100;

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const finalScoreEl = document.getElementById('final-score');
        const nextPreviewEl = document.getElementById('next-fruit-preview');
        const guideLine = document.getElementById('guide-line');
        const warningOverlay = document.getElementById('warning-overlay');
        const startModal = document.getElementById('start-modal');
        const gameoverModal = document.getElementById('gameover-modal');

        // Initialize App
        window.addEventListener('load', () => {
            bestScoreEl.innerText = bestScore;
            initMatterEngine();
            setupEventListeners();
        });

        function initMatterEngine() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            canvas.width = CONTAINER_WIDTH;
            canvas.height = CONTAINER_HEIGHT;

            // Physics Engine Init
            engine = Engine.create({
                gravity: { x: 0, y: 1.5, scale: 0.001 }
            });

            // Boundary Walls (Left, Right, Bottom)
            const wallOptions = { isStatic: true, friction: 0.2, restitution: 0.2 };
            const ground = Bodies.rectangle(CONTAINER_WIDTH / 2, CONTAINER_HEIGHT + 30, CONTAINER_WIDTH + 100, 60, wallOptions);
            const leftWall = Bodies.rectangle(-30, CONTAINER_HEIGHT / 2, 60, CONTAINER_HEIGHT * 2, wallOptions);
            const rightWall = Bodies.rectangle(CONTAINER_WIDTH + 30, CONTAINER_HEIGHT / 2, 60, CONTAINER_HEIGHT * 2, wallOptions);

            World.add(engine.world, [ground, leftWall, rightWall]);

            // Collision Merge Listener
            Events.on(engine, 'collisionStart', handleCollisions);

            runner = Runner.create();
            Runner.run(runner, engine);

            // Start Render Canvas Frame Loop
            requestAnimationFrame(renderLoop);
        }

        // Prepare Next Drop Food
        function prepareNextFruit() {
            if (isGameOver) return;

            const index = nextFruitIndex;
            nextFruitIndex = Math.floor(Math.random() * 5); // Pick random small food (0-4)
            nextPreviewEl.innerText = FRUITS[nextFruitIndex].emoji;

            currentFruit = {
                index: index,
                x: currentMouseX,
                y: 50,
                radius: FRUITS[index].radius
            };
            canDrop = true;
        }

        // Drop Current Food into Container
        function dropFruit() {
            if (!canDrop || !currentFruit || isGameOver || !isGameStarted) return;
            canDrop = false;

            const fruitInfo = FRUITS[currentFruit.index];

            // Create Physics Circle Body
            const body = Bodies.circle(currentFruit.x, currentFruit.y, fruitInfo.radius, {
                restitution: 0.3,
                friction: 0.1,
                density: 0.001,
                label: 'fruit_' + currentFruit.index
            });

            body.fruitIndex = currentFruit.index;
            World.add(engine.world, body);

            playSound('pop');
            speakWhatsThis(); // 음식이 내려놓아질(설치될) 때 "이게 뭐야" 소리 출력
            currentFruit = null;

            // Cooldown delay before next food appears
            setTimeout(() => {
                if (!isGameOver) prepareNextFruit();
            }, 500);
        }

        // Handle Collision and Fusion Logic
        function handleCollisions(event) {
            const pairs = event.pairs;

            pairs.forEach(pair => {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;

                // Check if both bodies are valid food bodies
                if (bodyA.fruitIndex !== undefined && bodyB.fruitIndex !== undefined) {
                    if (bodyA.fruitIndex === bodyB.fruitIndex && !bodyA.isMerging && !bodyB.isMerging) {
                        const currentIndex = bodyA.fruitIndex;

                        // Max food reached?
                        if (currentIndex >= FRUITS.length - 1) return;

                        bodyA.isMerging = true;
                        bodyB.isMerging = true;

                        const newIndex = currentIndex + 1;
                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;

                        // Remove collided pair
                        World.remove(engine.world, [bodyA, bodyB]);

                        // Add new merged food
                        const newFruitInfo = FRUITS[newIndex];
                        const newBody = Bodies.circle(midX, midY, newFruitInfo.radius, {
                            restitution: 0.3,
                            friction: 0.1,
                            density: 0.001,
                            label: 'fruit_' + newIndex
                        });
                        newBody.fruitIndex = newIndex;

                        World.add(engine.world, newBody);

                        // Add Score
                        score += newFruitInfo.score;
                        scoreEl.innerText = score;

                        if (score > bestScore) {
                            bestScore = score;
                            bestScoreEl.innerText = bestScore;
                            localStorage.setItem('food_game_best', bestScore.toString());
                        }

                        // Play Sound & Effects
                        if (newIndex === FRUITS.length - 1) {
                            playSound('watermelon');
                            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                        } else {
                            playSound('merge');
                        }

                        createParticles(midX, midY, newFruitInfo.color);
                    }
                }
            });
        }

        // Spawn Juicy Particles on Merge
        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1.0
                });
            }
        }

        // Custom Canvas Render Engine Loop
        function renderLoop() {
            ctx.clearRect(0, 0, CONTAINER_WIDTH, CONTAINER_HEIGHT);

            // 1. Draw Static / Dynamic Physics Fruit Bodies
            const bodies = Composite.allBodies(engine.world);

            bodies.forEach(body => {
                if (body.fruitIndex !== undefined) {
                    const fruit = FRUITS[body.fruitIndex];
                    const pos = body.position;
                    const angle = body.angle;

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(angle);

                    // Fruit Circle Color Shadow & Background
                    ctx.beginPath();
                    ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fruit.color;
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 4;
                    ctx.fill();

                    // Inner Gloss Effect
                    ctx.beginPath();
                    ctx.arc(-fruit.radius * 0.3, -fruit.radius * 0.3, fruit.radius * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.fill();

                    // Emoji Text Centered
                    ctx.restore();
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.font = `${fruit.radius * 1.1}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(fruit.emoji, 0, 2);
                    ctx.restore();
                }
            });

            // 2. Draw Ready-to-Drop Floating Fruit
            if (currentFruit && canDrop && isGameStarted && !isGameOver) {
                const fruit = FRUITS[currentFruit.index];

                ctx.save();
                ctx.translate(currentFruit.x, currentFruit.y);

                // Preview Circle Glow
                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
                ctx.fillStyle = fruit.color;
                ctx.globalAlpha = 0.85;
                ctx.fill();

                ctx.font = `${fruit.radius * 1.1}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 1.0;
                ctx.fillText(fruit.emoji, 0, 2);

                ctx.restore();
            }

            // 3. Render Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });

            // 4. Check Game Over Line Overflow
            checkGameOverCondition(bodies);

            requestAnimationFrame(renderLoop);
        }

        // Check overflow past red warning line
        function checkGameOverCondition(bodies) {
            if (!isGameStarted || isGameOver) return;

            let isOverflow = false;

            bodies.forEach(body => {
                if (body.fruitIndex !== undefined && !body.isMerging) {
                    // Body stopped moving and sits above danger line
                    if (body.position.y - FRUITS[body.fruitIndex].radius < DANGER_Y && Math.abs(body.velocity.y) < 0.2) {
                        isOverflow = true;
                    }
                }
            });

            if (isOverflow) {
                lineTimer++;
                warningOverlay.style.opacity = (Math.sin(lineTimer * 0.1) * 0.5 + 0.5).toString();

                if (lineTimer > 180) { // Approx 3 seconds above line
                    triggerGameOver();
                }
            } else {
                lineTimer = 0;
                warningOverlay.style.opacity = '0';
            }
        }

        // Helper to get relative canvas position
        function updatePointerPosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CONTAINER_WIDTH / rect.width;
            let x = (clientX - rect.left) * scaleX;

            if (currentFruit) {
                const radius = FRUITS[currentFruit.index].radius;
                x = Math.max(radius + 10, Math.min(CONTAINER_WIDTH - radius - 10, x));
                currentFruit.x = x;
            }

            currentMouseX = x;
            guideLine.style.left = `${(x / CONTAINER_WIDTH) * 100}%`;
        }

        // Event Listeners
        function setupEventListeners() {
            const container = document.getElementById('game-container');

            // Mouse Events
            container.addEventListener('mousemove', (e) => {
                guideLine.style.display = 'block';
                updatePointerPosition(e.clientX);
            });

            container.addEventListener('mouseleave', () => {
                guideLine.style.display = 'none';
            });

            container.addEventListener('click', (e) => {
                if (!isGameStarted || isGameOver) return;
                updatePointerPosition(e.clientX);
                dropFruit();
            });

            // Touch Events
            container.addEventListener('touchstart', (e) => {
                if (!isGameStarted || isGameOver) return;
                guideLine.style.display = 'block';
                updatePointerPosition(e.touches[0].clientX);
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!isGameStarted || isGameOver) return;
                updatePointerPosition(e.touches[0].clientX);
            }, { passive: true });

            container.addEventListener('touchend', () => {
                if (!isGameStarted || isGameOver) return;
                guideLine.style.display = 'none';
                dropFruit();
            });

            // Start & Restart Buttons
            document.getElementById('start-btn').addEventListener('click', () => {
                initAudio();
                startModal.classList.add('hidden');
                isGameStarted = true;
                nextFruitIndex = Math.floor(Math.random() * 5);
                prepareNextFruit();
            });

            document.getElementById('retry-btn').addEventListener('click', restartGame);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
        }

        function triggerGameOver() {
            isGameOver = true;
            playSound('gameover');
            finalScoreEl.innerText = score;
            gameoverModal.classList.remove('hidden');
        }

        function restartGame() {
            // Clear physics bodies except boundaries
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(body => {
                if (body.fruitIndex !== undefined) {
                    World.remove(engine.world, body);
                }
            });

            score = 0;
            scoreEl.innerText = '0';
            lineTimer = 0;
            isGameOver = false;
            warningOverlay.style.opacity = '0';
            gameoverModal.classList.add('hidden');

            nextFruitIndex = Math.floor(Math.random() * 5);
            prepareNextFruit();
        }

        // Composite shortcut
        const Composite = Matter.Composite;
    </script>
</body>
</html>
