    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #7dd3fc;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 20;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(15, 23, 42, 0.9);
        }
        #crosshair::before {
            top: 9px;
            left: 0;
            width: 20px;
            height: 2px;
        }
        #crosshair::after {
            top: 0;
            left: 9px;
            width: 2px;
            height: 20px;
        }
        .crosshair-recoil {
            transform: translate(-50%, -50%) scale(1.4) !important;
            transition: transform 0.05s ease-out;
        }
        .damage-flash {
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { background-color: rgba(239, 68, 68, 0.5); }
            100% { background-color: rgba(239, 68, 68, 0); }
        }

    <!-- Web Audio API Synthesizer -->
    <script>
        class SoundSystem {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playShoot() {
                this.init();
                const now = this.ctx.currentTime;
                
                // Gunshot Noise
                const bufferSize = this.ctx.sampleRate * 0.12;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(4000, now);
                filter.frequency.exponentialRampToValueAtTime(150, now + 0.12);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playEnemyShoot() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            }

            playHit() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playKill() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playReload() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playPlayerHit() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.25);

                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const audio = new SoundSystem();
    </script>

    <!-- Game Logic -->
    <script>
        let scene, camera, renderer;
        let player = {
            hp: 100,
            maxHp: 100,
            speed: 0.14,
            ammo: 30,
            maxAmmo: 30,
            isReloading: false
        };

        let keys = {};
        let mouseSensitivity = 0.002;
        let pitch = 0, yaw = 0;
        let isGameRunning = false;

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];

        let wave = 1;
        let score = 0;
        let enemiesToSpawn = 5;
        let spawnInterval = null;

        let gunMesh, muzzleFlashMesh;

        // Initialize Three.js Scene
        function init3D() {
            scene = new THREE.Scene();
            // Bright Day Ruined City Skybox Color & Fog
            scene.background = new THREE.Color(0xbfe3f7);
            scene.fog = new THREE.FogExp2(0xcbe5f5, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Bright Sunlight & Ambient Lighting
            const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.85);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
            sunLight.position.set(40, 70, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 180;
            sunLight.shadow.camera.left = -60;
            sunLight.shadow.camera.right = 60;
            sunLight.shadow.camera.top = 60;
            sunLight.shadow.camera.bottom = -60;
            scene.add(sunLight);

            // Subtle Sky Fill Light
            const fillLight = new THREE.DirectionalLight(0x90c2e7, 0.4);
            fillLight.position.set(-30, 20, -30);
            scene.add(fillLight);

            // Ruined Asphalt Ground
            const floorGeo = new THREE.PlaneGeometry(140, 140);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x5a5f66, roughness: 0.95, metalness: 0.05 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Broken Road Markings & Ground Patches
            createGroundDetails();

            // Ruined City Buildings & Environment Debris
            createRuinedCity();

            // Create High-Quality Gun
            createGun();

            window.addEventListener('resize', onWindowResize);
        }

        function createGroundDetails() {
            // Cracked Asphalt & Dirt Patches
            const patchMat = new THREE.MeshStandardMaterial({ color: 0x3d3732, roughness: 1.0 });
            for (let i = 0; i < 15; i++) {
                const patchGeo = new THREE.PlaneGeometry(6 + Math.random() * 8, 6 + Math.random() * 8);
                const patch = new THREE.Mesh(patchGeo, patchMat);
                patch.rotation.x = -Math.PI / 2;
                patch.position.set((Math.random() - 0.5) * 100, 0.01, (Math.random() - 0.5) * 100);
                patch.rotation.z = Math.random() * Math.PI;
                patch.receiveShadow = true;
                scene.add(patch);
            }
        }

        function createRuinedCity() {
            // Concrete Wall & Pillar Materials for Ruined Buildings
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x8c8f94, roughness: 0.9, metalness: 0.1 });
            const rustMat = new THREE.MeshStandardMaterial({ color: 0x7c3f2d, roughness: 0.8, metalness: 0.5 });
            const darkConcreteMat = new THREE.MeshStandardMaterial({ color: 0x4a4d52, roughness: 0.9 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x78909c, transparent: true, opacity: 0.4, roughness: 0.2 });

            // Building Layout Specs
            const buildings = [
                { x: -22, z: -22, w: 12, h: 22, d: 12 },
                { x: 22, z: -22, w: 14, h: 28, d: 10 },
                { x: -25, z: 20, w: 10, h: 18, d: 14 },
                { x: 24, z: 22, w: 12, h: 24, d: 12 },
                { x: 0, z: -32, w: 20, h: 16, d: 10 },
                { x: -35, z: 0, w: 10, h: 20, d: 20 },
                { x: 35, z: 0, w: 10, h: 26, d: 18 }
            ];

            buildings.forEach(b => {
                const group = new THREE.Group();

                // Main Building Shell
                const mainGeo = new THREE.BoxGeometry(b.w, b.h, b.d);
                const building = new THREE.Mesh(mainGeo, wallMat);
                building.position.set(0, b.h / 2, 0);
                building.castShadow = true;
                building.receiveShadow = true;
                group.add(building);

                // Broken Upper Section (Ruined Gap)
                const ruinGeo = new THREE.BoxGeometry(b.w * 0.7, b.h * 0.3, b.d * 0.7);
                const ruinCut = new THREE.Mesh(ruinGeo, darkConcreteMat);
                ruinCut.position.set((Math.random() - 0.5) * 2, b.h * 0.8, (Math.random() - 0.5) * 2);
                ruinCut.rotation.y = Math.random() * 0.5;
                ruinCut.castShadow = true;
                group.add(ruinCut);

                // Ruined Window Grids
                const winCount = Math.floor(b.h / 4);
                for (let level = 1; level < winCount; level++) {
                    if (Math.random() > 0.3) {
                        const winGeo = new THREE.BoxGeometry(b.w + 0.1, 1.8, b.d - 2);
                        const win = new THREE.Mesh(winGeo, glassMat);
                        win.position.set(0, level * 3.8, 0);
                        group.add(win);
                    }
                }

                // Exposed Steel Beams
                for (let i = 0; i < 3; i++) {
                    const beamGeo = new THREE.BoxGeometry(0.3, 3 + Math.random() * 3, 0.3);
                    const beam = new THREE.Mesh(beamGeo, rustMat);
                    beam.position.set((Math.random() - 0.5) * b.w, b.h + 1, (Math.random() - 0.5) * b.d);
                    beam.rotation.set(Math.random() * 0.4, Math.random() * 0.4, Math.random() * 0.4);
                    group.add(beam);
                }

                group.position.set(b.x, 0, b.z);
                scene.add(group);
            });

            // Urban Debris: Destroyed Cars, Concrete Blocks & Barriers
            createDebris(wallMat, rustMat, darkConcreteMat);
        }

        function createDebris(wallMat, rustMat, darkMat) {
            const positions = [
                [-8, 0, -10], [10, 0, -8], [-12, 0, 8], [8, 0, 12],
                [0, 0, -15], [-15, 0, -2], [15, 0, 2], [0, 0, 16]
            ];

            positions.forEach((pos, idx) => {
                if (idx % 2 === 0) {
                    // Wrecked Vehicle Shell
                    const carGroup = new THREE.Group();
                    const carBodyGeo = new THREE.BoxGeometry(2.4, 1.2, 4.2);
                    const carBody = new THREE.Mesh(carBodyGeo, rustMat);
                    carBody.position.y = 0.6;
                    carBody.castShadow = true;
                    carGroup.add(carBody);

                    const cabinGeo = new THREE.BoxGeometry(2.0, 0.9, 2.2);
                    const cabin = new THREE.Mesh(cabinGeo, darkMat);
                    cabin.position.set(0, 1.5, -0.3);
                    cabin.rotation.z = (Math.random() - 0.5) * 0.15;
                    cabin.castShadow = true;
                    carGroup.add(cabin);

                    carGroup.position.set(pos[0], 0, pos[2]);
                    carGroup.rotation.y = Math.random() * Math.PI;
                    scene.add(carGroup);
                } else {
                    // Concrete Barrier & Rubble Pile
                    const barrierGeo = new THREE.BoxGeometry(3.5, 1.4, 1.2);
                    const barrier = new THREE.Mesh(barrierGeo, wallMat);
                    barrier.position.set(pos[0], 0.7, pos[2]);
                    barrier.rotation.y = Math.random() * Math.PI;
                    barrier.castShadow = true;
                    barrier.receiveShadow = true;
                    scene.add(barrier);

                    // Scattered Rubble Blocks
                    for (let r = 0; r < 4; r++) {
                        const rubGeo = new THREE.BoxGeometry(0.6 + Math.random() * 0.8, 0.5, 0.6 + Math.random() * 0.8);
                        const rub = new THREE.Mesh(rubGeo, darkMat);
                        rub.position.set(pos[0] + (Math.random() - 0.5) * 3, 0.25, pos[2] + (Math.random() - 0.5) * 3);
                        rub.rotation.set(Math.random(), Math.random(), Math.random());
                        rub.castShadow = true;
                        scene.add(rub);
                    }
                }
            });
        }

        function createGun() {
            gunMesh = new THREE.Group();

            // Main Gun Receiver
            const bodyGeo = new THREE.BoxGeometry(0.08, 0.12, 0.35);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x27272a, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);

            // Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.3, 12);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x09090b, metalness: 0.9, roughness: 0.1 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.03, -0.28);

            // Tactical Sight
            const scopeGeo = new THREE.BoxGeometry(0.04, 0.04, 0.12);
            const scopeMat = new THREE.MeshStandardMaterial({ color: 0x52525b, metalness: 0.7 });
            const scope = new THREE.Mesh(scopeGeo, scopeMat);
            scope.position.set(0, 0.08, -0.05);

            // Desert/Military Accent Line
            const laserGeo = new THREE.BoxGeometry(0.01, 0.01, 0.2);
            const laserMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
            const laser = new THREE.Mesh(laserGeo, laserMat);
            laser.position.set(0.045, 0.02, -0.1);

            // Muzzle Flash
            const flashGeo = new THREE.OctahedronGeometry(0.08, 0);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0 });
            muzzleFlashMesh = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlashMesh.position.set(0, 0.03, -0.45);

            gunMesh.add(body);
            gunMesh.add(barrel);
            gunMesh.add(scope);
            gunMesh.add(laser);
            gunMesh.add(muzzleFlashMesh);

            gunMesh.position.set(0.22, -0.18, -0.38);
            camera.add(gunMesh);
            scene.add(camera);
        }

        // Create Humanoid (Person) Enemy Model
        function createHumanoidMesh() {
            const enemyGroup = new THREE.Group();

            const urbanArmorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, metalness: 0.5 });
            const redGlowMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const visorMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });

            // Head
            const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
            const head = new THREE.Mesh(headGeo, urbanArmorMat);
            head.position.y = 1.7;
            head.castShadow = true;

            // Visor (Glow Effect)
            const visorGeo = new THREE.BoxGeometry(0.28, 0.08, 0.05);
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.72, -0.18);

            // Torso (Body)
            const torsoGeo = new THREE.BoxGeometry(0.6, 0.7, 0.35);
            const torso = new THREE.Mesh(torsoGeo, urbanArmorMat);
            torso.position.y = 1.15;
            torso.castShadow = true;

            // Core Light on Chest
            const coreGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.05, 8);
            const core = new THREE.Mesh(coreGeo, redGlowMat);
            core.rotation.x = Math.PI / 2;
            core.position.set(0, 1.25, -0.18);

            // Arms
            const armGeo = new THREE.BoxGeometry(0.16, 0.6, 0.16);

            const leftArm = new THREE.Mesh(armGeo, urbanArmorMat);
            leftArm.position.set(-0.4, 1.15, 0);
            leftArm.castShadow = true;

            const rightArm = new THREE.Mesh(armGeo, urbanArmorMat);
            rightArm.position.set(0.4, 1.15, 0);
            rightArm.castShadow = true;

            // Enemy Rifle Attachment on Right Arm
            const rifleGeo = new THREE.BoxGeometry(0.1, 0.1, 0.5);
            const rifleMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
            const rifle = new THREE.Mesh(rifleGeo, rifleMat);
            rifle.position.set(0.4, 1.0, -0.2);
            rifle.castShadow = true;

            // Legs
            const legGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);

            const leftLeg = new THREE.Mesh(legGeo, urbanArmorMat);
            leftLeg.position.set(-0.18, 0.35, 0);
            leftLeg.castShadow = true;

            const rightLeg = new THREE.Mesh(legGeo, urbanArmorMat);
            rightLeg.position.set(0.18, 0.35, 0);
            rightLeg.castShadow = true;

            // Assemble Humanoid
            enemyGroup.add(head);
            enemyGroup.add(visor);
            enemyGroup.add(torso);
            enemyGroup.add(core);
            enemyGroup.add(leftArm);
            enemyGroup.add(rightArm);
            enemyGroup.add(rifle);
            enemyGroup.add(leftLeg);
            enemyGroup.add(rightLeg);

            return {
                group: enemyGroup,
                limbs: { leftArm, rightArm, leftLeg, rightLeg }
            };
        }

        function startGame() {
            audio.init();

            // Reset States
            player.hp = 100;
            player.ammo = player.maxAmmo;
            player.isReloading = false;
            score = 0;
            wave = 1;

            enemies.forEach(e => scene.remove(e.mesh));
            bullets.forEach(b => scene.remove(b.mesh));
            enemyBullets.forEach(eb => scene.remove(eb.mesh));
            particles.forEach(p => scene.remove(p.mesh));
            enemies = [];
            bullets = [];
            enemyBullets = [];
            particles = [];

            camera.position.set(0, 1.6, 0);
            pitch = 0;
            yaw = 0;

            updateHUD();

            document.getElementById('menuOverlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            document.body.requestPointerLock();

            isGameRunning = true;
            startWave();
        }

        function startWave() {
            enemiesToSpawn = 6 + wave * 5;
            let spawned = 0;

            if (spawnInterval) clearInterval(spawnInterval);

            spawnInterval = setInterval(() => {
                if (!isGameRunning) return;
                if (spawned < enemiesToSpawn) {
                    spawnEnemy();
                    spawned++;
                } else {
                    clearInterval(spawnInterval);
                }
            }, Math.max(200, 500 - wave * 40));

            document.getElementById('waveText').innerText = wave;
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 22 + Math.random() * 12;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;

            const humanoid = createHumanoidMesh();
            humanoid.group.position.set(x, 0, z);
            scene.add(humanoid.group);

            enemies.push({
                mesh: humanoid.group,
                limbs: humanoid.limbs,
                hp: 40 + wave * 8,
                maxHp: 40 + wave * 8,
                speed: 0.055 + Math.min(wave * 0.005, 0.06),
                lastShot: Date.now() + Math.random() * 600,
                animOffset: Math.random() * Math.PI * 2
            });
        }

        // Event Listeners for Controls
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyR') reloadAmmo();
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && isGameRunning) {
                yaw -= e.movementX * mouseSensitivity;
                pitch -= e.movementY * mouseSensitivity;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isGameRunning) {
                if (document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                } else {
                    shootGun();
                }
            }
        });

        function reloadAmmo() {
            if (player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            audio.playReload();
            document.getElementById('reloadMsg').innerText = "⏳ 재장전 중...";
            document.getElementById('reloadMsg').classList.remove('hidden');

            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                document.getElementById('reloadMsg').classList.add('hidden');
                updateHUD();
            }, 1100);
        }

        function shootGun() {
            if (player.isReloading) return;
            if (player.ammo <= 0) {
                document.getElementById('reloadMsg').innerText = "⚠️ [R] 키를 눌러 재장전하세요!";
                document.getElementById('reloadMsg').classList.remove('hidden');
                return;
            }

            player.ammo--;
            updateHUD();
            audio.playShoot();

            // Crosshair Recoil Effect
            const ch = document.getElementById('crosshair');
            ch.classList.add('crosshair-recoil');
            setTimeout(() => ch.classList.remove('crosshair-recoil'), 50);

            // Muzzle Flash
            muzzleFlashMesh.material.opacity = 0.9;
            muzzleFlashMesh.scale.setScalar(1 + Math.random() * 0.5);
            setTimeout(() => { muzzleFlashMesh.material.opacity = 0; }, 40);

            // Gun Recoil Animation
            gunMesh.position.z = -0.26;
            gunMesh.rotation.x = 0.15;
            setTimeout(() => { 
                gunMesh.position.z = -0.38; 
                gunMesh.rotation.x = 0;
            }, 70);

            // Player Bullet
            const bulletGeo = new THREE.SphereGeometry(0.09, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(0.6));
            scene.add(bullet);

            bullets.push({
                mesh: bullet,
                dir: dir,
                speed: 1.5,
                life: 50
            });
        }

        function enemyShoot(enemy) {
            audio.playEnemyShoot();

            const bulletGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xd97706 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const dir = new THREE.Vector3();
            dir.subVectors(camera.position, enemy.mesh.position).normalize();

            bullet.position.copy(enemy.mesh.position).add(new THREE.Vector3(0, 1.2, 0));
            scene.add(bullet);

            enemyBullets.push({
                mesh: bullet,
                dir: dir,
                speed: 0.45 + wave * 0.04,
                life: 90
            });
        }

        function updateHUD() {
            document.getElementById('healthText').innerText = `${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
            document.getElementById('healthBar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
            document.getElementById('ammoCurrent').innerText = player.ammo;
            document.getElementById('scoreText').innerText = score;
        }

        function drawRadar() {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 100, 100);

            // Center (Player)
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(50, 50, 3, 0, Math.PI * 2);
            ctx.fill();

            // Enemies on Radar
            ctx.fillStyle = '#ef4444';
            enemies.forEach(enemy => {
                const relX = (enemy.mesh.position.x - camera.position.x) * 1.3;
                const relZ = (enemy.mesh.position.z - camera.position.z) * 1.3;

                const radarX = 50 + relX;
                const radarY = 50 + relZ;

                if (radarX >= 2 && radarX <= 98 && radarY >= 2 && radarY <= 98) {
                    ctx.beginPath();
                    ctx.arc(radarX, radarY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createHitParticles(pos, color = 0xef4444, count = 10) {
            for (let i = 0; i < count; i++) {
                const pGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
                const pMat = new THREE.MeshBasicMaterial({ color: color });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                scene.add(p);

                particles.push({
                    mesh: p,
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.25,
                        (Math.random() - 0.5) * 0.3
                    ),
                    life: 25
                });
            }
        }

        function playerTakeDamage(amount) {
            player.hp -= amount;
            audio.playPlayerHit();
            updateHUD();

            const overlay = document.getElementById('damageOverlay');
            overlay.classList.add('damage-flash');
            setTimeout(() => overlay.classList.remove('damage-flash'), 300);

            if (player.hp <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            isGameRunning = false;
            document.exitPointerLock();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('menuOverlay').classList.remove('hidden');

            document.getElementById('menuTitle').innerText = "GAME OVER";
            document.getElementById('menuSub').innerText = "폐허 도시에서 적들의 공격을 이기지 못했습니다.";
            document.getElementById('finalStats').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalWave').innerText = wave;
            document.getElementById('startBtn').innerText = "다시 도전하기";
        }

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isGameRunning) {
                const time = Date.now() * 0.005;

                // Update Camera Rotation
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                // Player Movement
                const moveDir = new THREE.Vector3();
                if (keys['KeyW']) moveDir.z -= 1;
                if (keys['KeyS']) moveDir.z += 1;
                if (keys['KeyA']) moveDir.x -= 1;
                if (keys['KeyD']) moveDir.x += 1;

                moveDir.normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.addScaledVector(moveDir, player.speed);

                // Gun Bobbing Effect when Walking
                if (moveDir.length() > 0) {
                    gunMesh.position.y = -0.18 + Math.sin(time * 2) * 0.015;
                    gunMesh.position.x = 0.22 + Math.cos(time) * 0.01;
                }

                // Keep Player inside boundary
                camera.position.x = Math.max(-60, Math.min(60, camera.position.x));
                camera.position.z = Math.max(-60, Math.min(60, camera.position.z));
                camera.position.y = 1.6;

                // Update Player Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.mesh.position.addScaledVector(b.dir, b.speed);
                    b.life--;

                    // Hit Detection with Humanoid Enemies
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        const enemyCenter = enemy.mesh.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                        const dist = b.mesh.position.distanceTo(enemyCenter);

                        if (dist < 0.9) {
                            enemy.hp -= 25;
                            audio.playHit();
                            createHitParticles(b.mesh.position, 0xef4444, 6);

                            if (enemy.hp <= 0) {
                                audio.playKill();
                                createHitParticles(enemyCenter, 0xf59e0b, 18);
                                scene.remove(enemy.mesh);
                                enemies.splice(j, 1);
                                score += 150;
                                updateHUD();
                            }

                            hit = true;
                            break;
                        }
                    }

                    if (hit || b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                // Update Enemy Bullets
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const eb = enemyBullets[i];
                    eb.mesh.position.addScaledVector(eb.dir, eb.speed);
                    eb.life--;

                    const distToPlayer = eb.mesh.position.distanceTo(camera.position);
                    if (distToPlayer < 0.7) {
                        playerTakeDamage(12);
                        scene.remove(eb.mesh);
                        enemyBullets.splice(i, 1);
                        continue;
                    }

                    if (eb.life <= 0) {
                        scene.remove(eb.mesh);
                        enemyBullets.splice(i, 1);
                    }
                }

                // Update Enemies AI, Limb Walking Animation & Movement
                enemies.forEach((enemy, idx) => {
                    // Face Player
                    enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);

                    // Move towards Player
                    const dist = enemy.mesh.position.distanceTo(camera.position);
                    if (dist > 2.5) {
                        const dir = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position).normalize();
                        enemy.mesh.position.addScaledVector(dir, enemy.speed);

                        // Humanoid Walking Animation (Legs & Arms Swing)
                        const swing = Math.sin(time * 2.5 + enemy.animOffset) * 0.6;
                        enemy.limbs.leftLeg.rotation.x = swing;
                        enemy.limbs.rightLeg.rotation.x = -swing;
                        enemy.limbs.leftArm.rotation.x = -swing;
                        enemy.limbs.rightArm.rotation.x = swing;
                    }

                    // Enemy Shooting AI
                    if (Date.now() - enemy.lastShot > 1000 && dist < 30) {
                        enemyShoot(enemy);
                        enemy.lastShot = Date.now() + Math.random() * 500;
                    }
                });

                // Wave Progress Check
                if (enemies.length === 0 && enemiesToSpawn <= 0) {
                    wave++;
                    score += 600;
                    startWave();
                }

                // Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.mesh.position.add(p.vel);
                    p.life--;
                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        particles.splice(i, 1);
                    }
                }

                // Draw Radar
                drawRadar();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            init3D();
            animate();
        };
    </script>
</body>
</html>
