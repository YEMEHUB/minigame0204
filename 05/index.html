<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>똥 피하기 & 열쇠 모으기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
        
        body {
            font-family: 'Jua', 'Gowun Dodum', sans-serif;
            background-color: #ffffff;
            touch-action: manipulation;
            user-select: none;
        }

        canvas {
            background-color: #f8fafc;
            border: 3px solid #7dd3fc;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.15);
        }

        .sky-text {
            color: #0284c7;
        }

        .sky-btn {
            background-color: #38bdf8;
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .sky-btn:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
        }

        .sky-btn:active {
            transform: translateY(0);
        }

        /* Key slots styling */
        .key-slot {
            width: 38px;
            height: 38px;
            border: 2px dashed #bae6fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            transition: all 0.3s ease;
        }

        .key-slot.active {
            border: 2px solid #0284c7;
            background-color: #e0f2fe;
            color: #0284c7;
            transform: scale(1.1);
            animation: pulse 1s infinite alternate;
        }

        /* Heart animation */
        .heart-icon {
            color: #ef4444;
            transition: all 0.2s ease;
        }

        .heart-empty {
            color: #cbd5e1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-between p-4 max-w-lg mx-auto">

    <!-- 상단 헤더 & 상태창 -->
    <header class="w-full text-center mt-2 mb-2">
        <h1 class="text-3xl sm:text-4xl font-bold sky-text tracking-wide mb-1">
            <i class="fa-solid fa-poop text-amber-800 mr-1"></i> 똥 피하기
        </h1>
        <p class="text-sm sky-text opacity-80">똥을 피하고 열쇠 4개를 모으세요!</p>

        <!-- 열쇠 현황 & 점수 & 목숨 -->
        <div class="flex justify-between items-center bg-sky-50 rounded-2xl p-3 my-3 border border-sky-200">
            <!-- 목숨 (하트 3개) -->
            <div class="flex flex-col items-start pl-2">
                <span class="text-xs text-sky-600 font-bold mb-1">LIFE</span>
                <div id="lives-container" class="flex gap-1 text-lg">
                    <i class="fa-solid fa-heart heart-icon"></i>
                    <i class="fa-solid fa-heart heart-icon"></i>
                    <i class="fa-solid fa-heart heart-icon"></i>
                </div>
            </div>

            <!-- 점수 및 생존 시간 -->
            <div class="flex flex-col items-center">
                <span class="text-xs text-sky-600 font-bold">SCORE</span>
                <span id="score-display" class="text-xl font-extrabold sky-text">0</span>
                <span id="time-display" class="text-xs text-sky-700 font-semibold mt-0.5">0s</span>
            </div>

            <!-- 열쇠 4개 수집 슬롯 -->
            <div class="flex flex-col items-end pr-2">
                <span id="mode-target-title" class="text-xs text-sky-600 font-bold mb-1">열쇠 수집 (4개)</span>
                <div id="keys-container" class="flex gap-1.5">
                    <div id="key-1" class="key-slot"><i class="fa-solid fa-key"></i></div>
                    <div id="key-2" class="key-slot"><i class="fa-solid fa-key"></i></div>
                    <div id="key-3" class="key-slot"><i class="fa-solid fa-key"></i></div>
                    <div id="key-4" class="key-slot"><i class="fa-solid fa-key"></i></div>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 게임 캔버스 영역 -->
    <div class="relative w-full flex-grow flex items-center justify-center">
        <canvas id="gameCanvas" class="rounded-2xl w-full max-h-[60vh] object-contain"></canvas>

        <!-- 게임 시작 / 오버 / 클리어 / 메인 메뉴 오버레이 모달 -->
        <div id="overlay" class="absolute inset-0 bg-white/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10">
            <div id="modal-content" class="flex flex-col items-center w-full max-w-xs">
                <div id="modal-icon" class="text-5xl mb-3 text-sky-400">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <h2 id="modal-title" class="text-3xl font-extrabold sky-text mb-2">똥 피하기</h2>
                <p id="modal-desc" class="text-gray-600 text-xs sm:text-sm mb-5">
                    게임 모드를 선택하세요!
                </p>

                <!-- 게임 모드 선택 버튼 영역 -->
                <div id="mode-select-box" class="w-full flex flex-col gap-3 mb-2">
                    <button id="btn-mode-normal" class="sky-btn font-bold py-3 px-4 rounded-2xl text-base flex items-center justify-center gap-2 cursor-pointer shadow-md">
                        <i class="fa-solid fa-key text-amber-300"></i> 일반 모드 (열쇠 4개)
                    </button>
                    <button id="btn-mode-endless" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-2xl text-base flex items-center justify-center gap-2 cursor-pointer shadow-md transition-all">
                        <i class="fa-solid fa-infinity text-amber-300"></i> 무한 모드 (점수 경쟁)
                    </button>
                </div>

                <!-- 재시작/메인으로 버튼 (게임 종료 시 활성화) -->
                <div id="game-over-box" class="w-full flex-col gap-2 hidden">
                    <button id="restart-btn" class="sky-btn font-bold py-3 px-4 rounded-full w-full cursor-pointer text-base">
                        다시 도전하기
                    </button>
                    <button id="main-menu-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-full w-full cursor-pointer text-sm transition-all mt-1">
                        메인 메뉴로
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 모바일 컨트롤 버튼 (하단) -->
    <footer class="w-full mt-3 mb-2 flex justify-between gap-4">
        <button id="btn-left" class="sky-btn flex-1 py-4 rounded-2xl text-2xl font-bold flex items-center justify-center active:scale-95 transition-transform">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button id="btn-right" class="sky-btn flex-1 py-4 rounded-2xl text-2xl font-bold flex items-center justify-center active:scale-95 transition-transform">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </footer>

    <script>
        // --- 게임 상수 및 상태 변수 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 모달 UI 엘리먼트
        const overlay = document.getElementById('overlay');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modeSelectBox = document.getElementById('mode-select-box');
        const gameOverBox = document.getElementById('game-over-box');
        const btnModeNormal = document.getElementById('btn-mode-normal');
        const btnModeEndless = document.getElementById('btn-mode-endless');
        const restartBtn = document.getElementById('restart-btn');
        const mainMenuBtn = document.getElementById('main-menu-btn');

        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const livesContainer = document.getElementById('lives-container');
        const modeTargetTitle = document.getElementById('mode-target-title');
        const keysContainer = document.getElementById('keys-container');

        // 게임 설정
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 550;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        let gameState = 'START'; // START, PLAYING, GAMEOVER, CLEAR
        let gameMode = 'NORMAL'; // NORMAL (열쇠 4개), ENDLESS (무한 모드)
        let animationFrameId;
        let startTime = 0;
        let elapsedTime = 0;
        let score = 0;

        // 플레이어 설정
        const player = {
            x: CANVAS_WIDTH / 2 - 20,
            y: CANVAS_HEIGHT - 60,
            width: 40,
            height: 40,
            speed: 6.5,
            lives: 3,
            maxLives: 3,
            invincibleTimer: 0,
            keysCollected: 0
        };

        // 객체 생성 배열 (똥, 하트 아이템, 열쇠, 골드)
        let items = [];
        let spawnTimer = 0;

        // 키 상태 관리
        const keys = {
            left: false,
            right: false
        };

        // --- 컨트롤 이벤트 리스너 ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        // 모바일 터치 버튼 이벤트
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const addTouchEvents = (btn, keyProp) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
            btn.addEventListener('mousedown', () => { keys[keyProp] = true; });
            btn.addEventListener('mouseup', () => { keys[keyProp] = false; });
            btn.addEventListener('mouseleave', () => { keys[keyProp] = false; });
        };

        addTouchEvents(btnLeft, 'left');
        addTouchEvents(btnRight, 'right');

        // --- 아이템 생성 로직 ---
        function spawnItem() {
            const rand = Math.random();
            let type = 'poop';
            // 최대 낙하 속도 한계 14로 설정 (기본 3.8 ~ 최대 14.0)
            const calculatedSpeed = 3.8 + Math.random() * 1.2 + (elapsedTime * 0.16);
            let speed = Math.min(14.0, calculatedSpeed);
            let size = 30;

            if (gameMode === 'NORMAL') {
                if (rand < 0.025 && player.keysCollected < 4) {
                    type = 'key';
                    speed = Math.min(11.0, 5.5 + (elapsedTime * 0.09));
                    size = 32;
                } else if (rand < 0.055 && player.lives < player.maxLives) {
                    type = 'heart';
                    speed = Math.min(10.5, 4.5 + (elapsedTime * 0.08));
                    size = 32;
                }
            } else if (gameMode === 'ENDLESS') {
                // 무한 모드: 골드 아이템(+10,000점) 및 하트 등장
                if (rand < 0.02) {
                    type = 'gold'; // 골드 아이템 🪙
                    speed = Math.min(11.5, 6.0 + (elapsedTime * 0.09));
                    size = 34;
                } else if (rand < 0.05 && player.lives < player.maxLives) {
                    type = 'heart';
                    speed = Math.min(10.5, 4.5 + (elapsedTime * 0.08));
                    size = 32;
                }
            }

            const x = Math.random() * (CANVAS_WIDTH - size);
            items.push({
                x: x,
                y: -size,
                width: size,
                height: size,
                type: type,
                speed: speed,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.12
            });
        }

        // --- 그리기 함수들 ---

        // 플레이어 캐릭터 그리기
        function drawPlayer() {
            if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 5) % 2 === 0) {
                return;
            }

            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

            ctx.beginPath();
            ctx.arc(0, 0, player.width / 2, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#0284c7';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-7, -4, 5, 0, Math.PI * 2);
            ctx.arc(7, -4, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(-6, -4, 2.5, 0, Math.PI * 2);
            ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            if (player.invincibleTimer > 0) {
                ctx.arc(0, 6, 4, 0, Math.PI * 2);
            } else {
                ctx.arc(0, 4, 6, 0, Math.PI);
            }
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        // 아이템 그리기
        function drawItems() {
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
                ctx.rotate(item.rotation);

                ctx.font = `${item.width}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (item.type === 'poop') {
                    ctx.fillText('💩', 0, 0);
                } else if (item.type === 'heart') {
                    ctx.fillText('💖', 0, 0);
                } else if (item.type === 'key') {
                    ctx.fillText('🔑', 0, 0);
                } else if (item.type === 'gold') {
                    ctx.fillText('🪙', 0, 0);
                }

                ctx.restore();
            });
        }

        // --- 충돌 판정 ---
        function checkCollision(rect1, rect2) {
            const padding = 6;
            return (
                rect1.x + padding < rect2.x + rect2.width &&
                rect1.x + rect1.width - padding > rect2.x &&
                rect1.y + padding < rect2.y + rect2.height &&
                rect1.y + rect1.height - padding > rect2.y
            );
        }

        function updateLivesUI() {
            const hearts = livesContainer.querySelectorAll('i');
            hearts.forEach((heart, index) => {
                if (index < player.lives) {
                    heart.className = 'fa-solid fa-heart heart-icon';
                } else {
                    heart.className = 'fa-solid fa-heart heart-empty';
                }
            });
        }

        function updateKeySlots() {
            for (let i = 1; i <= 4; i++) {
                const slot = document.getElementById(`key-${i}`);
                if (slot) {
                    if (i <= player.keysCollected) {
                        slot.classList.add('active');
                    } else {
                        slot.classList.remove('active');
                    }
                }
            }
        }

        // --- 게임 메인 루프 ---
        function update() {
            if (gameState !== 'PLAYING') return;

            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            timeDisplay.textContent = `${elapsedTime}s`;

            score += 1;
            scoreDisplay.textContent = score.toLocaleString();

            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
            }

            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.width;

            spawnTimer++;
            const dynamicInterval = Math.max(8, 22 - Math.floor(elapsedTime / 2));
            if (spawnTimer >= dynamicInterval) {
                spawnItem();
                spawnTimer = 0;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;
                item.rotation += item.rotSpeed;

                if (checkCollision(player, item)) {
                    if (item.type === 'poop') {
                        if (player.invincibleTimer <= 0) {
                            player.lives--;
                            updateLivesUI();
                            player.invincibleTimer = 45;
                            
                            items.splice(i, 1);

                            if (player.lives <= 0) {
                                gameOver();
                                return;
                            }
                        }
                    } else if (item.type === 'heart') {
                        if (player.lives < player.maxLives) {
                            player.lives++;
                            updateLivesUI();
                        }
                        score += 300;
                        items.splice(i, 1);
                        continue;
                    } else if (item.type === 'key') {
                        player.keysCollected++;
                        updateKeySlots();
                        score += 1000;
                        items.splice(i, 1);

                        if (player.keysCollected >= 4) {
                            gameClear();
                            return;
                        }
                        continue;
                    } else if (item.type === 'gold') {
                        // 골드 아이템: 스코어 +10,000점!
                        score += 10000;
                        items.splice(i, 1);
                        continue;
                    }
                }

                if (item.y > CANVAS_HEIGHT) {
                    if (item.type === 'poop') {
                        score += 50;
                    }
                    items.splice(i, 1);
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for (let x = 0; x < CANVAS_WIDTH; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }

            drawItems();
            drawPlayer();
        }

        function gameLoop() {
            update();
            render();
            if (gameState === 'PLAYING') {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // UI를 모드에 맞게 구성
        function setupUIForMode() {
            if (gameMode === 'NORMAL') {
                modeTargetTitle.textContent = '열쇠 수집 (4개)';
                keysContainer.classList.remove('hidden');
            } else {
                modeTargetTitle.textContent = '무한 모드 (♾️)';
                keysContainer.classList.add('hidden');
            }
        }

        function resetGame() {
            player.x = CANVAS_WIDTH / 2 - 20;
            player.lives = player.maxLives;
            player.invincibleTimer = 0;
            player.keysCollected = 0;
            items = [];
            spawnTimer = 0;
            startTime = Date.now();
            elapsedTime = 0;
            score = 0;

            setupUIForMode();
            updateLivesUI();
            updateKeySlots();
            scoreDisplay.textContent = '0';
            timeDisplay.textContent = '0s';
        }

        function startGame(selectedMode) {
            gameMode = selectedMode;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            resetGame();
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
            gameLoop();
        }

        function showMainMenu() {
            gameState = 'START';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            modalIcon.innerHTML = '<i class="fa-solid fa-gamepad"></i>';
            modalTitle.textContent = '똥 피하기';
            modalTitle.className = 'text-3xl font-extrabold sky-text mb-2';
            modalDesc.textContent = '게임 모드를 선택하세요!';

            modeSelectBox.classList.remove('hidden');
            modeSelectBox.classList.add('flex');
            gameOverBox.classList.add('hidden');
            gameOverBox.classList.remove('flex');

            overlay.classList.remove('hidden');
            render();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            cancelAnimationFrame(animationFrameId);

            modalIcon.innerHTML = '<i class="fa-solid fa-face-sad-tear text-rose-400"></i>';
            modalTitle.textContent = '게임 오버!';
            modalTitle.className = 'text-3xl font-extrabold text-rose-500 mb-2';
            
            let modeInfo = gameMode === 'NORMAL' ? `열쇠: <span class="sky-text font-bold">${player.keysCollected}/4</span>` : '<span class="text-indigo-600 font-bold">무한 서바이벌 모드</span>';
            modalDesc.innerHTML = `하트가 모두 소진되었습니다! 💩<br>최종 점수: <span class="sky-text font-bold">${score.toLocaleString()}점</span><br>생존 시간: <span class="sky-text font-bold">${elapsedTime}초</span> | ${modeInfo}`;

            modeSelectBox.classList.add('hidden');
            modeSelectBox.classList.remove('flex');
            gameOverBox.classList.remove('hidden');
            gameOverBox.classList.add('flex');

            overlay.classList.remove('hidden');
        }

        function gameClear() {
            gameState = 'CLEAR';
            cancelAnimationFrame(animationFrameId);

            modalIcon.innerHTML = '<i class="fa-solid fa-trophy text-amber-400"></i>';
            modalTitle.textContent = '축하합니다! 승리!';
            modalTitle.className = 'text-3xl font-extrabold sky-text mb-2';
            modalDesc.innerHTML = `열쇠 4개를 모두 수집했습니다! 🔑✨<br>최종 점수: <span class="sky-text font-bold">${score.toLocaleString()}점</span><br>클리어 시간: <span class="sky-text font-bold">${elapsedTime}초</span>`;

            modeSelectBox.classList.add('hidden');
            modeSelectBox.classList.remove('flex');
            gameOverBox.classList.remove('hidden');
            gameOverBox.classList.add('flex');

            overlay.classList.remove('hidden');
        }

        // 모드 선택 버튼 이벤트
        btnModeNormal.onclick = () => startGame('NORMAL');
        btnModeEndless.onclick = () => startGame('ENDLESS');
        restartBtn.onclick = () => startGame(gameMode);
        mainMenuBtn.onclick = showMainMenu;

        // 초기 화면 드로잉
        showMainMenu();
    </script>
</body>
</html>
