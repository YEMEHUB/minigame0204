<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash - Geometry Rhythm Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #080811;
            color: #fff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 캔버스 글로우 효과 */
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        /* 네온 텍스트 효과 */
        .neon-text-blue {
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-text-pink {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        /* 버튼 애니메이션 및 글로우 */
        .btn-neon {
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
        }
        .btn-neon:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }
        .btn-neon:active {
            transform: scale(0.95);
        }

        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 sm:p-4 bg-slate-950 select-none">

    <!-- Header Section -->
    <div class="w-full max-w-4xl flex justify-between items-center mb-2 px-2">
        <div class="flex items-center space-x-2">
            <i class="fa-solid font-bold text-cyan-400 text-2xl fa-cube animate-bounce"></i>
            <h1 class="text-xl sm:text-3xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-pink-500">
                NEON DASH
            </h1>
        </div>
        <!-- Practice / Normal Mode Display -->
        <div class="text-xs sm:text-sm font-semibold tracking-wide text-cyan-300 bg-slate-900/80 border border-cyan-500/30 px-3 py-1.5 rounded-full backdrop-blur-md">
            PROG: <span id="progress-percent" class="text-amber-400 font-bold">0%</span>
        </div>
    </div>

    <!-- Main Game Viewport -->
    <div class="relative w-full max-w-4xl aspect-[16/9] bg-slate-900 rounded-2xl overflow-hidden border-2 border-cyan-500/30 shadow-2xl flex items-center justify-center">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" class="w-full h-full"></canvas>

        <!-- UI Overlay: Start / Game Over / Victory Screens -->
        <div id="overlayScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity duration-300">
            <!-- Title Section -->
            <div id="startView" class="flex flex-col items-center">
                <h2 class="text-3xl sm:text-5xl font-black text-cyan-400 mb-2 tracking-widest neon-text-blue">
                    RHYTHM DASH
                </h2>
                <p class="text-slate-400 text-xs sm:text-sm mb-6 max-w-md">
                    스페이스바 또는 화면을 클릭하여 점프하고 obstacles를 피하세요! 비트와 타이밍에 맞춰 끝까지 도착하세요.
                </p>
                <div class="flex flex-col sm:flex-row gap-4">
                    <button id="startBtn" class="btn-neon text-slate-950 font-black px-8 py-3 rounded-full text-base sm:text-lg tracking-wider uppercase cursor-pointer">
                        <i class="fa-solid fa-play mr-2"></i> 게임 시작
                    </button>
                </div>
            </div>

            <!-- Game Over View (Hidden by default) -->
            <div id="gameOverView" class="hidden flex-col items-center">
                <h2 class="text-3xl sm:text-5xl font-black text-pink-500 mb-2 tracking-widest neon-text-pink">
                    CRASHED!
                </h2>
                <p id="deathStats" class="text-slate-300 text-sm mb-6">진행도: 0%</p>
                <button id="retryBtn" class="btn-neon text-slate-950 font-black px-8 py-3 rounded-full text-base sm:text-lg tracking-wider uppercase cursor-pointer">
                    <i class="fa-solid fa-rotate-right mr-2"></i> 다시 시도
                </button>
            </div>

            <!-- Victory View (Hidden by default) -->
            <div id="victoryView" class="hidden flex-col items-center">
                <h2 class="text-3xl sm:text-5xl font-black text-yellow-400 mb-2 tracking-widest">
                    STAGE CLEAR!
                </h2>
                <p class="text-cyan-300 text-sm mb-6">축하합니다! 비트를 완전히 완주하셨습니다.</p>
                <button id="victoryBtn" class="btn-neon text-slate-950 font-black px-8 py-3 rounded-full text-base sm:text-lg tracking-wider uppercase cursor-pointer">
                    <i class="fa-solid fa-forward mr-2"></i> 다시 플레이
                </button>
            </div>
        </div>

        <!-- In-game Pause/Audio Toggle -->
        <div class="absolute top-3 right-3 z-20 flex gap-2">
            <button id="soundToggleBtn" class="w-10 h-10 rounded-full bg-slate-900/80 border border-slate-700 text-cyan-400 flex items-center justify-center hover:bg-slate-800 transition">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
        </div>
    </div>

    <!-- Controls / Instructions Footer -->
    <div class="w-full max-w-4xl mt-3 flex flex-wrap justify-between items-center text-xs text-slate-400 px-2 gap-2">
        <div class="flex items-center gap-4">
            <span class="flex items-center"><kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 mr-1.5 font-mono">Space</kbd> / <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 mx-1.5 font-mono">L-Click</kbd> 점프</span>
            <span class="flex items-center"><kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 mr-1.5 font-mono">P</kbd> 일시정지</span>
        </div>
        <div class="text-slate-500">
            팁: 노란 패드는 높은 점프, 파란 패드는 중력 반전!
        </div>
    </div>

    <!-- Main Game Logic Script -->
    <script>
        // --- Web Audio API Synth & Music Generator ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.tempo = 130; // BPM
                this.nextNoteTime = 0;
                this.currentBeat = 0;
                this.isPlaying = false;
                this.timerId = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Simple Sound FX Synth
            playJumpSound(isHigh = false) {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'square';
                const startFreq = isHigh ? 500 : 300;
                const endFreq = isHigh ? 900 : 600;
                
                osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playExplosionSound() {
                if (this.isMuted || !this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
                noise.stop(this.ctx.currentTime + 0.3);
            }

            playPadSound() {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            // Procedural Cyberpunk Synthesizer Beat
            startMusic() {
                this.init();
                this.isPlaying = true;
                this.currentBeat = 0;
                this.nextNoteTime = this.ctx.currentTime;
                this.scheduler();
            }

            stopMusic() {
                this.isPlaying = false;
                clearTimeout(this.timerId);
            }

            scheduler() {
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    this.playBeat(this.currentBeat, this.nextNoteTime);
                    this.advanceNote();
                }
                if (this.isPlaying) {
                    this.timerId = setTimeout(() => this.scheduler(), 25);
                }
            }

            advanceNote() {
                const secondsPerBeat = 60.0 / this.tempo / 4; // 16th notes
                this.nextNoteTime += secondsPerBeat;
                this.currentBeat = (this.currentBeat + 1) % 64;
            }

            playBeat(beat, time) {
                if (this.isMuted) return;

                // Kick (Every 4 sixteenth notes = Quarter notes)
                if (beat % 4 === 0) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(150, time);
                    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.15);
                    gain.gain.setValueAtTime(0.4, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.15);
                }

                // Hi-Hat (Offbeats)
                if (beat % 2 === 1) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'highpass';
                    osc.frequency.setValueAtTime(8000, time);
                    gain.gain.setValueAtTime(0.05, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.05);
                }

                // Synth Bass Synth Line
                const bassNotes = [110, 110, 130, 110, 146, 110, 130, 98];
                const noteIndex = Math.floor(beat / 2) % bassNotes.length;
                if (beat % 2 === 0) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(bassNotes[noteIndex] / 2, time);
                    gain.gain.setValueAtTime(0.08, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.12);
                }
            }
        }

        const audio = new SoundEngine();

        // --- Game Setup & Canvas Engine ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Design dimensions (fixed internal resolution 1280x720)
        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // Constants & Physics Parameters
        const GRAVITY = 1.45;
        const JUMP_FORCE = -21.5;
        const SPEED = 13.5; // Increased speed from 11.0 to 13.5 for even faster gameplay
        const GROUND_Y = GAME_HEIGHT - 120;
        const CEILING_Y = 120;

        // Game State Variables
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', 'VICTORY'
        let cameraX = 0;
        let progress = 0;
        let particles = [];
        let backgroundBgOffset = 0;

        // Player Cube Object
        const player = {
            x: 200,
            y: GROUND_Y - 50,
            width: 50,
            height: 50,
            vy: 0,
            rotation: 0,
            isGrounded: false,
            gravityDir: 1, // 1: Down, -1: Up (Gravity Portal feature)
            hasJumped: false,

            reset() {
                this.x = 200;
                this.y = GROUND_Y - 50;
                this.vy = 0;
                this.rotation = 0;
                this.isGrounded = false;
                this.gravityDir = 1;
                this.hasJumped = false;
            },

            jump(force = JUMP_FORCE) {
                if (this.isGrounded) {
                    this.vy = force * this.gravityDir;
                    this.isGrounded = false;
                    audio.playJumpSound(force < JUMP_FORCE);
                    createJumpParticles(this.x + this.width / 2, this.gravityDir === 1 ? this.y + this.height : this.y);
                }
            },

            update() {
                // Apply Gravity
                this.vy += GRAVITY * this.gravityDir;
                this.y += this.vy;

                // Move forward horizontally
                this.x += SPEED;

                // Rotate cube while in air
                if (!this.isGrounded) {
                    this.rotation += 8 * this.gravityDir;
                } else {
                    // Snap rotation to nearest 90 deg when landing
                    this.rotation = Math.round(this.rotation / 90) * 90;
                }

                // Ground Collision
                if (this.gravityDir === 1 && this.y + this.height >= GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                } 
                // Ceiling Collision (when inverted)
                else if (this.gravityDir === -1 && this.y <= CEILING_Y) {
                    this.y = CEILING_Y;
                    this.vy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x - cameraX + this.width / 2, this.y + this.height / 2);
                ctx.rotate((this.rotation * Math.PI) / 180);

                // Neon Outer Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';

                // Cube Body
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

                // Inner Accent Geometry
                ctx.strokeStyle = '#080811';
                ctx.lineWidth = 4;
                ctx.strokeRect(-this.width / 4, -this.height / 4, this.width / 2, this.height / 2);

                // Eyes / Face Details
                ctx.fillStyle = '#080811';
                ctx.fillRect(-12, -12, 8, 12);
                ctx.fillRect(4, -12, 8, 12);

                ctx.restore();
            }
        };

        // --- Map & Level Design ---
        // Types: 'spike', 'block', 'pad_yellow', 'pad_blue' (gravity flip)
        let mapObjects = [];
        const LEVEL_LENGTH = 18000; // End point of the level

        function generateLevel() {
            mapObjects = [];
            let curX = 800;

            // Helper to add obstacles
            const addSpike = (x, y = GROUND_Y, inverted = false) => {
                mapObjects.push({ type: 'spike', x, y: inverted ? y : y - 50, w: 50, h: 50, inverted });
            };
            const addBlock = (x, y = GROUND_Y - 50, w = 50, h = 50) => {
                mapObjects.push({ type: 'block', x, y, w, h });
            };
            const addPad = (x, y = GROUND_Y - 15, padType = 'yellow') => {
                mapObjects.push({ type: padType === 'yellow' ? 'pad_yellow' : 'pad_blue', x, y, w: 60, h: 15 });
            };

            // Procedurally build structured rhythm obstacle patterns
            while (curX < LEVEL_LENGTH - 1000) {
                let pattern = Math.floor(Math.random() * 6);

                switch (pattern) {
                    case 0: // Single & Double Spikes
                        addSpike(curX);
                        curX += 450;
                        addSpike(curX);
                        addSpike(curX + 50);
                        curX += 500;
                        break;

                    case 1: // Block Jump Sequence
                        addBlock(curX, GROUND_Y - 50, 100, 50);
                        addSpike(curX + 25, GROUND_Y - 100);
                        curX += 350;
                        addBlock(curX, GROUND_Y - 100, 150, 100);
                        curX += 500;
                        break;

                    case 2: // Yellow Bounce Pad Stair
                        addSpike(curX);
                        addSpike(curX + 50);
                        addPad(curX - 100, GROUND_Y - 15, 'yellow');
                        curX += 450;
                        addBlock(curX, GROUND_Y - 120, 200, 30);
                        curX += 500;
                        break;

                    case 3: // Gravity Flip Zone
                        addPad(curX, GROUND_Y - 15, 'blue');
                        // Add ceiling spikes
                        addSpike(curX + 300, CEILING_Y, true);
                        addSpike(curX + 350, CEILING_Y, true);
                        // Gravity flip back pad on ceiling
                        addPad(curX + 600, CEILING_Y, 'blue');
                        curX += 900;
                        break;

                    case 4: // Triple Spike Precision Jump
                        addSpike(curX);
                        addSpike(curX + 48);
                        addSpike(curX + 96);
                        curX += 600;
                        break;

                    case 5: // Staircase Over Pit
                        addBlock(curX, GROUND_Y - 50, 80, 50);
                        addBlock(curX + 150, GROUND_Y - 100, 80, 100);
                        addBlock(curX + 300, GROUND_Y - 150, 80, 150);
                        addSpike(curX + 150, GROUND_Y);
                        curX += 600;
                        break;
                }
            }

            // Finish Line Portal / Wall
            mapObjects.push({ type: 'finish', x: LEVEL_LENGTH, y: 0, w: 80, h: GAME_HEIGHT });
        }

        // --- Particle Visual FX ---
        function createJumpParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 6 + 2,
                    color: '#00f0ff',
                    life: 1.0
                });
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16,
                    size: Math.random() * 8 + 3,
                    color: Math.random() > 0.5 ? '#ff007f' : '#ff9900',
                    life: 1.0
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Input Handling ---
        let inputActive = false;

        function handleInputStart() {
            if (gameState === 'PLAYING') {
                inputActive = true;
                player.jump();
            }
        }

        function handleInputEnd() {
            inputActive = false;
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    handleInputStart();
                } else if (gameState === 'GAMEOVER' || gameState === 'START') {
                    startGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleInputEnd();
            }
        });

        // Touch / Mouse Handling
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            handleInputStart();
        });
        canvas.addEventListener('mouseup', handleInputEnd);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInputStart();
        }, { passive: false });
        canvas.addEventListener('touchend', handleInputEnd);

        // --- Collision Detection & Game Logic ---
        function checkCollisions() {
            // Keep jumping continuous if holding key/mouse
            if (inputActive && player.isGrounded) {
                player.jump();
            }

            // Player hit box with small inner margin for fair precision
            const playerHitBox = {
                x: player.x + 4,
                y: player.y + 4,
                w: player.width - 8,
                h: player.height - 8
            };

            for (let obj of mapObjects) {
                // Camera Culling (only check objects near player)
                if (obj.x < player.x - 200 || obj.x > player.x + 800) continue;

                // 1. Spikes Collision (Precision Triangle/Shrunk Hitbox)
                if (obj.type === 'spike') {
                    // Shrunk spike hitbox to match triangular visual shape precisely
                    const spikeHitBox = {
                        x: obj.x + 10,
                        y: obj.inverted ? obj.y : obj.y + 10,
                        w: obj.w - 20,
                        h: obj.h - 10
                    };

                    if (
                        playerHitBox.x < spikeHitBox.x + spikeHitBox.w &&
                        playerHitBox.x + playerHitBox.w > spikeHitBox.x &&
                        playerHitBox.y < spikeHitBox.y + spikeHitBox.h &&
                        playerHitBox.y + playerHitBox.h > spikeHitBox.y
                    ) {
                        triggerGameOver();
                        return;
                    }
                }

                // 2. Blocks -> Land or Side Crash
                else if (obj.type === 'block') {
                    if (
                        playerHitBox.x < obj.x + obj.w &&
                        playerHitBox.x + playerHitBox.w > obj.x &&
                        playerHitBox.y < obj.y + obj.h &&
                        playerHitBox.y + playerHitBox.h > obj.y
                    ) {
                        const prevY = player.y - player.vy;
                        
                        // Landing on top of block
                        if (player.gravityDir === 1 && prevY + player.height <= obj.y + 12) {
                            player.y = obj.y - player.height;
                            player.vy = 0;
                            player.isGrounded = true;
                        } 
                        // Landing under block (while inverted)
                        else if (player.gravityDir === -1 && prevY >= obj.y + obj.h - 12) {
                            player.y = obj.y + obj.h;
                            player.vy = 0;
                            player.isGrounded = true;
                        } 
                        // Side / Edge Collision -> Crash
                        else {
                            triggerGameOver();
                            return;
                        }
                    }
                }

                // Standard AABB check for pads & finish portal
                else {
                    if (
                        playerHitBox.x < obj.x + obj.w &&
                        playerHitBox.x + playerHitBox.w > obj.x &&
                        playerHitBox.y < obj.y + obj.h &&
                        playerHitBox.y + playerHitBox.h > obj.y
                    ) {
                        // 3. Bounce Pad (Yellow)
                        if (obj.type === 'pad_yellow') {
                            player.vy = JUMP_FORCE * 1.35 * player.gravityDir;
                            player.isGrounded = false;
                            audio.playPadSound();
                            createJumpParticles(player.x + player.width / 2, player.y + player.height);
                        }

                        // 4. Gravity Flip Pad (Blue) - Instantly launch towards opposing surface smoothly
                        if (obj.type === 'pad_blue') {
                            player.gravityDir *= -1; // Reverse gravity direction
                            player.vy = JUMP_FORCE * 1.2 * player.gravityDir; // Increased thrust to flip instantly across ceiling/ground
                            player.isGrounded = false;
                            audio.playPadSound();
                            createJumpParticles(player.x + player.width / 2, player.y + player.height / 2);
                        }

                        // 5. Finish Line -> Win
                        if (obj.type === 'finish') {
                            triggerVictory();
                            return;
                        }
                    }
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            audio.playExplosionSound();
            audio.stopMusic();
            createExplosion(player.x + player.width / 2, player.y + player.height / 2);

            document.getElementById('deathStats').innerText = `진행도: ${Math.floor(progress)}%`;
            document.getElementById('overlayScreen').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('startView').classList.add('hidden');
            document.getElementById('gameOverView').classList.remove('hidden');
            document.getElementById('gameOverView').classList.add('flex');
        }

        function triggerVictory() {
            gameState = 'VICTORY';
            audio.stopMusic();
            document.getElementById('overlayScreen').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('startView').classList.add('hidden');
            document.getElementById('gameOverView').classList.add('hidden');
            document.getElementById('victoryView').classList.remove('hidden');
            document.getElementById('victoryView').classList.add('flex');
        }

        function startGame() {
            player.reset();
            generateLevel();
            particles = [];
            gameState = 'PLAYING';

            document.getElementById('overlayScreen').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('startView').classList.add('hidden');
            document.getElementById('gameOverView').classList.add('hidden');
            document.getElementById('victoryView').classList.add('hidden');

            audio.startMusic();
        }

        // --- Rendering Loop ---
        function render() {
            // Smooth Camera Follow
            cameraX = player.x - 200;

            // Clear Background
            ctx.fillStyle = '#080811';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Dynamic Background Grid & Parallax Stars
            drawBackground();

            // Draw Ground and Ceiling Bounds
            drawEnvironment();

            // Draw Level Obstacles
            drawMapObjects();

            // Update & Draw Player Cube
            if (gameState === 'PLAYING') {
                player.update();
                checkCollisions();

                // Update Progress Percentage
                progress = Math.min(100, Math.max(0, (player.x / LEVEL_LENGTH) * 100));
                document.getElementById('progress-percent').innerText = `${Math.floor(progress)}%`;
            }

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                player.draw();
            }

            // Draw Particle FX
            updateAndDrawParticles();

            requestAnimationFrame(render);
        }

        // Background Parallax & Neon Visuals
        function drawBackground() {
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1;

            const gridSize = 80;
            const offsetX = - (cameraX * 0.3) % gridSize;

            for (let x = offsetX; x < GAME_WIDTH; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_HEIGHT);
                ctx.stroke();
            }

            for (let y = 0; y < GAME_HEIGHT; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }
        }

        function drawEnvironment() {
            ctx.shadowBlur = 12;

            // Ground Floor
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
            ctx.strokeStyle = '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(GAME_WIDTH, GROUND_Y);
            ctx.stroke();

            // Ceiling Floor
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, GAME_WIDTH, CEILING_Y);
            ctx.strokeStyle = '#ff007f';
            ctx.shadowColor = '#ff007f';
            ctx.beginPath();
            ctx.moveTo(0, CEILING_Y);
            ctx.lineTo(GAME_WIDTH, CEILING_Y);
            ctx.stroke();

            ctx.shadowBlur = 0; // Reset
        }

        function drawMapObjects() {
            for (let obj of mapObjects) {
                // Camera Culling
                if (obj.x - cameraX > GAME_WIDTH + 100 || obj.x - cameraX + obj.w < -100) continue;

                const screenX = obj.x - cameraX;

                // Spike (Hazard)
                if (obj.type === 'spike') {
                    ctx.save();
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ff0055';

                    ctx.beginPath();
                    if (!obj.inverted) {
                        ctx.moveTo(screenX, obj.y + obj.h);
                        ctx.lineTo(screenX + obj.w / 2, obj.y);
                        ctx.lineTo(screenX + obj.w, obj.y + obj.h);
                    } else {
                        ctx.moveTo(screenX, obj.y);
                        ctx.lineTo(screenX + obj.w / 2, obj.y + obj.h);
                        ctx.lineTo(screenX + obj.w, obj.y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                // Block
                else if (obj.type === 'block') {
                    ctx.save();
                    ctx.fillStyle = '#161b22';
                    ctx.strokeStyle = '#7000ff';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#7000ff';
                    ctx.lineWidth = 3;

                    ctx.fillRect(screenX, obj.y, obj.w, obj.h);
                    ctx.strokeRect(screenX, obj.y, obj.w, obj.h);
                    ctx.restore();
                }

                // Yellow Bounce Pad
                else if (obj.type === 'pad_yellow') {
                    ctx.save();
                    ctx.fillStyle = '#ffcc00';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffcc00';
                    ctx.fillRect(screenX, obj.y, obj.w, obj.h);
                    ctx.restore();
                }

                // Blue Gravity Pad
                else if (obj.type === 'pad_blue') {
                    ctx.save();
                    ctx.fillStyle = '#0099ff';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#0099ff';
                    ctx.fillRect(screenX, obj.y, obj.w, obj.h);
                    ctx.restore();
                }

                // Finish Portal Line
                else if (obj.type === 'finish') {
                    ctx.save();
                    const gradient = ctx.createLinearGradient(screenX, 0, screenX + obj.w, 0);
                    gradient.addColorStop(0, '#00f0ff');
                    gradient.addColorStop(0.5, '#ff007f');
                    gradient.addColorStop(1, '#ffcc00');
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#00f0ff';
                    ctx.fillRect(screenX, obj.y, obj.w, obj.h);
                    ctx.restore();
                }
            }
        }

        // --- Event Listeners UI ---
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('victoryBtn').addEventListener('click', startGame);

        // Sound Mute Toggle
        const soundBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        soundBtn.addEventListener('click', () => {
            audio.isMuted = !audio.isMuted;
            if (audio.isMuted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-cyan-400';
            }
        });

        // Initialize Level & Start Game Render Loop on Window Load
        window.onload = () => {
            generateLevel();
            render();
        };
    </script>
</body>
</html>
